<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 306.383" width="760" height="306.4" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En besvarelse vist som en zigzagformel med farvede hydrogenatomer og en tabel. Strukturen er 2-methylpropansyre, (CH3)2CH−CO−OH, tegnet som zigzagformel med alle hydrogenatomer. Signal 1 ved 1,20 ppm, 6 H, dublet, 1 nabo-H, er de to ens methylgrupper på CH og har røde hydrogenatomer. Signal 2 ved 2,58 ppm, 1 H, septet, 6 nabo-H, er CH-gruppen ved siden af C=O og har blå hydrogenatomer. Signal 3 ved 11,8 ppm, 1 H, bred singlet, er hydrogenatomet i carboxylgruppen og har grønne hydrogenatomer">
<title>En besvarelse vist som en zigzagformel med farvede hydrogenatomer og en tabel. Strukturen er 2-methylpropansyre, (CH3)2CH−CO−OH, tegnet som zigzagformel med alle hydrogenatomer. Signal 1 ved 1,20 ppm, 6 H, dublet, 1 nabo-H, er de to ens methylgrupper på CH og har røde hydrogenatomer. Signal 2 ved 2,58 ppm, 1 H, septet, 6 nabo-H, er CH-gruppen ved siden af C=O og har blå hydrogenatomer. Signal 3 ved 11,8 ppm, 1 H, bred singlet, er hydrogenatomet i carboxylgruppen og har grønne hydrogenatomer</title>
