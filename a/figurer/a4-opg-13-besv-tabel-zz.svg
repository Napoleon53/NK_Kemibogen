<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 309.824" width="760" height="309.8" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En besvarelse vist som en zigzagformel med farvede hydrogenatomer og en tabel. Strukturen er esteren CH3−CH2−CO−O−C(CH3)3, tegnet som zigzagformel med alle hydrogenatomer. Signal 1 ved 1,08 ppm, 3 H, triplet, 2 nabo-H, er methylgruppen ved siden af CH2 og har røde hydrogenatomer. Signal 2 ved 1,44 ppm, 9 H, singlet, ingen nabo-H, er de tre ens methylgrupper på samme carbonatom og har blå hydrogenatomer. Signal 3 ved 2,22 ppm, 2 H, kvartet, 3 nabo-H, er CH2-gruppen ved siden af C=O og har grønne hydrogenatomer">
