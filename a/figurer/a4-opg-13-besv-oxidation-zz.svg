<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280.383" width="760" height="280.4" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En besvarelse vist som en zigzagformel med farvede hydrogenatomer og en tabel for spektrum A. Strukturen er 1-phenylethanon: en benzenring med sidekæden CO−CH3, tegnet som zigzagformel med alle hydrogenatomer. Signal 1 ved 2,58 ppm, 3 H, singlet, ingen nabo-H, er methylgruppen ved siden af C=O og har røde hydrogenatomer. Signal 2 ved 7,6 ppm, 5 H, multiplet, er de fem hydrogenatomer på benzenringen og har lilla hydrogenatomer">
