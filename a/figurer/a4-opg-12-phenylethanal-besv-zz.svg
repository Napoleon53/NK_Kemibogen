<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 305.965" width="760" height="306" font-family="'Kemibogen I', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En besvarelse vist som en zigzagformel med farvede hydrogenatomer og en tabel. Strukturen er phenylethanal: en benzenring med sidekæden CH2−CHO, tegnet som zigzagformel med alle hydrogenatomer. Signal 1 ved 3,68 ppm, 2 H, dublet, 1 nabo-H, er CH2-gruppen mellem benzenringen og C=O og har røde hydrogenatomer. Signal 2 ved 7,30 ppm, 5 H, multiplet, er de fem hydrogenatomer på benzenringen og har lilla hydrogenatomer. Signal 3 ved 9,74 ppm, 1 H, triplet, 2 nabo-H, er hydrogenatomet i aldehydgruppen og har blå hydrogenatomer">
<title>En besvarelse vist som en zigzagformel med farvede hydrogenatomer og en tabel. Strukturen er phenylethanal: en benzenring med sidekæden CH2−CHO, tegnet som zigzagformel med alle hydrogenatomer. Signal 1 ved 3,68 ppm, 2 H, dublet, 1 nabo-H, er CH2-gruppen mellem benzenringen og C=O og har røde hydrogenatomer. Signal 2 ved 7,30 ppm, 5 H, multiplet, er de fem hydrogenatomer på benzenringen og har lilla hydrogenatomer. Signal 3 ved 9,74 ppm, 1 H, triplet, 2 nabo-H, er hydrogenatomet i aldehydgruppen og har blå hydrogenatomer</title>
