<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 357.965" width="760" height="358" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En besvarelse vist som en zigzagformel med farvede hydrogenatomer og en tabel. Strukturen er cuminaldehyd: en benzenring med aldehydgruppen H−CO− på den ene side og isopropylgruppen (CH3)2CH− på den modsatte side, tegnet som zigzagformel med alle hydrogenatomer. Signal 1 ved 1,28 ppm, 6 H, dublet, 1 nabo-H, er de to ens methylgrupper og har røde hydrogenatomer. Signal 2 ved 2,90 ppm, 1 H, septet, 6 nabo-H, er CH-gruppen på benzenringen og har blå hydrogenatomer. Signal 3 ved 7,38 ppm, 2 H, dublet, 1 nabo-H, er de to hydrogenatomer på ringen nærmest isopropylgruppen og har grønne hydrogenatomere. Signal 4 ved 7,80 ppm, 2 H, dublet, 1 nabo-H, er de to hydrogenatomer på ringen nærmest aldehydgruppen og har orange hydrogenatomere. Signal 5 ved 9,96 ppm, 1 H, singlet, er hydrogenatomet i aldehydgruppen og har lilla hydrogenatomer">
<title>En besvarelse vist som en zigzagformel med farvede hydrogenatomer og en tabel. Strukturen er cuminaldehyd: en benzenring med aldehydgruppen H−CO− på den ene side og isopropylgruppen (CH3)2CH− på den modsatte side, tegnet som zigzagformel med alle hydrogenatomer. Signal 1 ved 1,28 ppm, 6 H, dublet, 1 nabo-H, er de to ens methylgrupper og har røde hydrogenatomer. Signal 2 ved 2,90 ppm, 1 H, septet, 6 nabo-H, er CH-gruppen på benzenringen og har blå hydrogenatomer. Signal 3 ved 7,38 ppm, 2 H, dublet, 1 nabo-H, er de to hydrogenatomer på ringen nærmest isopropylgruppen og har grønne hydrogenatomere. Signal 4 ved 7,80 ppm, 2 H, dublet, 1 nabo-H, er de to hydrogenatomer på ringen nærmest aldehydgruppen og har orange hydrogenatomere. Signal 5 ved 9,96 ppm, 1 H, singlet, er hydrogenatomet i aldehydgruppen og har lilla hydrogenatomer</title>
