<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 331.965" width="760" height="332" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En besvarelse vist som en zigzagformel med farvede hydrogenatomer og en tabel. Strukturen er 2-phenylethanol, en benzenring med sidekæden CH2−CH2−O−H, tegnet som zigzagformel med alle hydrogenatomer. Signal 1 ved 1,9 ppm, 1 H, bred singlet, er hydrogenatomet på oxygen i hydroxygruppen. Signal 2 ved 2,86 ppm, 2 H, triplet, 2 nabo-H, er CH2-gruppen på benzenringen. Signal 3 ved 3,85 ppm, 2 H, triplet, 2 nabo-H, er CH2-gruppen på oxygen. Signal 4 ved 7,25 ppm, 5 H, multiplet, er de fem hydrogenatomer på benzenringen">
