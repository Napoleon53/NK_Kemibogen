<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 301.6" width="760" height="301.6" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En besvarelse vist som en zigzagformel med farvede hydrogenatomer og en tabel. Strukturen er ethylpropanoat, CH3−CH2−CO−O−CH2−CH3, tegnet som zigzagformel med alle hydrogenatomer. Signal A ved 1,14 ppm, 3 H, triplet, 2 nabo-H, er methylgruppen i ethylgruppen ved C=O og har røde hydrogenatomer. Signal B ved 1,26 ppm, 3 H, triplet, 2 nabo-H, er methylgruppen i ethylgruppen på oxygenatomet og har blå hydrogenatomer. Signal C ved 2,32 ppm, 2 H, kvartet, 3 nabo-H, er CH2-gruppen ved siden af C=O og har grønne hydrogenatomer. Signal D ved 4,13 ppm, 2 H, kvartet, 3 nabo-H, er CH2-gruppen på oxygenatomet i estergruppen og har orange hydrogenatomer">
<title>En besvarelse vist som en zigzagformel med farvede hydrogenatomer og en tabel. Strukturen er ethylpropanoat, CH3−CH2−CO−O−CH2−CH3, tegnet som zigzagformel med alle hydrogenatomer. Signal A ved 1,14 ppm, 3 H, triplet, 2 nabo-H, er methylgruppen i ethylgruppen ved C=O og har røde hydrogenatomer. Signal B ved 1,26 ppm, 3 H, triplet, 2 nabo-H, er methylgruppen i ethylgruppen på oxygenatomet og har blå hydrogenatomer. Signal C ved 2,32 ppm, 2 H, kvartet, 3 nabo-H, er CH2-gruppen ved siden af C=O og har grønne hydrogenatomer. Signal D ved 4,13 ppm, 2 H, kvartet, 3 nabo-H, er CH2-gruppen på oxygenatomet i estergruppen og har orange hydrogenatomer</title>
