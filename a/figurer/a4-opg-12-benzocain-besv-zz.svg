<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 361.824" width="760" height="361.8" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En besvarelse vist som en zigzagformel med farvede hydrogenatomer og en tabel. Strukturen er benzocain: en benzenring med en aminogruppe og en estergruppe med en ethylgruppe over for hinanden, tegnet som zigzagformel med alle hydrogenatomer. Signal 1 ved 1,36 ppm, 3 H, triplet, 2 nabo-H, er methylgruppen i ethylgruppen og har røde hydrogenatomer. Signal 2 ved 4,0 ppm, 2 H, bred singlet, er de to hydrogenatomer på nitrogen i aminogruppen og har blå hydrogenatomer. Signal 3 ved 4,30 ppm, 2 H, kvartet, 3 nabo-H, er CH2-gruppen på oxygen i estergruppen og har grønne hydrogenatomer. Signal 4 ved 6,63 ppm, 2 H, dublet, 1 nabo-H, er de to hydrogenatomer på ringen nærmest aminogruppen og har orange hydrogenatomere. Signal 5 ved 7,85 ppm, 2 H, dublet, 1 nabo-H, er de to hydrogenatomer på ringen nærmest estergruppen og har lilla hydrogenatomere">
<title>En besvarelse vist som en zigzagformel med farvede hydrogenatomer og en tabel. Strukturen er benzocain: en benzenring med en aminogruppe og en estergruppe med en ethylgruppe over for hinanden, tegnet som zigzagformel med alle hydrogenatomer. Signal 1 ved 1,36 ppm, 3 H, triplet, 2 nabo-H, er methylgruppen i ethylgruppen og har røde hydrogenatomer. Signal 2 ved 4,0 ppm, 2 H, bred singlet, er de to hydrogenatomer på nitrogen i aminogruppen og har blå hydrogenatomer. Signal 3 ved 4,30 ppm, 2 H, kvartet, 3 nabo-H, er CH2-gruppen på oxygen i estergruppen og har grønne hydrogenatomer. Signal 4 ved 6,63 ppm, 2 H, dublet, 1 nabo-H, er de to hydrogenatomer på ringen nærmest aminogruppen og har orange hydrogenatomere. Signal 5 ved 7,85 ppm, 2 H, dublet, 1 nabo-H, er de to hydrogenatomer på ringen nærmest estergruppen og har lilla hydrogenatomere</title>
