<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 307.441" width="760" height="307.4" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En besvarelse vist som en zigzagformel med farvede hydrogenatomer og en tabel. Strukturen er 3-hydroxybutan-2-on, CH3−CO−CH(OH)−CH3, tegnet som zigzagformel med alle hydrogenatomer. Signal A ved 1,38 ppm, 3 H, dublet, 1 nabo-H, er methylgruppen ved siden af CH-gruppen og har røde hydrogenatomer. Signal B ved 2,20 ppm, 3 H, singlet, ingen nabo-H, er methylgruppen ved siden af C=O og har blå hydrogenatomer. Signal C ved 3,6 ppm, 1 H, bred singlet, er hydrogenatomet på oxygen i hydroxygruppen og har grønne hydrogenatomer. Signal D ved 4,26 ppm, 1 H, kvartet, 3 nabo-H, er CH-gruppen, som sidder på oxygenatomet og ved siden af C=O, og har orange hydrogenatomer">
<title>En besvarelse vist som en zigzagformel med farvede hydrogenatomer og en tabel. Strukturen er 3-hydroxybutan-2-on, CH3−CO−CH(OH)−CH3, tegnet som zigzagformel med alle hydrogenatomer. Signal A ved 1,38 ppm, 3 H, dublet, 1 nabo-H, er methylgruppen ved siden af CH-gruppen og har røde hydrogenatomer. Signal B ved 2,20 ppm, 3 H, singlet, ingen nabo-H, er methylgruppen ved siden af C=O og har blå hydrogenatomer. Signal C ved 3,6 ppm, 1 H, bred singlet, er hydrogenatomet på oxygen i hydroxygruppen og har grønne hydrogenatomer. Signal D ved 4,26 ppm, 1 H, kvartet, 3 nabo-H, er CH-gruppen, som sidder på oxygenatomet og ved siden af C=O, og har orange hydrogenatomer</title>
