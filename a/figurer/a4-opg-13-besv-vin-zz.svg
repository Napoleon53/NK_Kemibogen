<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 357.965" width="760" height="358" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En besvarelse vist som en zigzagformel med farvede hydrogenatomer og en tabel. Strukturen er 4-ethylphenol: en benzenring med hydroxygruppen HO− på den ene side og ethylgruppen CH3−CH2− på den modsatte side, tegnet som zigzagformel med alle hydrogenatomer. Signal 1 ved 1,20 ppm, 3 H, triplet, 2 nabo-H, er methylgruppen og har røde hydrogenatomer. Signal 2 ved 2,57 ppm, 2 H, kvartet, 3 nabo-H, er CH2-gruppen på benzenringen og har blå hydrogenatomer. Signal 3 ved 4,7 ppm, 1 H, bred singlet, er hydrogenatomet på oxygen i hydroxygruppen og har grønne hydrogenatomer. Signal 4 ved 6,75 ppm, 2 H, dublet, 1 nabo-H, er de to hydrogenatomer på ringen nærmest hydroxygruppen og har orange hydrogenatomere. Signal 5 ved 7,05 ppm, 2 H, dublet, 1 nabo-H, er de to hydrogenatomer på ringen nærmest ethylgruppen og har lilla hydrogenatomere">
<title>En besvarelse vist som en zigzagformel med farvede hydrogenatomer og en tabel. Strukturen er 4-ethylphenol: en benzenring med hydroxygruppen HO− på den ene side og ethylgruppen CH3−CH2− på den modsatte side, tegnet som zigzagformel med alle hydrogenatomer. Signal 1 ved 1,20 ppm, 3 H, triplet, 2 nabo-H, er methylgruppen og har røde hydrogenatomer. Signal 2 ved 2,57 ppm, 2 H, kvartet, 3 nabo-H, er CH2-gruppen på benzenringen og har blå hydrogenatomer. Signal 3 ved 4,7 ppm, 1 H, bred singlet, er hydrogenatomet på oxygen i hydroxygruppen og har grønne hydrogenatomer. Signal 4 ved 6,75 ppm, 2 H, dublet, 1 nabo-H, er de to hydrogenatomer på ringen nærmest hydroxygruppen og har orange hydrogenatomere. Signal 5 ved 7,05 ppm, 2 H, dublet, 1 nabo-H, er de to hydrogenatomer på ringen nærmest ethylgruppen og har lilla hydrogenatomere</title>
