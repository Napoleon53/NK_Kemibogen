<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 234.542" width="760" height="234.5" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En besvarelse vist som en zigzagformel med farvede hydrogenatomer og en tabel. Strukturen er ethoxyethan, CH3−CH2−O−CH2−CH3, tegnet som zigzagformel med alle hydrogenatomer. Signal 1 ved 1,20 ppm, 6 H, triplet, 2 nabo-H, er de to ens methylgrupper og har røde hydrogenatomere. Signal 2 ved 3,47 ppm, 4 H, kvartet, 3 nabo-H, er de to ens CH2-grupper på oxygenatomet og har blå hydrogenatomere">
