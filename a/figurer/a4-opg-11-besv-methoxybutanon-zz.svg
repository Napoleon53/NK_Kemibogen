<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 301.6" width="760" height="301.6" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En besvarelse vist som en zigzagformel med farvede hydrogenatomer og en tabel. Strukturen er 4-methoxybutan-2-on, CH3−CO−CH2−CH2−O−CH3, tegnet som zigzagformel med alle hydrogenatomer. Signal A ved 2,17 ppm, 3 H, singlet, ingen nabo-H, er methylgruppen ved siden af C=O og har røde hydrogenatomer. Signal B ved 2,60 ppm, 2 H, triplet, 2 nabo-H, er CH2-gruppen ved siden af C=O og har blå hydrogenatomer. Signal C ved 3,33 ppm, 3 H, singlet, ingen nabo-H, er methylgruppen på oxygenatomet og har grønne hydrogenatomer. Signal D ved 3,63 ppm, 2 H, triplet, 2 nabo-H, er CH2-gruppen på oxygenatomet og har orange hydrogenatomer">
