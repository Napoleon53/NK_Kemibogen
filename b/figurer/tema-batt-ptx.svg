<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 254" width="670" height="254" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Power-to-X. Strøm fra sol og vind bruges til elektrolyse, som laver hydrogen af vand. Hydrogenet kan blive til ammoniak med nitrogen fra luften, til methanol med carbondioxid eller bruges direkte i brændselsceller og til at lave stål">
<title>Power-to-X. Strøm fra sol og vind bruges til elektrolyse, som laver hydrogen af vand. Hydrogenet kan blive til ammoniak med nitrogen fra luften, til methanol med carbondioxid eller bruges direkte i brændselsceller og til at lave stål</title>
<rect x="14.0" y="99.0" width="156.0" height="62.0" rx="10" fill="#fdf3d6" stroke="#d6b65a" stroke-width="1.6"/><text x="92.0" y="125.0" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Strøm</tspan></text><text x="92.0" y="146.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>fra sol og vind</tspan></text><line x1="172.0" y1="130.0" x2="204.0" y2="130.0" stroke="#14201f" stroke-width="2.2" stroke-linecap="round"/><polygon points="214.0,130.0 204.0,135.0 204.0,125.0" fill="#14201f"/><rect x="218.0" y="99.0" width="164.0" height="62.0" rx="10" fill="#e6f0f8" stroke="#9cbad6" stroke-width="1.6"/><text x="300.0" y="125.0" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Elektrolyse</tspan></text><text x="300.0" y="146.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>vand → hydrogen</tspan></text><line x1="384.0" y1="108.5" x2="462.0" y2="50.0" stroke="#14201f" stroke-width="2.2" stroke-linecap="round"/><polygon points="470.0,44.0 465.0,54.0 459.0,46.0" fill="#14201f"/><rect x="474.0" y="13.0" width="188.0" height="62.0" rx="10" fill="#e6f3ea" stroke="#8fc2a0" stroke-width="1.6"/><text x="568.0" y="39.0" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Ammoniak</tspan></text><text x="568.0" y="60.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>+ nitrogen fra luften</tspan></text><line x1="384.0" y1="130.0" x2="460.0" y2="130.0" stroke="#14201f" stroke-width="2.2" stroke-linecap="round"/><polygon points="470.0,130.0 460.0,135.0 460.0,125.0" fill="#14201f"/><rect x="474.0" y="99.0" width="188.0" height="62.0" rx="10" fill="#e6f3ea" stroke="#8fc2a0" stroke-width="1.6"/><text x="568.0" y="125.0" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Methanol</tspan></text><text x="568.0" y="146.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>+ carbondioxid</tspan></text><line x1="384.0" y1="151.5" x2="462.0" y2="210.0" stroke="#14201f" stroke-width="2.2" stroke-linecap="round"/><polygon points="470.0,216.0 459.0,214.0 465.0,206.0" fill="#14201f"/><rect x="474.0" y="185.0" width="188.0" height="62.0" rx="10" fill="#e6f3ea" stroke="#8fc2a0" stroke-width="1.6"/><text x="568.0" y="211.0" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Hydrogen direkte</tspan></text><text x="568.0" y="232.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>brændselsceller og stål</tspan></text>
