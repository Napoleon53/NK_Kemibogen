<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 306" width="740" height="306" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Energiprofil for en exoterm reaktion. Kurven går fra reaktanterne op over en top, det aktiverede kompleks, og ned til produkterne, som ligger lavere end reaktanterne. Afstanden fra reaktanterne op til toppen er aktiveringsenergien. Små kuglemodeller viser molekylerne A2 og B2, komplekset, hvor de gamle bindinger brydes og de nye dannes, og to molekyler AB">
<title>Energiprofil for en exoterm reaktion. Kurven går fra reaktanterne op over en top, det aktiverede kompleks, og ned til produkterne, som ligger lavere end reaktanterne. Afstanden fra reaktanterne op til toppen er aktiveringsenergien. Små kuglemodeller viser molekylerne A2 og B2, komplekset, hvor de gamle bindinger brydes og de nye dannes, og to molekyler AB</title>
