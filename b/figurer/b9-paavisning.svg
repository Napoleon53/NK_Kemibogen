<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 236" width="760" height="236" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Fire reagensglas med farvereaktioner, der påviser metalioner. Jern(III)ioner og thiocyanat giver en blodrød opløsning. Kobber(II)ioner og ammoniak giver en mørkeblå opløsning. Jern(III)ioner og salicylat giver en lilla opløsning. Nikkel(II)ioner og dimethylglyoxim giver et rødt bundfald">
<title>Fire reagensglas med farvereaktioner, der påviser metalioner. Jern(III)ioner og thiocyanat giver en blodrød opløsning. Kobber(II)ioner og ammoniak giver en mørkeblå opløsning. Jern(III)ioner og salicylat giver en lilla opløsning. Nikkel(II)ioner og dimethylglyoxim giver et rødt bundfald</title>
<g class="peg-vejledning" data-tekst="Peg på et reagensglas, og se, hvilken metalion farven afslører."/><g class="peg" data-titel="Jern(III)ioner og thiocyanat" data-tekst="Jern(III)ioner, Fe^{3+}, giver en blodrød opløsning, når der tilsættes thiocyanat, SCN^{−}. En farvereaktion, der kun sker med én bestemt metalion, kan bruges til at påvise ionen."><rect class="peg-maal" x="18.0" y="6.0" width="172.0" height="224.0" fill="none"/><text x="104.0" y="24.0" font-size="16" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Fe</tspan><tspan dy="-6.08" font-size="10.9">3+</tspan></text><text x="104.0" y="44.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>+ thiocyanat</tspan></text><clipPath id="glas104"><path d="M 81.0,58 V 175.0 A 23.0,23.0 0 0 0 127.0,175.0 V 58 Z"/></clipPath><rect x="81.0" y="132.3" width="46" height="65.7" fill="#b8401f" clip-path="url(#glas104)"/><path d="M 81.0,58 V 175.0 A 23.0,23.0 0 0 0 127.0,175.0 V 58" fill="none" stroke="#556766" stroke-width="2.2" stroke-linecap="round"/><line x1="77.0" y1="58.0" x2="131.0" y2="58.0" stroke="#556766" stroke-width="2.2" stroke-linecap="round"/><text x="104.0" y="222.0" font-size="14" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>blodrød</tspan></text></g><g class="peg" data-titel="Kobber(II)ioner og ammoniak" data-tekst="Kobber(II)ioner, Cu^{2+}, giver en mørkeblå opløsning, når der tilsættes ammoniakvand i overskud. En farvereaktion, der kun sker med én bestemt metalion, kan bruges til at påvise ionen."><rect class="peg-maal" x="202.0" y="6.0" width="172.0" height="224.0" fill="none"/><text x="288.0" y="24.0" font-size="16" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Cu</tspan><tspan dy="-6.08" font-size="10.9">2+</tspan></text><text x="288.0" y="44.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>+ ammoniak</tspan></text><clipPath id="glas288"><path d="M 265.0,58 V 175.0 A 23.0,23.0 0 0 0 311.0,175.0 V 58 Z"/></clipPath><rect x="265.0" y="132.3" width="46" height="65.7" fill="#2c4fb5" clip-path="url(#glas288)"/><path d="M 265.0,58 V 175.0 A 23.0,23.0 0 0 0 311.0,175.0 V 58" fill="none" stroke="#556766" stroke-width="2.2" stroke-linecap="round"/><line x1="261.0" y1="58.0" x2="315.0" y2="58.0" stroke="#556766" stroke-width="2.2" stroke-linecap="round"/><text x="288.0" y="222.0" font-size="14" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>mørkeblå</tspan></text></g><g class="peg" data-titel="Jern(III)ioner og salicylat" data-tekst="Jern(III)ioner, Fe^{3+}, giver en lilla opløsning, når der tilsættes salicylat. En farvereaktion, der kun sker med én bestemt metalion, kan bruges til at påvise ionen."><rect class="peg-maal" x="386.0" y="6.0" width="172.0" height="224.0" fill="none"/><text x="472.0" y="24.0" font-size="16" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Fe</tspan><tspan dy="-6.08" font-size="10.9">3+</tspan></text><text x="472.0" y="44.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>+ salicylat</tspan></text><clipPath id="glas472"><path d="M 449.0,58 V 175.0 A 23.0,23.0 0 0 0 495.0,175.0 V 58 Z"/></clipPath><rect x="449.0" y="132.3" width="46" height="65.7" fill="#6b3fa0" clip-path="url(#glas472)"/><path d="M 449.0,58 V 175.0 A 23.0,23.0 0 0 0 495.0,175.0 V 58" fill="none" stroke="#556766" stroke-width="2.2" stroke-linecap="round"/><line x1="445.0" y1="58.0" x2="499.0" y2="58.0" stroke="#556766" stroke-width="2.2" stroke-linecap="round"/><text x="472.0" y="222.0" font-size="14" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>lilla</tspan></text></g><g class="peg" data-titel="Nikkel(II)ioner og dimethylglyoxim" data-tekst="Nikkel(II)ioner, Ni^{2+}, giver et rødt bundfald, når der tilsættes dimethylglyoxim. En farvereaktion, der kun sker med én bestemt metalion, kan bruges til at påvise ionen."><rect class="peg-maal" x="570.0" y="6.0" width="172.0" height="224.0" fill="none"/><text x="656.0" y="24.0" font-size="16" text-anchor="middle" fill