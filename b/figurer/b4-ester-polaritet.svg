<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 216" width="750" height="216" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Ethylethanoat og butansyre har begge fire carbonatomer. Hele estergruppen tæller som én svagt polær gruppe uden hydrogenatom på oxygen, og der kan kun opløses omkring 80 g ethylethanoat i en liter vand. Butansyre kan blandes med vand i alle forhold">
<title>Ethylethanoat og butansyre har begge fire carbonatomer. Hele estergruppen tæller som én svagt polær gruppe uden hydrogenatom på oxygen, og der kan kun opløses omkring 80 g ethylethanoat i en liter vand. Butansyre kan blandes med vand i alle forhold</title>
