d8" font-weight="700"><tspan>bly(IV)oxid</tspan></text><text x="510.0" y="252.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>begge dækket af bly(II)sulfat</tspan></text><text x="510.0" y="146.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>mere vand,</tspan></text><text x="510.0" y="163.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>mindre syre</tspan></text><line x1="304.0" y1="110.0" x2="366.0" y2="110.0" stroke="#14201f" stroke-width="2.2" stroke-linecap="round"/><polygon points="376.0,110.0 366.0,115.0 366.0,105.0" fill="#14201f"/><text x="340.0" y="98.0" font-size="13.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>bruges</tspan></text><line x1="376.0" y1="150.0" x2="314.0" y2="150.0" stroke="#14201f" stroke-width="2.2" stroke-linecap="round"/><polygon points="304.0,150.0 314.0,145.0 314.0,155.0" fill="#14201f"/><text x="340.0" y="172.0" font-size="13.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>lades op</tspan></text>
