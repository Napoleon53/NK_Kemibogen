<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 262" width="680" height="262" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En celle i et blybatteri. Opladet står en plade af bly og en plade af bly(IV)oxid i svovlsyre. Når batteriet bruges, bliver begge plader dækket af bly(II)sulfat, og væsken får mere vand og mindre syre. Når batteriet lades op, går det den modsatte vej">
<title>En celle i et blybatteri. Opladet står en plade af bly og en plade af bly(IV)oxid i svovlsyre. Når batteriet bruges, bliver begge plader dækket af bly(II)sulfat, og væsken får mere vand og mindre syre. Når batteriet lades op, går det den modsatte vej</title>
