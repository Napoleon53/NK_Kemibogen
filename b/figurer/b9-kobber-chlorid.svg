<title>Tre reagensglas med kobber(II)ioner. Uden chlorid er opløsningen blå af komplekset med vand. Med lidt chlorid er den grøn, fordi begge komplekser er til stede. Med meget chlorid er den gul af komplekset med fire chloridioner. Mere chlorid forskyder mod gul, og mere vand forskyder mod blå</title>
