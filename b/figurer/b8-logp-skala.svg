<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 254.0" width="756" height="254" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Skala med log P fra minus 4 til 6. Glucose og adrenalin har negative værdier og er hydrofile, paracetamol, acetylsalicylsyre og salicylsyre ligger mellem 0 og 3, og ibuprofen og vitamin A har høje værdier og er hydrofobe. Et lægemiddel optages bedst fra tarmen, når log P ligger omkring 2 til 3">
<title>Skala med log P fra minus 4 til 6. Glucose og adrenalin har negative værdier og er hydrofile, paracetamol, acetylsalicylsyre og salicylsyre ligger mellem 0 og 3, og ibuprofen og vitamin A har høje værdier og er hydrofobe. Et lægemiddel optages bedst fra tarmen, når log P ligger omkring 2 til 3</title>
<defs><linearGradient id="sfb8-lp-kort" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fbfdfe"/><stop offset="1" stop-color="#eaf1f6"/></linearGradient><filter id="sfb8-lp-blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter><filter id="sfb8-lp-blod" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4"/></filter><linearGradient id="sfb8-lp-nr" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#1c9187"/><stop offset="1" stop-color="#0b5e57"/></linearGradient><linearGradient id="sfb8-lp-skala" x1="0" x2="1"><stop offset="0" stop-color="#7fb9ea"/><stop offset="0.45" stop-color="#cfe3df"/><stop offset="0.62" stop-color="#f3e7b5"/><stop offset="1" stop-color="#efc24f"/></linearGradient><linearGradient id="sfb8-lp-glans" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient><linearGradient id="sfb8-lp-skygge2" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#1c3533" stop-opacity="0"/><stop offset="1" stop-color="#1c3533" stop-opacity="0.16"/></linearGradient><linearGradient id="sfb8-lp-bedst" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#e3f2f0" stop-opacity="0.2"/><stop offset="1" stop-color="#bfe3dd" stop-opacity="0.95"/></linearGradient><linearGradient id="sfb8-lp-vanddraabe" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#e3f0fd"/><stop offset="1" stop-color="#5b97d8"/></linearGradient><linearGradient id="sfb8-lp-oliedraabe" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff4c8"/><stop offset="1" stop-color="#e2b02e"/></linearGradient></defs><g class="peg-vejledning" data-tekst="Peg på et stof, og se, hvad log *P* fortæller om det."/><g class="peg" data-titel="Her optages et lægemiddel bedst" data-tekst="Som tommelfingerregel bliver et stof bedst optaget, når log *P* ligger omkring 2 til 3."><path d="M 440.8,150.0 V 96 Q 440.8,88 448.8,88 H 495.6 Q 503.6,88 503.6,96 V 150.0 Z" fill="url(#sfb8-lp-bedst)" stroke="#0f766e" stroke-width="1.2" stroke-dasharray="4 3"/><text x="472.2" y="196.0" font-size="13.5" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>et lægemiddel optages</tspan></text><text x="472.2" y="213.0" font-size="13.5" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>bedst fra tarmen</tspan></text><rect class="peg-maal" x="394.2" y="182.0" width="156.0" height="36.0" fill="none"/></g><rect x="67" y="135.0" width="628" height="20" rx="10.0" fill="#5b6b78" opacity="0.2" filter="url(#sfb8-lp-blur)"/><rect x="64.0" y="130.0" width="628.0" height="20.0" rx="10.0" fill="url(#sfb8-lp-skala)" stroke="#9fb3b0" stroke-width="1"/><rect x="64.0" y="140.0" width="628.0" height="10.0" rx="5.0" fill="url(#sfb8-lp-skygge2)"/><rect x="70.0" y="132.0" width="616.0" height="7.6" rx="3.8" fill="url(#sfb8-lp-glans)"/><line x1="64.0" y1="152.0" x2="64.0" y2="159.0" stroke="#556766" stroke-width="1.4" stroke-linecap="round"/><text x="64.0" y="176.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>−4</tspan></text><line x1="126.8" y1="152.0" x2="126.8" y2="159.0" stroke="#556766" stroke-width="1.4" stroke-linecap="round"/><text x="126.8" y="176.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>−3</tspan></text><line x1="189.6" y1="152.0" x2="189.6" y2="159.0" stroke="#556766" stroke-width="1.4" stroke-linecap="round"/><text x="189.6" y="176.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>−2</tspan></text><line x1="252.4" y1="152.0" x2="252.4" y2="159.0" stroke="#556766" stroke-width="1.4" stroke-linecap="round"/><text x="252.4" y="176.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>−1</tspan></text><line x1="315.2" y1="152.0" x2="315.2" y2="159.0" stroke="#556766" stroke-width="1.4" stroke-linecap="round"/><text x="315.2" y="176.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>0</tspan></text><line x1="378.0" y1="152.0" x2="378.0" y2="159.0" stroke="#556766" stroke-width="1.4" stroke-linecap="round"/><text x="378.0" y="176.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>1</tspan></text><line x1="440.8" y1="152.0" x2="440.8" y2="159.0" stroke="#556766" stroke-width="1.4" stroke-linecap="round"/><text x="440.8" y="176.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>2</tspan></text><line x1="503.6" y1="152.0" x2="503.6" y2="159.0" stroke="#556766" stroke-width="1.4" stroke-linecap="round"/><text x="503.6" y="176.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>3</tspan></text><line x1="566.4" y1="152.0" x2="566.4" y2="159.0" stroke="#556766" stroke-width="1.4" stroke-linecap="round"/><text x="566.4" y="176.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>4</tspan></text><line x1="629.2" y1="152.0" x2="629.2" y2="159.0" stroke="#556766" stroke-width="1.4" stroke-linecap="round"/><text x="629.2" y="176.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>5</tspan></text><line x1="692.0" y1="152.0" x2="692.0" y2="159.0" stroke="#556766" stroke-width="1.4" stroke-linecap="round"/><text x="692.0" y="176.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>6</tspan></text><text x="706.0" y="176.0" font-size="13.5" text-anchor="start" fill="#14201f" font-weight="700"><tspan>log P</tspan></text><g class="peg" data-titel="Glucose" data-tekst="Glucose har log *P* omkring −3. Koncentrationen er altså omkring 1000 gange større i vand end i octanol. Glucose er hydrofil."><line x1="126.8" y1="129.0" x2="126.8" y2="83.0" stroke="#6f8582" stroke-width="1.3" stroke-linecap="round"/><circle cx="127.3" cy="141.5" r="6.0" fill="#1c3533" opacity="0.2"/><circle cx="126.8" cy="140.0" r="5.5" fill="#ffffff" stroke="#14201f" stroke-width="1.8"/><text x="126.8" y="76.0" font-size="13.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>glucose</tspan></text><rect class="peg-maal" x="97.6" y="61.0" width="58.3" height="22.0" fill="none"/></g><g class="peg" data-titel="Adrenalin" data-tekst="Adrenalin har log *P* omkring −1,4. Værdien er negativ, så koncentrationen er størst i vand. Adrenalin er hydrofilt."><line x1="227.3" y1="129.0" x2="227.3" y2="111.0" stroke="#6f8582" stroke-width="1.3" stroke-linecap="round"/><circle cx="227.8" cy="141.5" r="6.0" fill="#1c3533" opacity="0.2"/><circle cx="227.3" cy="140.0" r="5.5" fill="#ffffff" stroke="#14201f" stroke-width="1.8"/><text x="227.3" y="104.0" font-size="13.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>adrenalin</tspan></text><rect class="peg-maal" x="192.5" y="89.0" width="69.6" height="22.0" fill="none"/></g><g class="peg" data-titel="Paracetamol" data-tekst="Paracetamol har log *P* omkring 0,5. Værdien er lidt over 0, så koncentrationen er lidt større i octanol end i vand."><line x1="346.6" y1="129.0" x2="346.6" y2="111.0" stroke="#6f8582" stroke-width="1.3" stroke-linecap="round"/><circle cx="347.1" cy="141.5" r="6.0" fill="#1c3533" opacity="0.2"/><circle cx="346.6" cy="140.0" r="5.5" fill="#ffffff" stroke="#14201f" stroke-width="1.8"/><text x="346.6" y="104.0" font-size="13.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>paracetamol</tspan></text><rect class="peg-maal" x="302.1" y="89.0" width="89.0" height="22.0" fill="none"/></g><g class="peg" data-titel="Acetylsalicylsyre" data-tekst="Acetylsalicylsyre har log *P* omkring 1,2. Koncentrationen er altså mere end 10 gange større i octanol end i vand."><line x1="390.6" y1="129.0" x2="390.6" y2="53.0" stroke="#6f8582" stroke-width="1.3" stroke-linecap="round"/><circle cx="391.1" cy="141.5" r="6.0" fill="#1c3533" opacity="0.2"/><circle cx="390.6" cy="140.0" r="5.5" fill="#ffffff" stroke="#14201f" stroke-width="1.8"/><text x="390.6" y="46.0" font-size="13.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>acetylsalicylsyre</tspan></text><rect class="peg-maal" x="334.7" y="31.0" width="111.7" height="22.0" fill="none"/></g><g class="peg" data-titel="Salicylsyre" data-tekst="Salicylsyre har log *P* omkring 2,3. Det ligger i området omkring 2 til 3, hvor et stof bliver bedst optaget."><line x1="459.6" y1="129.0" x2="459.6" y2="83.0" stroke="#6f8582" stroke-width="1.3" stroke-linecap="round"/><circle cx="460.1" cy="141.5" r="6.0" fill="#1c3533" opacity="0.2"/><circle cx="459.6" cy="140.0" r="5.5" fill="#ffffff" stroke="#14201f" stroke-width="1.8"/><text x="459.6" y="76.0" font-size="13.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>salicylsyre</tspan></text><rect class="peg-maal" x="422.5" y="61.0" width="74.3" height="22.0" fill="none"/></g><g class="peg" data-titel="Ibuprofen" data-tekst="Ibuprofen har log *P* omkring 4. Koncentrationen er altså omkring 10 000 gange større i octanol end i vand."><line x1="566.4" y1="129.0" x2="566.4" y2="111.0" stroke="#6f8582" stroke-width="1.3" stroke-linecap="round"/><circle cx="566.9" cy="141.5" r="6.0" fill="#1c3533" opacity="0.2"/><circle cx="566.4" cy="140.0" r="5.5" fill="#ffffff" stroke="#14201f" stroke-width="1.8"/><text x="566.4" y="104.0" font-size="13.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>ibuprofen</tspan></text><rect class="peg-maal" x="529.9" y="89.0" width="73.0" height="22.0" fill="none"/></g><g class="peg" data-titel="Vitamin A" data-tekst="Vitamin A har log *P* omkring 5,7. Stoffet er hydrofobt og findes mest i fedt."><line x1="673.2" y1="129.0" x2="673.2" y2="83.0" stroke="#6f8582" stroke-width="1.3" stroke-linecap="round"/><circle cx="673.7" cy="141.5" r="6.0" fill="#1c3533" opacity="0.2"/><circle cx="673.2" cy="140.0" r="5.5" fill="#ffffff" stroke="#14201f" stroke-width="1.8"/><text x="673.2" y="76.0" font-size="13.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>vitamin A</tspan></text><rect class="peg-maal" x="637.5" y="61.0" width="71.2" height="22.0" fill="none"/></g><path d="M 73.0,225.0 C 76.0,232.0 82.0,237.0 82.0,242.0 A 9.0 9.0 0 0 1 64.0,242.0 C 64.0,237.0 70.0,232.0 73.0,225.0 Z" fill="url(#sfb8-lp-vanddraabe)" stroke="#2f6aa6" stroke-width="1"/><path d="M 68.0,240.0 Q 68.0,235.0 71.0,232.0" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/><text x="90.0" y="242.0" font-size="13.5" text-anchor="start" fill="#2a6fa3" font-weight="700"><tspan>hydrofil: mest i vand</tspan></text><path d="M 683.0,225.0 C 686.0,232.0 692.0,237.0 692.0,242.0 A 9.0 9.0 0 0 1 674.0,242.0 C 674.0,237.0 680.0,232.0 683.0,225.0 Z" fill="url(#sfb8-lp-oliedraabe)" stroke="#a8790c" stroke-width="1"/><path d="M 678.0,240.0 Q 678.0,235.0 681.0,232.0" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/><text x="666.0" y="242.0" font-size="13.5" text-anchor="end" fill="#8a6d1a" font-weight="700"><tspan>hydrofob: mest i fedt</tspan></text>
