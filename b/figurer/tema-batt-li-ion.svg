<title>Et lithiumbatteri, mens det bliver brugt. Til venstre ligger grafit i lag på en kobberfolie med lithiumioner mellem lagene. Til højre ligger lag af cobalt og oxygen på en aluminiumsfolie, også med lithiumioner imellem. Lithiumionerne vandrer gennem elektrolytten og en separator fra grafitten til oxidet, mens elektronerne løber gennem ledningen med en pære</title>
