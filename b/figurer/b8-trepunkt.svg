<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 280" width="756" height="280" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="To kort med den samme receptor, en blok med tre lommer, A, B og C. Over den sidder et molekyle med et carbonatom, der har H opad og grupperne A, B og C nedad mod lommerne. I den ene spejlbilledform passer alle tre grupper over hver sin lomme. I den anden spejlbilledform har B og C byttet plads, så kun A passer">
