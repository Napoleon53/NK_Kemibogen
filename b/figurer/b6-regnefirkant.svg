<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 262" width="756" height="262" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Regnefirkanten: fra oxoniumkoncentration til pH, fra hydroxidkoncentration til pOH, og på tværs med vands ionprodukt og pH plus pOH lig 14">
<title>Regnefirkanten: fra oxoniumkoncentration til pH, fra hydroxidkoncentration til pOH, og på tværs med vands ionprodukt og pH plus pOH lig 14</title>
