#e1ebfc"/><rect x="491.0" y="60.0" width="150.0" height="27.0" rx="12" fill="url(#sfb6-rf-skygge)"/><rect x="493.0" y="35.0" width="146.0" height="22.7" rx="10" fill="url(#sfb6-rf-glans)"/><rect x="491.0" y="33.0" width="150.0" height="54.0" rx="12" fill="none" stroke="#1d4ed8" stroke-width="1.6"/><circle cx="521.0" cy="61.0" r="23.7" fill="url(#sfb6-rf-glod-neg)"/><circle cx="518.5" cy="61.0" r="10.2" fill="url(#sfb6-rf-kg-O) #e5533d" stroke="#8f2a1b" stroke-width="0.9"/><circle cx="529.0" cy="56.1" r="6.3" fill="url(#sfb6-rf-kg-H) #ffffff" stroke="#7d8a8e" stroke-width="0.9"/><text x="582.0" y="67.0" font-size="19" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>[OH</tspan><tspan dy="-7.22" font-size="12.9">−</tspan><tspan dy="7.22">]</tspan></text></g><g class="peg" data-titel="pH" data-tekst="pH defineres ud fra koncentrationen af oxoniumioner: pH = −log [H_{3}O^{+}]." data-noegle="pH"><rect x="117.0" y="194.0" width="150" height="54" rx="12" fill="#5b6b78" opacity="0.16" filter="url(#sfb6-rf-blur)"/><rect x="115.0" y="189.0" width="150.0" height="54.0" rx="12" fill="#fde6e1"/><rect x="115.0" y="216.0" width="150.0" height="27.0" rx="12" fill="url(#sfb6-rf-skygge)"/><rect x="117.0" y="191.0" width="146.0" height="22.7" rx="10" fill="url(#sfb6-rf-glans)"/><rect x="115.0" y="189.0" width="150.0" height="54.0" rx="12" fill="none" stroke="#a93226" stroke-width="1.6"/><text x="190.0" y="223.0" font-size="20" text-anchor="middle" fill="#a93226" font-weight="700"><tspan>pH</tspan></text></g><g class="peg" data-titel="pOH" data-tekst="pOH defineres ud fra koncentrationen af hydroxidioner: pOH = −log [OH^{−}]." data-noegle="pOH"><rect x="493.0" y="194.0" width="150" height="54" rx="12" fill="#5b6b78" opacity="0.16" filter="url(#sfb6-rf-blur)"/><rect x="491.0" y="189.0" width="150.0" height="54.0" rx="12" fill="#e1ebfc"/><rect x="491.0" y="216.0" width="150.0" height="27.0" rx="12" fill="url(#sfb6-rf-skygge)"/><rect x="493.0" y="191.0" width="146.0" height="22.7" rx="10" fill="url(#sfb6-rf-glans)"/><rect x="491.0" y="189.0" width="150.0" height="54.0" rx="12" fill="none" stroke="#1d4ed8" stroke-width="1.6"/><text x="566.0" y="223.0" font-size="20" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>pOH</tspan></text></g><g class="peg" data-titel="Vands ionprodukt" data-tekst="Ganges de to koncentrationer med hinanden, får man altid 1,0 · 10^{−14} M^{2}. Kender man den ene koncentration, kan man derfor beregne den anden." data-med="[H_{3}O^{+}] [OH^{−}]"><rect class="peg-maal" x="272.0" y="30.0" width="212.0" height="60.0" fill="none"/><line x1="270.0" y1="60.0" x2="486.0" y2="60.0" stroke="#556766" stroke-width="1.8" stroke-linecap="round"/><text x="378.0" y="48.0" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>[H</tspan><tspan dy="3.19" font-size="9.9">3</tspan><tspan dy="-3.19">O</tspan><tspan dy="-5.51" font-size="9.9">+</tspan><tspan dy="5.51">] · [OH</tspan><tspan dy="-5.51" font-size="9.9">−</tspan><tspan dy="5.51">] = 1,0 · 10</tspan><tspan dy="-5.51" font-size="9.9">−14</tspan><tspan dy="5.51"> M</tspan><tspan dy="-5.51" font-size="9.9">2</tspan></text><text x="378.0" y="82.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>vands ionprodukt</tspan></text></g><g class="peg" data-titel="pH + pOH = 14,00" data-tekst="Sammenhængen fås ved at tage −log på begge sider af vands ionprodukt. Ved pH 3 er pOH 11." data-med="pH pOH"><rect class="peg-maal" x="272.0" y="186.0" width="212.0" height="60.0" fill="none"/><line x1="270.0" y1="216.0" x2="486.0" y2="216.0" stroke="#556766" stroke-width="1.8" stroke-linecap="round"/><text x="378.0" y="204.0" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>pH + pOH = 14,00</tspan></text><text x="378.0" y="238.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>gælder ved 25 °C</tspan></text></g><g class="peg" data-titel="Mellem [H_{3}O^{+}] og pH" data-tekst="pH = −log [H_{3}O^{+}] fører fra koncentrationen til pH.&#10;[H_{3}O^{+}] = 10^{−pH} M fører fra pH tilbage til koncentrationen." data-med="[H_{3}O^{+}] pH"><line x1="176.0" y1="92.0" x2="176.0" y2="176.2" stroke="#a93226" stroke-width="2.2" stroke-linecap="round"/><path d="M 176.0,184.0 L 170.7,172.0 L 176.0,175.6 L 181.3,172.0 Z" fill="#a93226" stroke="#a93226" stroke-width="0.8" stroke-linejoin="round"/><line x1="204.0" y1="184.0" x2="204.0" y2="99.8" stroke="#a93226" stroke-width="2.2" stroke-linecap="round"/><path d="M 204.0,92.0 L 209.3,104.0 L 204.0,100.4 L 198.7,104.0 Z" fill="#a93226" stroke="#a93226" stroke-width="0.8" stroke-linejoin="round"/><text x="160.0" y="130.0" font-size="14" text-anchor="end" fill="#a93226" font-weight="700"><tspan>pH = −log [H</tspan><tspan dy="3.08" font-size="9.5">3</tspan><tspan dy="-3.08">O</tspan><tspan dy="-5.32" font-size="9.5">+</tspan><tspan dy="5.32">]</tspan></text><text x="160.0" y="153.0" font-size="14" text-anchor="end" fill="#a93226" font-weight="700"><tspan>[H</tspan><tspan dy="3.08" font-size="9.5">3</tspan><tspan dy="-3.08">O</tspan><tspan dy="-5.32" font-size="9.5">+</tspan><tspan dy="5.32">] = 10</tspan><tspan dy="-5.32" font-size="9.5">−pH</tspan><tspan dy="5.32"> M</tspan></text><rect class="peg-maal" x="4.0" y="110.0" width="208.0" height="52.0" fill="none"/></g><g class="peg" data-titel="Mellem [OH^{−}] og pOH" data-tekst="pOH = −log [OH^{−}] fører fra koncentrationen til pOH.&#10;[OH^{−}] = 10^{−pOH} M fører fra pOH tilbage til koncentrationen." data-med="[OH^{−}] pOH"><line x1="552.0" y1="92.0" x2="552.0" y2="176.2" stroke="#1d4ed8" stroke-width="2.2" stroke-linecap="round"/><path d="M 552.0,184.0 L 546.7,172.0 L 552.0,175.6 L 557.3,172.0 Z" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0.8" stroke-linejoin="round"/><line x1="580.0" y1="184.0" x2="580.0" y2="99.8" stroke="#1d4ed8" stroke-width="2.2" stroke-linecap="round"/><path d="M 580.0,92.0 L 585.3,104.0 L 580.0,100.4 L 574.7,104.0 Z" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0.8" stroke-linejoin="round"/><text x="596.0" y="130.0" font-size="14" text-anchor="start" fill="#1d4ed8" font-weight="700"><tspan>pOH = −log [OH</tspan><tspan dy="-5.32" font-size="9.5">−</tspan><tspan dy="5.32">]</tspan></text><text x="596.0" y="153.0" font-size="14" text-anchor="start" fill="#1d4ed8" font-weight="700"><tspan>[OH</tspan><tspan dy="-5.32" font-size="9.5">−</tspan><tspan dy="5.32">] = 10</tspan><tspan dy="-5.32" font-size="9.5">−pOH</tspan><tspan dy="5.32"> M</tspan></text><rect class="peg-maal" x="544.0" y="110.0" width="208.0" height="52.0" fill="none"/></g>
