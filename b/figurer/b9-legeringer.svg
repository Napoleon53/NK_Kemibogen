<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 218" width="760" height="218" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Tre legeringer med nikkel vist som søjler. Rustfrit stål er 72 procent jern, 18 procent chrom og 10 procent nikkel. Kobbernikkel i 1-, 2- og 5-kroner er 75 procent kobber og 25 procent nikkel. Nysølv er 60 procent kobber, 20 procent zink og 20 procent nikkel">
<title>Tre legeringer med nikkel vist som søjler. Rustfrit stål er 72 procent jern, 18 procent chrom og 10 procent nikkel. Kobbernikkel i 1-, 2- og 5-kroner er 75 procent kobber og 25 procent nikkel. Nysølv er 60 procent kobber, 20 procent zink og 20 procent nikkel</title>
<g class="peg-vejledning" data-tekst="Peg på en legering, og se, hvad den består af."/><g class="peg" data-titel="Rustfrit stål" data-tekst="Rustfrit stål er en legering af 72 % jern, 18 % chrom og 10 % nikkel. Legeringen bruges til gryder, bestik og ure."><rect class="peg-maal" x="24.0" y="17.0" width="716.0" height="56.0" fill="none"/><text x="220.0" y="42.0" font-size="15" text-anchor="end" fill="#14201f" font-weight="700"><tspan>Rustfrit stål</tspan></text><text x="220.0" y="60.0" font-size="12.5" text-anchor="end" fill="#556766"><tspan>gryder, bestik og ure</tspan></text><rect x="236.0" y="24.0" width="357.1" height="42.0" rx="4" fill="#b4bcc2" stroke="#556766" stroke-width="1"/><text x="414.6" y="50.0" font-size="13" text-anchor="middle" fill="#14201f"><tspan>jern 72 %</tspan></text><rect x="593.1" y="24.0" width="89.3" height="42.0" rx="4" fill="#93a3b8" stroke="#556766" stroke-width="1"/><text x="637.8" y="50.0" font-size="13" text-anchor="middle" fill="#14201f"><tspan>chrom 18 %</tspan></text><rect x="682.4" y="24.0" width="49.6" height="42.0" rx="4" fill="#74c079" stroke="#2f7a3a" stroke-width="2.2"/><text x="707.2" y="42.0" font-size="11.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>nikkel</tspan></text><text x="707.2" y="57.0" font-size="11.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>10 %</tspan></text></g><g class="peg" data-titel="Kobbernikkel" data-tekst="Kobbernikkel er en legering af 75 % kobber og 25 % nikkel. Legeringen bruges til 1-, 2- og 5-kroner."><rect class="peg-maal" x="24.0" y="83.0" width="716.0" height="56.0" fill="none"/><text x="220.0" y="108.0" font-size="15" text-anchor="end" fill="#14201f" font-weight="700"><tspan>Kobbernikkel</tspan></text><text x="220.0" y="126.0" font-size="12.5" text-anchor="end" fill="#556766"><tspan>1-, 2- og 5-kroner</tspan></text><rect x="236.0" y="90.0" width="372.0" height="42.0" rx="4" fill="#dc9a66" stroke="#556766" stroke-width="1"/><text x="422.0" y="116.0" font-size="13" text-anchor="middle" fill="#14201f"><tspan>kobber 75 %</tspan></text><rect x="608.0" y="90.0" width="124.0" height="42.0" rx="4" fill="#74c079" stroke="#2f7a3a" stroke-width="2.2"/><text x="670.0" y="116.0" font-size="13" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>nikkel 25 %</tspan></text></g><g class="peg" data-titel="Nysølv" data-tekst="Nysølv er en legering af 60 % kobber, 20 % zink og 20 % nikkel. Legeringen bruges til nøgler, lynlåse og smykker."><rect class="peg-maal" x="24.0" y="149.0" width="716.0" height="56.0" fill="none"/><text x="220.0" y="174.0" font-size="15" text-anchor="end" fill="#14201f" font-weight="700"><tspan>Nysølv</tspan></text><text x="220.0" y="192.0" font-size="12.5" text-anchor="end" fill="#556766"><tspan>nøgler, lynlåse og smykker</tspan></text><rect x="236.0" y="156.0" width="297.6" height="42.0" rx="4" fill="#dc9a66" stroke="#556766" stroke-width="1"/><text x="384.8" y="182.0" font-size="13" text-anchor="middle" fill="#14201f"><tspan>kobber 60 %</tspan></text><rect x="533.6" y="156.0" width="99.2" height="42.0" rx="4" fill="#cdd4d9" stroke="#556766" stroke-width="1"/><text x="583.2" y="182.0" font-size="13" text-anchor="middle" fill="#14201f"><tspan>zink 20 %</tspan></text><rect x="632.8" y="156.0" width="99.2" height="42.0" rx="4" fill="#74c079" stroke="#2f7a3a" stroke-width="2.2"/><text x="682.4" y="182.0" font-size="13" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>nikkel 20 %</tspan></text></g>
