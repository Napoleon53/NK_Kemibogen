<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 290" width="750" height="290" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Lambert-Beers lov: A er lig med epsilon gange l gange c, vist ved en kuvette, som grønt lys skinner igennem. Lysvejen l er kuvettens bredde i centimeter. Koncentrationen c er, hvor tæt de lilla partikler ligger, i molær. Ekstinktionskoefficienten epsilon er, hvor kraftigt stoffet absorberer lyset. Absorbansen A har ingen enhed og viser, hvor meget svagere lyset kommer ud">
<title>Lambert-Beers lov: A er lig med epsilon gange l gange c, vist ved en kuvette, som grønt lys skinner igennem. Lysvejen l er kuvettens bredde i centimeter. Koncentrationen c er, hvor tæt de lilla partikler ligger, i molær. Ekstinktionskoefficienten epsilon er, hvor kraftigt stoffet absorberer lyset. Absorbansen A har ingen enhed og viser, hvor meget svagere lyset kommer ud</title>
