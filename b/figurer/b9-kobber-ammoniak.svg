<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 446" width="760" height="446" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Ammoniakvand tilsættes en opløsning af kobber(II)sulfat. Øverst det, man ser i tre reagensglas: en lyseblå opløsning, et lyseblåt bundfald efter få dråber ammoniakvand og en mørkeblå opløsning efter mere ammoniakvand. Nederst partiklerne: først en kobber(II)ion med seks vandmolekyler, så fast kobber(II)hydroxid af kobber(II)ioner og hydroxidioner, og til sidst en kobber(II)ion med fire ammoniakmolekyler og to vandmolekyler">
<title>Ammoniakvand tilsættes en opløsning af kobber(II)sulfat. Øverst det, man ser i tre reagensglas: en lyseblå opløsning, et lyseblåt bundfald efter få dråber ammoniakvand og en mørkeblå opløsning efter mere ammoniakvand. Nederst partiklerne: først en kobber(II)ion med seks vandmolekyler, så fast kobber(II)hydroxid af kobber(II)ioner og hydroxidioner, og til sidst en kobber(II)ion med fire ammoniakmolekyler og to vandmolekyler</title>
