<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 234" width="760" height="234" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Nikkeltesten i fire trin. Trin 1: tre dråber ammoniakvand og tre dråber dimethylglyoxim blandes i et lille glas. Trin 2: en vatpind dyppes i blandingen. Trin 3: vatpinden gnides mod metallet, her en knap, i et halvt minut. Trin 4: er vatpinden stadig hvid, er testen negativ. Er den blevet rød, afgiver metallet nikkel, og testen er positiv">
<title>Nikkeltesten i fire trin. Trin 1: tre dråber ammoniakvand og tre dråber dimethylglyoxim blandes i et lille glas. Trin 2: en vatpind dyppes i blandingen. Trin 3: vatpinden gnides mod metallet, her en knap, i et halvt minut. Trin 4: er vatpinden stadig hvid, er testen negativ. Er den blevet rød, afgiver metallet nikkel, og testen er positiv</title>
