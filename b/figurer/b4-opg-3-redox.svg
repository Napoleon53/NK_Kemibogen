<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 328.7" width="750" height="328.7" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Reaktionsskemaet for propan-2-ol og permanganat til propanon, manganioner og vand med tom plads til koefficienterne. Propan-2-ol og propanon er tegnet som zigzagformler med molekylformlerne C3H8O og C3H6O under, og det midterste carbonatom har en grøn ring. Under skemaet går en orange klamme for oxidationen fra carbonatomet til carbonatomet og en blå klamme for reduktionen fra mangan til mangan. Nederst er der plads til ladning, H og O til venstre og til højre. Trin 1 til 5 står med gråt i venstre side">
<title>Reaktionsskemaet for propan-2-ol og permanganat til propanon, manganioner og vand med tom plads til koefficienterne. Propan-2-ol og propanon er tegnet som zigzagformler med molekylformlerne C3H8O og C3H6O under, og det midterste carbonatom har en grøn ring. Under skemaet går en orange klamme for oxidationen fra carbonatomet til carbonatomet og en blå klamme for reduktionen fra mangan til mangan. Nederst er der plads til ladning, H og O til venstre og til højre. Trin 1 til 5 står med gråt i venstre side</title>
