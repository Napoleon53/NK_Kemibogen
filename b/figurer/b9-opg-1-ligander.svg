<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 324" width="760" height="324" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Seks partikler tegnet med alle atomer og bindinger, men uden ledige elektronpar. A er methylamin: et carbonatom med tre hydrogenatomer bundet til et nitrogenatom med to hydrogenatomer. B er ethan: to carbonatomer med tre hydrogenatomer hver. C er methanol: et carbonatom med tre hydrogenatomer bundet til et oxygenatom med ét hydrogenatom. D er methylammoniumionen: et carbonatom med tre hydrogenatomer bundet til et nitrogenatom med tre hydrogenatomer, og ionen har ladningen 1+. E er fluoridionen med ladningen 1−. F er hydrogen: to hydrogenatomer bundet til hinanden">
