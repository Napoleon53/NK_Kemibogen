<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 294" width="756" height="294" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En TLC-plade med fire baner set under ultraviolet lys i en mørk kasse. Pladen lyser grønt, og stofferne ses som mørke pletter. Bane 1 er acetylsalicylsyre med en plet højt oppe, bane 2 er paracetamol med en plet på midten, og bane 3 er koffein med en plet langt nede. Bane 4 er en hovedpinetablet, som giver to pletter: én i samme højde som acetylsalicylsyre og én i samme højde som koffein">
<title>En TLC-plade med fire baner set under ultraviolet lys i en mørk kasse. Pladen lyser grønt, og stofferne ses som mørke pletter. Bane 1 er acetylsalicylsyre med en plet højt oppe, bane 2 er paracetamol med en plet på midten, og bane 3 er koffein med en plet langt nede. Bane 4 er en hovedpinetablet, som giver to pletter: én i samme højde som acetylsalicylsyre og én i samme højde som koffein</title>
