<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 264" width="760" height="264" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En skitse af komplekset med en aluminiumion og tre oxalationer. Aluminiumionen sidder i midten og er bundet til seks oxygenatomer. De seks oxygenatomer er to og to bundet sammen af en grøn bue, og hver bue er én oxalation. Der er tre ligander, og hver binder to steder, så koordinationstallet er 6. Ladningen er 3 minus 2 minus 2 minus 2, altså 3−">
<title>En skitse af komplekset med en aluminiumion og tre oxalationer. Aluminiumionen sidder i midten og er bundet til seks oxygenatomer. De seks oxygenatomer er to og to bundet sammen af en grøn bue, og hver bue er én oxalation. Der er tre ligander, og hver binder to steder, så koordinationstallet er 6. Ladningen er 3 minus 2 minus 2 minus 2, altså 3−</title>
