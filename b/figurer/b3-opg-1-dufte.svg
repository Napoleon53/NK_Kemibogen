<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 276" width="756" height="276" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Fem zigzagformler. A findes i vin og øl: to carbonatomer med OH for enden. B lugter af eddike: to carbonatomer, hvor det sidste har et dobbeltbundet O og en OH-gruppe. C lugter af harsk smør: fire carbonatomer, hvor det sidste har et dobbeltbundet O og en OH-gruppe. D dufter af champignon: otte carbonatomer med en dobbeltbinding mellem de to første og OH på det tredje. E lugter af sure tæer: fire carbonatomer, hvor det sidste har et dobbeltbundet O og en OH-gruppe, og med en methylgruppe på det andet">
