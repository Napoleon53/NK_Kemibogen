<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 256" width="756" height="256" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Ved denaturering mister et protein sin form. Til venstre er kæden foldet med en α-helix og to β-strenge, holdt sammen af svage bindinger, vist som røde prikker. Varme, syre eller base, ethanol eller tungmetalioner bryder de svage bindinger. Til højre ligger den samme kæde løst og uden form, men den er stadig hel">
<title>Ved denaturering mister et protein sin form. Til venstre er kæden foldet med en α-helix og to β-strenge, holdt sammen af svage bindinger, vist som røde prikker. Varme, syre eller base, ethanol eller tungmetalioner bryder de svage bindinger. Til højre ligger den samme kæde løst og uden form, men den er stadig hel</title>
