<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 316" width="620" height="316" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Lagene i et lithiumbatteri set fra siden. Øverst aluminiumsfolie, så pluspolen af et metaloxid med lithium, nikkel, mangan og cobalt eller lithium, jern og phosphor, så en separator af plast, minuspolen af grafit med lithium mellem lagene og nederst kobberfolie. Elektrolytten imellem indeholder lithium, phosphor og fluor">
<title>Lagene i et lithiumbatteri set fra siden. Øverst aluminiumsfolie, så pluspolen af et metaloxid med lithium, nikkel, mangan og cobalt eller lithium, jern og phosphor, så en separator af plast, minuspolen af grafit med lithium mellem lagene og nederst kobberfolie. Elektrolytten imellem indeholder lithium, phosphor og fluor</title>
<rect x="40.0" y="30.0" width="220.0" height="10.0" rx="2" fill="#d9dee2" stroke="#8d969d" stroke-width="1.1"/><line x1="252.0" y1="35.0" x2="294.0" y2="35.0" stroke="#556766" stroke-width="1.1" stroke-linecap="round"/><circle cx="252.0" cy="35.0" r="2.4" fill="#556766"/><text x="302.0" y="32.0" font-size="14" text-anchor="start" fill="#14201f" font-weight="700"><tspan>aluminiumsfolie</tspan></text><text x="302.0" y="49.0" font-size="13" text-anchor="start" fill="#556766"><tspan>Al</tspan></text><rect x="40.0" y="62.0" width="220.0" height="58.0" rx="2" fill="#8796ab" stroke="#4a5a70" stroke-width="1.1"/><line x1="252.0" y1="91.0" x2="294.0" y2="91.0" stroke="#556766" stroke-width="1.1" stroke-linecap="round"/><circle cx="252.0" cy="91.0" r="2.4" fill="#556766"/><text x="302.0" y="88.0" font-size="14" text-anchor="start" fill="#14201f" font-weight="700"><tspan>pluspol: metaloxid</tspan></text><text x="302.0" y="105.0" font-size="13" text-anchor="start" fill="#556766"><tspan>Li, Ni, Mn og Co eller Li, Fe og P</tspan></text><rect x="40.0" y="142.0" width="220.0" height="10.0" rx="2" fill="#f7f7f5" stroke="#a9b1b5" stroke-width="1.1"/><line x1="252.0" y1="147.0" x2="294.0" y2="147.0" stroke="#556766" stroke-width="1.1" stroke-linecap="round"/><circle cx="252.0" cy="147.0" r="2.4" fill="#556766"/><text x="302.0" y="144.0" font-size="14" text-anchor="start" fill="#14201f" font-weight="700"><tspan>separator</tspan></text><text x="302.0" y="161.0" font-size="13" text-anchor="start" fill="#556766"><tspan>plast af C og H</tspan></text><rect x="40.0" y="174.0" width="220.0" height="58.0" rx="2" fill="#4b5563" stroke="#1f2937" stroke-width="1.1"/><line x1="252.0" y1="203.0" x2="294.0" y2="203.0" stroke="#556766" stroke-width="1.1" stroke-linecap="round"/><circle cx="252.0" cy="203.0" r="2.4" fill="#556766"/><text x="302.0" y="200.0" font-size="14" text-anchor="start" fill="#14201f" font-weight="700"><tspan>minuspol: grafit</tspan></text><text x="302.0" y="217.0" font-size="13" text-anchor="start" fill="#556766"><tspan>C, med Li mellem lagene</tspan></text><rect x="40.0" y="254.0" width="220.0" height="10.0" rx="2" fill="#c6713a" stroke="#8f4d22" stroke-width="1.1"/><line x1="252.0" y1="259.0" x2="294.0" y2="259.0" stroke="#556766" stroke-width="1.1" stroke-linecap="round"/><circle cx="252.0" cy="259.0" r="2.4" fill="#556766"/><text x="302.0" y="256.0" font-size="14" text-anchor="start" fill="#14201f" font-weight="700"><tspan>kobberfolie</tspan></text><text x="302.0" y="273.0" font-size="13" text-anchor="start" fill="#556766"><tspan>Cu</tspan></text><text x="150.0" y="302.0" font-size="14" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>Elektrolytten imellem: Li, P og F</tspan></text>
</svg>
