<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 360" width="740" height="360" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Tre tallinjer for reaktionsbrøken Y. Før indgrebet står Y ved K. Lige efter, at der er tilsat en reaktant, er Y sprunget ned under K. Bagefter går reaktionen mod højre, og Y vokser, til den igen står ved K">
<title>Tre tallinjer for reaktionsbrøken Y. Før indgrebet står Y ved K. Lige efter, at der er tilsat en reaktant, er Y sprunget ned under K. Bagefter går reaktionen mod højre, og Y vokser, til den igen står ved K</title>
<text x="40.0" y="36.0" font-size="15.5" text-anchor="start" fill="#14201f" font-weight="700"><tspan>Før indgrebet</tspan></text><line x1="40.0" y1="70.0" x2="700.0" y2="70.0" stroke="#556766" stroke-width="2" stroke-linecap="round"/><line x1="430.0" y1="58.0" x2="430.0" y2="82.0" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/><text x="440.0" y="54.0" font-size="16" text-anchor="start" fill="#0f766e" font-weight="700"><tspan>K</tspan></text><circle cx="430.0" cy="70.0" r="8.0" fill="#14201f" stroke="#ffffff" stroke-width="2"/><text x="418.0" y="54.0" font-size="16" text-anchor="end" fill="#14201f" font-weight="700"><tspan>Y</tspan></text><text x="40.0" y="100.0" font-size="13.5" text-anchor="start" fill="#0f766e" font-weight="700"><tspan>Y = K: blandingen er i ligevægt</tspan></text><text x="40.0" y="146.0" font-size="15.5" text-anchor="start" fill="#14201f" font-weight="700"><tspan>Lige efter indgrebet</tspan></text><line x1="40.0" y1="180.0" x2="700.0" y2="180.0" stroke="#556766" stroke-width="2" stroke-linecap="round"/><line x1="430.0" y1="168.0" x2="430.0" y2="192.0" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/><text x="440.0" y="164.0" font-size="16" text-anchor="start" fill="#0f766e" font-weight="700"><tspan>K</tspan></text><line x1="430.0" y1="180.0" x2="202.0" y2="180.0" stroke="#6d4bb5" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5 4"/><circle cx="190.0" cy="180.0" r="8.0" fill="#14201f" stroke="#ffffff" stroke-width="2"/><text x="190.0" y="164.0" font-size="16" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Y</tspan></text><text x="40.0" y="210.0" font-size="13.5" text-anchor="start" fill="#6d4bb5" font-weight="700"><tspan>der er tilsat en reaktant: Y er mindre end K</tspan></text><text x="40.0" y="256.0" font-size="15.5" text-anchor="start" fill="#14201f" font-weight="700"><tspan>Bagefter</tspan></text><line x1="40.0" y1="290.0" x2="700.0" y2="290.0" stroke="#556766" stroke-width="2" stroke-linecap="round"/><line x1="430.0" y1="278.0" x2="430.0" y2="302.0" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/><text x="440.0" y="274.0" font-size="16" text-anchor="start" fill="#0f766e" font-weight="700"><tspan>K</tspan></text><line x1="190.0" y1="290.0" x2="406.0" y2="290.0" stroke="#b45309" stroke-width="3" stroke-linecap="round"/><polygon points="418.0,290.0 406.0,296.0 406.0,284.0" fill="#b45309"/><circle cx="430.0" cy="290.0" r="8.0" fill="#14201f" stroke="#ffffff" stroke-width="2"/><text x="418.0" y="274.0" font-size="16" text-anchor="end" fill="#14201f" font-weight="700"><tspan>Y</tspan></text><text x="40.0" y="320.0" font-size="13.5" text-anchor="start" fill="#0f766e" font-weight="700"><tspan>reaktionen går mod højre, til Y = K igen</tspan></text><text x="40.0" y="348.0" font-size="13" text-anchor="start" fill="#556766"><tspan>← lille Y</tspan></text><text x="700.0" y="348.0" font-size="13" text-anchor="end" fill="#556766"><tspan>stor Y →</tspan></text>
</svg>
