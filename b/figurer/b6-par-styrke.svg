-anchor="middle" fill="#14201f" font-weight="700"><tspan>HCl</tspan></text><text x="324.0" y="58.5" font-size="14.5" text-anchor="middle" fill="#a93226" font-weight="700"><tspan>−7</tspan></text><text x="410.0" y="58.5" font-size="14.5" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>21</tspan></text><text x="530.0" y="58.5" font-size="15.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Cl</tspan><tspan dy="-5.89" font-size="10.5">−</tspan></text><rect class="peg-maal" x="156.0" y="38.0" width="446.0" height="32.0" fill="none"/></g><g class="peg" data-titel="H_{3}PO_{4} og H_{2}PO_{4}^{−}" data-tekst="Syren H_{3}PO_{4} har p*K*_{s} = 2,15, og dens korresponderende base H_{2}PO_{4}^{−} har p*K*_{b} = 11,85. Tilsammen giver de to tal 14,00. Jo stærkere syren er, jo svagere er dens korresponderende base."><rect x="156.0" y="74.0" width="446.0" height="28.0" rx="14" fill="url(#sfb6-par-kort)" stroke="#d3dee5" stroke-width="1"/><text x="230.0" y="92.5" font-size="15.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>H</tspan><tspan dy="3.41" font-size="10.5">3</tspan><tspan dy="-3.41">PO</tspan><tspan dy="3.41" font-size="10.5">4</tspan></text><text x="324.0" y="92.5" font-size="14.5" text-anchor="middle" fill="#a93226" font-weight="700"><tspan>2,15</tspan></text><text x="410.0" y="92.5" font-size="14.5" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>11,85</tspan></text><text x="530.0" y="92.5" font-size="15.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>H</tspan><tspan dy="3.41" font-size="10.5">2</tspan><tspan dy="-3.41">PO</tspan><tspan dy="3.41" font-size="10.5">4</tspan><tspan dy="-9.30" font-size="10.5">−</tspan></text><rect class="peg-maal" x="156.0" y="72.0" width="446.0" height="32.0" fill="none"/></g><g class="peg" data-titel="CH_{3}COOH og CH_{3}COO^{−}" data-tekst="Syren CH_{3}COOH har p*K*_{s} = 4,76, og dens korresponderende base CH_{3}COO^{−} har p*K*_{b} = 9,24. Tilsammen giver de to tal 14,00. Jo stærkere syren er, jo svagere er dens korresponderende base."><rect x="156.0" y="108.0" width="446.0" height="28.0" rx="14" fill="url(#sfb6-par-kort)" stroke="#d3dee5" stroke-width="1"/><text x="230.0" y="126.5" font-size="15.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>CH</tspan><tspan dy="3.41" font-size="10.5">3</tspan><tspan dy="-3.41">COOH</tspan></text><text x="324.0" y="126.5" font-size="14.5" text-anchor="middle" fill="#a93226" font-weight="700"><tspan>4,76</tspan></text><text x="410.0" y="126.5" font-size="14.5" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>9,24</tspan></text><text x="530.0" y="126.5" font-size="15.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>CH</tspan><tspan dy="3.41" font-size="10.5">3</tspan><tspan dy="-3.41">COO</tspan><tspan dy="-5.89" font-size="10.5">−</tspan></text><rect class="peg-maal" x="156.0" y="106.0" width="446.0" height="32.0" fill="none"/></g><g class="peg" data-titel="H_{2}CO_{3} og HCO_{3}^{−}" data-tekst="Syren H_{2}CO_{3} har p*K*_{s} = 6,35, og dens korresponderende base HCO_{3}^{−} har p*K*_{b} = 7,65. Tilsammen giver de to tal 14,00. Jo stærkere syren er, jo svagere er dens korresponderende base."><rect x="156.0" y="142.0" width="446.0" height="28.0" rx="14" fill="url(#sfb6-par-kort)" stroke="#d3dee5" stroke-width="1"/><text x="230.0" y="160.5" font-size="15.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>H</tspan><tspan dy="3.41" font-size="10.5">2</tspan><tspan dy="-3.41">CO</tspan><tspan dy="3.41" font-size="10.5">3</tspan></text><text x="324.0" y="160.5" font-size="14.5" text-anchor="middle" fill="#a93226" font-weight="700"><tspan>6,35</tspan></text><text x="410.0" y="160.5" font-size="14.5" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>7,65</tspan></text><text x="530.0" y="160.5" font-size="15.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>HCO</tspan><tspan dy="3.41" font-size="10.5">3</tspan><tspan dy="-9.30" font-size="10.5">−</tspan></text><rect class="peg-maal" x="156.0" y="140.0" width="446.0" height="32.0" fill="none"/></g><g class="peg" data-titel="NH_{4}^{+} og NH_{3}" data-tekst="Syren NH_{4}^{+} har p*K*_{s} = 9,25, og dens korresponderende base NH_{3} har p*K*_{b} = 4,75. Tilsammen giver de to tal 14,00. Jo stærkere syren er, jo svagere er dens korresponderende base."><rect x="156.0" y="176.0" width="446.0" height="28.0" rx="14" fill="url(#sfb6-par-kort)" stroke="#d3dee5" stroke-width="1"/><text x="230.0" y="194.5" font-size="15.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>NH</tspan><tspan dy="3.41" font-size="10.5">4</tspan><tspan dy="-9.30" font-size="10.5">+</tspan></text><text x="324.0" y="194.5" font-size="14.5" text-anchor="middle" fill="#a93226" font-weight="700"><tspan>9,25</tspan></text><text x="410.0" y="194.5" font-size="14.5" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>4,75</tspan></text><text x="530.0" y="194.5" font-size="15.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>NH</tspan><tspan dy="3.41" font-size="10.5">3</tspan></text><rect class="peg-maal" x="156.0" y="174.0" width="446.0" height="32.0" fill="none"/></g><g class="peg" data-titel="HCO_{3}^{−} og CO_{3}^{2−}" data-tekst="Syren HCO_{3}^{−} har p*K*_{s} = 10,33, og dens korresponderende base CO_{3}^{2−} har p*K*_{b} = 3,67. Tilsammen giver de to tal 14,00. Jo stærkere syren er, jo svagere er dens korresponderende base."><rect x="156.0" y="210.0" width="446.0" height="28.0" rx="14" fill="url(#sfb6-par-kort)" stroke="#d3dee5" stroke-width="1"/><text x="230.0" y="228.5" font-size="15.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>HCO</tspan><tspan dy="3.41" font-size="10.5">3</tspan><tspan dy="-9.30" font-size="10.5">−</tspan></text><text x="324.0" y="228.5" font-size="14.5" text-anchor="middle" fill="#a93226" font-weight="700"><tspan>10,33</tspan></text><text x="410.0" y="228.5" font-size="14.5" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>3,67</tspan></text><text x="530.0" y="228.5" font-size="15.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>CO</tspan><tspan dy="3.41" font-size="10.5">3</tspan><tspan dy="-9.30" font-size="10.5">2−</tspan></text><rect class="peg-maal" x="156.0" y="208.0" width="446.0" height="32.0" fill="none"/></g><defs><linearGradient id="sfb6-par-kileo" x1="0" x2="0" y1="1" y2="0"><stop offset="0" stop-color="#fbe0da"/><stop offset="1" stop-color="#a93226"/></linearGradient></defs><path d="M 126.0,234.0 L 120.0,50.0 L 115.0,50.0 L 128.0,36.0 L 141.0,50.0 L 136.0,50.0 L 130.0,234.0 Z" fill="url(#sfb6-par-kileo)" stroke="#a93226" stroke-width="0.8" stroke-linejoin="round"/><text x="104" y="139" font-size="14" font-weight="700" fill="#a93226" text-anchor="middle" transform="rotate(-90 104 139)">stærkere syre</text><defs><linearGradient id="sfb6-par-kilen" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#dde8fb"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient></defs><path d="M 628.0,44.0 L 622.0,228.0 L 617.0,228.0 L 630.0,242.0 L 643.0,228.0 L 638.0,228.0 L 632.0,44.0 Z" fill="url(#sfb6-par-kilen)" stroke="#1d4ed8" stroke-width="0.8" stroke-linejoin="round"/><text x="654" y="139" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle" transform="rotate(90 654 139)">stærkere base</text><text x="379.0" y="264.0" font-size="14" text-anchor="middle" fill="#556766" font-weight="700"><tspan>I hvert par er pK</tspan><tspan dy="3.08" font-size="9.5">s</tspan><tspan dy="-3.08"> + pK</tspan><tspan dy="3.08" font-size="9.5">b</tspan><tspan dy="-3.08"> = 14,00.</tspan></text>
