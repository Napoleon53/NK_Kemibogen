<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 276" width="756" height="276" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Seks korresponderende syre-basepar med pKs og pKb. Jo stærkere syren er, jo svagere er dens korresponderende base">
