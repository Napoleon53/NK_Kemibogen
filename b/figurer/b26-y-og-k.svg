<title>Tre kort om spaltningen af SO2Cl2. Reaktionsbrøken Y er koncentrationen af SO2 gange koncentrationen af Cl2 divideret med koncentrationen af SO2Cl2. Undervejs vokser Y og ender på K, som er 0,050 M og ikke ændrer sig. Ved ligevægt er Y lig med K, så brøken er lig med K. Det er ligevægtsloven</title>
