<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 5 740 299" width="740" height="299" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Reaktionsbrøken lige efter fortyndingen, hvor hver koncentration er ganget med ½: én gang over brøkstregen og fem gange under. Samlet bliver Y = ½ divideret med 1/32 gange K, altså 16 gange K. På tallinjen springer Y fra K op til 16 gange K, og reaktionen forløber mod venstre, til Y igen er lig med K">
<title>Reaktionsbrøken lige efter fortyndingen, hvor hver koncentration er ganget med ½: én gang over brøkstregen og fem gange under. Samlet bliver Y = ½ divideret med 1/32 gange K, altså 16 gange K. På tallinjen springer Y fra K op til 16 gange K, og reaktionen forløber mod venstre, til Y igen er lig med K</title>
<text x="24.0" y="22.0" font-size="15" text-anchor="start" fill="#14201f" font-weight="700"><tspan>Lige efter fortyndingen er hver koncentration ganget med ½</tspan></text><text x="42.4" y="67.0" font-size="16" text-anchor="start"><tspan fill="#14201f"><tspan>Y =</tspan></tspan></text><text x="148.5" y="56.2" font-size="16" text-anchor="middle"><tspan fill="#6d4bb5"><tspan>½ · </tspan></tspan><tspan fill="#14201f"><tspan>[CoCl</tspan><tspan dy="3.52" font-size="10.9">4</tspan><tspan dy="-9.60" font-size="10.9">2−</tspan><tspan dy="6.08">]</tspan></tspan></text><line x1="73.8" y1="62.0" x2="223.3" y2="62.0" stroke="#14201f" stroke-width="1.4" stroke-linecap="round"/><text x="148.5" y="79.0" font-size="16" text-anchor="middle"><tspan fill="#6d4bb5"><tspan>½ · </tspan></tspan><tspan fill="#14201f"><tspan>[Co</tspan><tspan dy="-6.08" font-size="10.9">2+</tspan><tspan dy="6.08">] · (</tspan></tspan><tspan fill="#6d4bb5"><tspan>½ · </tspan></tspan><tspan fill="#14201f"><tspan>[Cl</tspan><tspan dy="-6.08" font-size="10.9">−</tspan><tspan dy="6.08">])</tspan><tspan dy="-6.08" font-size="10.9">4</tspan></tspan></text><text x="258.1" y="56.0" font-size="14.5" text-anchor="start" fill="#6d4bb5" font-weight="700"><tspan>over brøkstregen: ½ én gang</tspan></text><text x="258.1" y="78.0" font-size="14.5" text-anchor="start" fill="#6d4bb5" font-weight="700"><tspan>under brøkstregen: ½ fem gange</tspan></text><text x="24.0" y="122.0" font-size="15" text-anchor="start" fill="#14201f" font-weight="700"><tspan>Før fortyndingen var Y = K, så</tspan></text><text x="42.4" y="167.0" font-size="16" text-anchor="start"><tspan fill="#14201f"><tspan>Y =</tspan></tspan></text><text x="100.5" y="156.2" font-size="16" text-anchor="middle"><tspan fill="#6d4bb5"><tspan>½</tspan></tspan></text><line x1="73.8" y1="162.0" x2="127.1" y2="162.0" stroke="#14201f" stroke-width="1.4" stroke-linecap="round"/><text x="100.5" y="179.0" font-size="16" text-anchor="middle"><tspan fill="#6d4bb5"><tspan>½ · (½)</tspan><tspan dy="-6.08" font-size="10.9">4</tspan></tspan></text><text x="134.3" y="167.0" font-size="16" text-anchor="start"><tspan fill="#14201f"><tspan>· K =</tspan></tspan></text><text x="194.1" y="156.2" font-size="16" text-anchor="middle"><tspan fill="#6d4bb5"><tspan>½</tspan></tspan></text><line x1="174.0" y1="162.0" x2="214.1" y2="162.0" stroke="#14201f" stroke-width="1.4" stroke-linecap="round"/><text x="194.1" y="179.0" font-size="16" text-anchor="middle"><tspan fill="#6d4bb5"><tspan>1/32</tspan></tspan></text><text x="221.3" y="167.0" font-size="16" text-anchor="start"><tspan fill="#14201f"><tspan>· K = 16 · K</tspan></tspan></text><line x1="40.0" y1="246.0" x2="700.0" y2="246.0" stroke="#556766" stroke-width="2" stroke-linecap="round"/><g opacity="0.3"><circle cx="300.8" cy="248.0" r="8.0" fill="#5b6b78" opacity="0.25"/><circle cx="300.0" cy="246.0" r="8.0" fill="#ffffff" stroke="#14201f" stroke-width="2.4"/></g><path d="M 308.0,230.0 Q 454.0,196.0 589.3,227.5" fill="none" stroke="#6d4bb5" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="600.0,230.0 588.0,232.9 590.5,222.1" fill="#6d4bb5"/><text x="454.0" y="206.0" font-size="14.0" text-anchor="middle" fill="#6d4bb5" font-weight="700"><tspan>fortynding</tspan></text><line x1="598.0" y1="247.0" x2="320.1" y2="247.0" stroke="#b45309" stroke-width="3.2" stroke-linecap="round"/><path d="M 312.0,247.0 L 324.0,241.2 L 320.6,247.0 L 324.0,252.8 Z" fill="#b45309" stroke="#b45309" stroke-width="0.6" stroke-linejoin="round"/><line x1="300.0" y1="233.0" x2="300.0" y2="259.0" stroke="#0f766e" stroke-width="3.4" stroke-linecap="round"/><text x="290.0" y="229.0" font-size="16" text-anchor="end" fill="#0f766e" font-weight="700"><tspan>K</tspan></text><g><circle cx="610.8" cy="248.0" r="8.0" fill="#5b6b78" opacity="0.25"/><circle cx="610.0" cy="246.0" r="8.0" fill="#ffffff" stroke="#14201f" stroke-width="2.4"/></g><text x="622.0" y="229.0" font-size="16" text-anchor="start" fill="#14201f" font-weight="700"><tspan>Y = 16 · K</tspan></text><text x="40.0" y="274.0" font-size="14.5" text-anchor="start" fill="#b45309" font-weight="700"><tspan>Y &gt; K, så reaktionen forløber mod venstre, til Y = K igen</tspan></text><text x="40.0" y="298.0" font-size="14.0" text-anchor="start" fill="#556766"><tspan>← lille Y</tspan></text><text x="700.0" y="298.0" font-size="14.0" text-anchor="end" fill="#556766"><tspan>stor Y →</tspan></text>
</svg>
