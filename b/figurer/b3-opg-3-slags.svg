<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 372" width="756" height="372" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Seks par af zigzagformler. A: en lige kæde på fem carbonatomer og en kæde på fire med en methylgruppe. B: to kæder på fem carbonatomer med OH på det andet og på det tredje carbonatom. C: fire carbonatomer med OH på det andet og et O med to carbonatomer på hver side. D: fire carbonatomer med OH for enden og tre carbonatomer med en methylgruppe på det midterste og OH for enden. E: tre carbonatomer med OH for enden og et O med et carbonatom på den ene side og to på den anden. F: to kæder på fem carbonatomer med en tripelbinding ved det første og ved det andet carbonatom">
