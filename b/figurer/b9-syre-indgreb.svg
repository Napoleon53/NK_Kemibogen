<title>Tre reagensglas. En lyseblå opløsning af kobber(II)ioner bliver mørkeblå, når der tilsættes ammoniak. Når der bagefter tilsættes syre, bliver opløsningen lyseblå igen, fordi syren fjerner ammoniakken</title>
