<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 605 300" width="605" height="300" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Trin 1. Reaktionsskemaet NH4+ + O2 bliver til NO2− med oxidationstal over nitrogen og oxygen. Under skemaet går en pil fra nitrogen til nitrogen med pil op 6 for oxidationen og en pil fra oxygen i dioxygen til oxygen i nitrit med 2 foran pil ned 2 for reduktionen">
<title>Trin 1. Reaktionsskemaet NH4+ + O2 bliver til NO2− med oxidationstal over nitrogen og oxygen. Under skemaet går en pil fra nitrogen til nitrogen med pil op 6 for oxidationen og en pil fra oxygen i dioxygen til oxygen i nitrit med 2 foran pil ned 2 for reduktionen</title>
<text x="65.0" y="64.0" font-size="26" text-anchor="start" fill="#14201f" font-weight="700"><tspan>NH</tspan><tspan dy="5.72" font-size="17.7">4</tspan><tspan dy="-15.60" font-size="17.7">+</tspan></text><text x="74.4" y="26.0" font-size="15" text-anchor="middle" fill="#b45309" font-weight="700"><tspan>−III</tspan></text><text x="141.7" y="63.0" font-size="22" text-anchor="middle" fill="#556766"><tspan>+</tspan></text><text x="160.7" y="64.0" font-size="26" text-anchor="start" fill="#14201f" font-weight="700"><tspan>O</tspan><tspan dy="5.72" font-size="17.7">2</tspan></text><text x="170.8" y="26.0" font-size="15" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>0</tspan></text><text x="305.0" y="64.0" font-size="26" text-anchor="start" fill="#14201f" font-weight="700"><tspan>NO</tspan><tspan dy="5.72" font-size="17.7">2</tspan><tspan dy="-15.60" font-size="17.7">−</tspan></text><text x="314.3" y="26.0" font-size="15" text-anchor="middle" fill="#b45309" font-weight="700"><tspan>+III</tspan></text><text x="339.5" y="26.0" font-size="15" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>−II</tspan></text><line x1="223.9" y1="55.0" x2="259.9" y2="55.0" stroke="#14201f" stroke-width="2.6" stroke-linecap="round"/><polygon points="271.9,55.0 259.9,61.0 259.9,49.0" fill="#14201f"/><path d="M 74.4,78.0 V 104.0 H 314.3 V 89.0" fill="none" stroke="#b45309" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="314.3,78.0 308.3,89.0 320.4,89.0" fill="#b45309"/><rect x="225.8" y="91.0" width="44.2" height="26.0" rx="6" fill="#ffffff"/><text x="247.9" y="110.0" font-size="17" text-anchor="middle" fill="#b45309" font-weight="700"><tspan>↑ 6</tspan></text><text x="247.9" y="131.0" font-size="14" text-anchor="middle" fill="#b45309" font-weight="700"><tspan>oxidation</tspan></text><path d="M 170.8,78.0 V 156.0 H 333.8 V 89.0" fill="none" stroke="#ffffff" stroke-width="8.4" stroke-linejoin="round"/><path d="M 170.8,78.0 V 156.0 H 333.8 V 89.0" fill="none" stroke="#1d4ed8" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="333.8,78.0 327.8,89.0 339.9,89.0" fill="#1d4ed8"/><rect x="216.4" y="143.0" width="63.0" height="26.0" rx="6" fill="#ffffff"/><text x="230.4" y="162.0" font-size="17" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>2</tspan></text><text x="244.4" y="162.0" font-size="17" text-anchor="start" fill="#1d4ed8" font-weight="700"><tspan>↓ 2</tspan></text><text x="247.9" y="183.0" font-size="14" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>reduktion</tspan></text><rect x="52.5" y="198.0" width="500.0" height="92.0" rx="10" fill="#f4f8f7" stroke="#dfe9e8" stroke-width="1.2"/><text x="72.5" y="222.0" font-size="15" text-anchor="start" fill="#14201f"><tspan>Nitrogen stiger 6 i oxidationstal, fra −III til +III.</tspan></text><text x="72.5" y="244.0" font-size="15" text-anchor="start" fill="#14201f"><tspan>Oxygen falder 2 i oxidationstal, fra 0 til −II.</tspan></text><text x="72.5" y="268.0" font-size="15" text-anchor="start" fill="#0f766e" font-weight="700"><tspan>O</tspan><tspan dy="3.30" font-size="10.2">2</tspan><tspan dy="-3.30"> har 2 oxygenatomer, så faldet er 2 · 2 = 4.</tspan></text>
</svg>
