<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 326" width="560" height="326" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Elektrolyse af vand med lidt natriumsulfat. To rør fyldt med vand står med åbningen nedad over hver sin elektrode. Elektroden under det venstre rør er sat til strømkildens minuspol, og her samles hydrogen. Under det højre rør samles oxygen. Der er dobbelt så meget hydrogen som oxygen">
<title>Elektrolyse af vand med lidt natriumsulfat. To rør fyldt med vand står med åbningen nedad over hver sin elektrode. Elektroden under det venstre rør er sat til strømkildens minuspol, og her samles hydrogen. Under det højre rør samles oxygen. Der er dobbelt så meget hydrogen som oxygen</title>
