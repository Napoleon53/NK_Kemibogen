<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 1 756 263" width="750" height="260.9" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Tre kort med en ligevægtsblanding. Når K er meget lille, er der næsten kun reaktanter, og ligevægten er forskudt mod venstre. Når K er omkring 1, er der lige meget af begge. Når K er meget stor, er der næsten kun produkter, og ligevægten er forskudt mod højre">
<title>Tre kort med en ligevægtsblanding. Når K er meget lille, er der næsten kun reaktanter, og ligevægten er forskudt mod venstre. Når K er omkring 1, er der lige meget af begge. Når K er meget stor, er der næsten kun produkter, og ligevægten er forskudt mod højre</title>
