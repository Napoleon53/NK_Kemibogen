<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 286" width="760" height="286" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Fire komplekser. I kompleks A sidder seks ammoniakmolekyler hver for sig på en nikkel(II)ion. I kompleks B er en nikkel(II)ion bundet til seks nitrogenatomer, som to og to er bundet sammen af en grøn bue. I kompleks C sidder fire hydroxidioner hver for sig på en zinkion. I kompleks D er en kobber(II)ion bundet til to nitrogenatomer og to oxygenatomer, og en grøn bue binder hvert nitrogenatom sammen med et oxygenatom. En grøn bue viser, at to atomer sidder på den samme ligand">
<title>Fire komplekser. I kompleks A sidder seks ammoniakmolekyler hver for sig på en nikkel(II)ion. I kompleks B er en nikkel(II)ion bundet til seks nitrogenatomer, som to og to er bundet sammen af en grøn bue. I kompleks C sidder fire hydroxidioner hver for sig på en zinkion. I kompleks D er en kobber(II)ion bundet til to nitrogenatomer og to oxygenatomer, og en grøn bue binder hvert nitrogenatom sammen med et oxygenatom. En grøn bue viser, at to atomer sidder på den samme ligand</title>
