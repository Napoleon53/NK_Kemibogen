<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 292" width="760" height="292" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Sådan giver nikkel allergi, vist i tre trin. Øverst et metal med nikkelatomer, i midten et lag sved og nederst huden. Trin 1: sveden oxiderer lidt af metallet til nikkel(II)ioner. Trin 2: ionerne trænger ind i huden. Trin 3: ionerne binder sig til nitrogen- og oxygenatomer i hudens proteiner, og immunforsvaret reagerer på dem">
