<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 130" width="700" height="130" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Trin 3. Sodavandens koncentration er 13,0 mikromolær gange 100,0 milliliter divideret med 10,0 milliliter, som er 130 mikromolær. Stofmængden i 1,00 liter er 1,30 gange 10 i minus fjerde mol, og massen er n gange M, som er 0,0645 gram eller 64,5 milligram">
<title>Trin 3. Sodavandens koncentration er 13,0 mikromolær gange 100,0 milliliter divideret med 10,0 milliliter, som er 130 mikromolær. Stofmængden i 1,00 liter er 1,30 gange 10 i minus fjerde mol, og massen er n gange M, som er 0,0645 gram eller 64,5 milligram</title>
<text x="8.0" y="32.0" font-size="15" text-anchor="start" fill="#0f766e" font-weight="700"><tspan>Sodavandens koncentration</tspan></text><text x="232.0" y="32.0" font-size="15" text-anchor="start" fill="#14201f"><tspan>c</tspan><tspan dy="3.30" font-size="10.2">før</tspan><tspan dy="-3.30"> =</tspan></text><text x="314.6" y="22.0" font-size="15" text-anchor="middle" fill="#14201f"><tspan>c</tspan><tspan dy="3.30" font-size="10.2">efter</tspan><tspan dy="-3.30"> · V</tspan><tspan dy="3.30" font-size="10.2">efter</tspan></text><line x1="275.2" y1="27.4" x2="354.0" y2="27.4" stroke="#14201f" stroke-width="1.4" stroke-linecap="round"/><text x="314.6" y="43.2" font-size="15" text-anchor="middle" fill="#14201f"><tspan>V</tspan><tspan dy="3.30" font-size="10.2">før</tspan></text><text x="362.7" y="32.0" font-size="15" text-anchor="start" fill="#14201f"><tspan>=</tspan></text><text x="450.6" y="22.0" font-size="15" text-anchor="middle" fill="#14201f"><tspan>13,0 µM · 100,0 mL</tspan></text><line x1="380.4" y1="27.4" x2="520.8" y2="27.4" stroke="#14201f" stroke-width="1.4" stroke-linecap="round"/><text x="450.6" y="43.2" font-size="15" text-anchor="middle" fill="#14201f"><tspan>10,0 mL</tspan></text><text x="529.5" y="32.0" font-size="15" text-anchor="start" fill="#14201f"><tspan>= 130 µM</tspan></text><text x="8.0" y="78.0" font-size="15" text-anchor="start" fill="#0f766e" font-weight="700"><tspan>Stofmængde i 1,00 L</tspan></text><text x="232.0" y="78.0" font-size="15" text-anchor="start" fill="#14201f"><tspan>n = c · V = 1,30 · 10</tspan><tspan dy="-5.70" font-size="10.2">−4</tspan><tspan dy="5.70"> M · 1,00 L = 1,30 · 10</tspan><tspan dy="-5.70" font-size="10.2">−4</tspan><tspan dy="5.70"> mol</tspan></text><text x="8.0" y="114.0" font-size="15" text-anchor="start" fill="#0f766e" font-weight="700"><tspan>Masse i 1,00 L</tspan></text><text x="232.0" y="114.0" font-size="15" text-anchor="start" fill="#14201f"><tspan>m = n · M = 1,30 · 10</tspan><tspan dy="-5.70" font-size="10.2">−4</tspan><tspan dy="5.70"> mol · 496,41 g/mol = 0,0645 g = 64,5 mg</tspan></text>
