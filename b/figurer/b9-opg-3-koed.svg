<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 366" width="760" height="366" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Tre stykker kød og jernionen i kødets hæm. Øverst det, man ser: A er vakuumpakket kød, som er mørkt purpurrødt. B er kød, der har ligget en halv time i luft, og det er klart rødt. C er kød, der har ligget flere dage i luft, og det er brunt. Nederst partiklerne: jernionen sidder midt i hæm og er bundet til et nitrogenatom i proteinet under ringen. I A er jernionen en jern(II)ion, og pladsen over ringen er tom. I B er den en jern(II)ion med et oxygenmolekyle på pladsen. I C er den en jern(III)ion med et vandmolekyle på pladsen">
<title>Tre stykker kød og jernionen i kødets hæm. Øverst det, man ser: A er vakuumpakket kød, som er mørkt purpurrødt. B er kød, der har ligget en halv time i luft, og det er klart rødt. C er kød, der har ligget flere dage i luft, og det er brunt. Nederst partiklerne: jernionen sidder midt i hæm og er bundet til et nitrogenatom i proteinet under ringen. I A er jernionen en jern(II)ion, og pladsen over ringen er tom. I B er den en jern(II)ion med et oxygenmolekyle på pladsen. I C er den en jern(III)ion med et vandmolekyle på pladsen</title>
