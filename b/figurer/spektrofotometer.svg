<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 270" width="756" height="270" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Et spektrofotometer, hvor man kan se ind i apparatet. 1: Lampen sender hvidt lys ud. 2: Et prisme deler lyset i farver. 3: En spalte lader kun det blågrønne lys ved 504 nanometer slippe igennem. 4: Lyset går gennem kuvetten med den røde prøve og bliver svagere. 5: Detektoren måler lyset, og displayet viser absorbansen 0,520">
<title>Et spektrofotometer, hvor man kan se ind i apparatet. 1: Lampen sender hvidt lys ud. 2: Et prisme deler lyset i farver. 3: En spalte lader kun det blågrønne lys ved 504 nanometer slippe igennem. 4: Lyset går gennem kuvetten med den røde prøve og bliver svagere. 5: Detektoren måler lyset, og displayet viser absorbansen 0,520</title>
