<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 316" width="760" height="316" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Det røde kompleks af nikkel og dimethylglyoxim. En nikkel(II)ion sidder i midten med en ligand på hver side. Nikkelionen er bundet til fire nitrogenatomer, to fra hver ligand. Hver ligand har afgivet en hydron fra den ene OH-gruppe, og de to ligander holdes sammen af hydrogenbindinger mellem oxygenatomerne. Komplekset har ingen ladning og er et rødt bundfald">
<title>Det røde kompleks af nikkel og dimethylglyoxim. En nikkel(II)ion sidder i midten med en ligand på hver side. Nikkelionen er bundet til fire nitrogenatomer, to fra hver ligand. Hver ligand har afgivet en hydron fra den ene OH-gruppe, og de to ligander holdes sammen af hydrogenbindinger mellem oxygenatomerne. Komplekset har ingen ladning og er et rødt bundfald</title>
