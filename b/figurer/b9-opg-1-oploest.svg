<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Tre bægerglas med hvert sit forslag til, hvad der er i vandet, når saltet er opløst. I glas A er alle partikler skilt ad: seks kaliumioner, to jern(III)ioner og tolv cyanidioner. I glas B hænger hele formelenheder sammen: to partikler med formlen for hele saltet. I glas C er seks kaliumioner frie, og to komplekse ioner med jern og seks cyanidioner holder sammen">
