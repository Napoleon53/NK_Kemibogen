<title>Tre tallinjer for reaktionsbrøken Y med et termometer ved hver. Før opvarmningen står Y ved K. Lige efter opvarmningen er K flyttet mod højre, fordi K er blevet større, mens Y står samme sted, så Y er mindre end K. Bagefter går reaktionen mod højre, og Y vokser, til den står ved det nye K</title>
