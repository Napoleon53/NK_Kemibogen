<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 378" width="740" height="378" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Tre tallinjer for reaktionsbrøken Y med et termometer og et vindue ind i blandingen ved hver. Før opvarmningen står Y ved K, og der er 3 A og 3 B. Lige efter opvarmningen er K flyttet mod højre, fordi K er blevet større, mens Y og blandingen er de samme, så Y er mindre end K. Bagefter er ét A blevet til B, og Y er vokset, til den står ved det nye K">
<title>Tre tallinjer for reaktionsbrøken Y med et termometer og et vindue ind i blandingen ved hver. Før opvarmningen står Y ved K, og der er 3 A og 3 B. Lige efter opvarmningen er K flyttet mod højre, fordi K er blevet større, mens Y og blandingen er de samme, så Y er mindre end K. Bagefter er ét A blevet til B, og Y er vokset, til den står ved det nye K</title>
