<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 284" width="750" height="284" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Tre af alkoholers reaktioner: forbrænding, elimination og oxidation">
<title>Tre af alkoholers reaktioner: forbrænding, elimination og oxidation</title>
<defs><filter id="gs-blur-lille" x="-20%" y="-30%" width="140%" height="160%"><feGaussianBlur stdDeviation="2"/></filter><linearGradient id="d4-hvid" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#edf3f2"/></linearGradient><linearGradient id="d4-groen" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f1faf8"/><stop offset="1" stop-color="#d3ece6"/></linearGradient><linearGradient id="d4-svar" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6f3f0"/></linearGradient><linearGradient id="d4-ja" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#effaf7"/><stop offset="1" stop-color="#d4eee8"/></linearGradient><linearGradient id="d4-nej" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff5f3"/><stop offset="1" stop-color="#fadcd6"/></linearGradient><linearGradient id="d4-vaeske" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#d9eaf4"/><stop offset="1" stop-color="#a3c3d8"/></linearGradient><filter id="d4-glod" x="-40%" y="-60%" width="180%" height="220%"><feGaussianBlur stdDeviation="7"/></filter></defs><g class="peg-vejledning" data-tekst="Peg på en reaktion, og se, hvad alkoholen bliver til."/><rect x="78" y="106" width="164" height="68" rx="18" fill="#7cc7bb" opacity="0.32" filter="url(#d4-glod)"/><line x1="241.0" y1="123.1" x2="435.4" y2="48.5" stroke="#647876" stroke-width="2" stroke-linecap="round"/><path d="M 442.0,46.0 L 433.5,54.5 L 434.8,48.8 L 430.0,45.4 Z" fill="#647876" stroke="#647876" stroke-width="0.8" stroke-linejoin="round"/><g class="peg" data-titel="Forbrænding" data-tekst="Alkoholer brænder med en blålig flamme og danner carbondioxid og vand.&#10;CH_{3}CH_{2}OH + 3 O_{2} → 2 CO_{2} + 3 H_{2}O&#10;Læs mere under [Forbrænding](#forbrænding) nedenfor." data-med="alkohol"><rect x="451.0" y="19.8" width="212.0" height="56.0" rx="10" fill="#4b5a64" opacity="0.16" filter="url(#gs-blur-lille)"/><rect x="450.0" y="18.0" width="212.0" height="56.0" rx="10" fill="url(#d4-hvid)" stroke="#b5cbc8" stroke-width="1.4"/><path d="M 460.0,19.9 H 652.0" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/><text x="556.0" y="41.8" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Forbrænding</tspan></text><text x="556.0" y="60.3" font-size="13.0" text-anchor="middle" fill="#556766"><tspan>CO</tspan><tspan dy="2.86" font-size="8.8">2</tspan><tspan dy="-2.86"> og H</tspan><tspan dy="2.86" font-size="8.8">2</tspan><tspan dy="-2.86">O</tspan></text><rect class="peg-maal" x="450.0" y="18.0" width="212.0" height="56.0" fill="none"/></g><line x1="241.0" y1="140.0" x2="434.9" y2="140.0" stroke="#647876" stroke-width="2" stroke-linecap="round"/><path d="M 442.0,140.0 L 431.0,144.8 L 434.3,140.0 L 431.0,135.2 Z" fill="#647876" stroke="#647876" stroke-width="0.8" stroke-linejoin="round"/><g class="peg" data-titel="Elimination" data-tekst="Opvarmes en alkohol med koncentreret svovlsyre, fjernes der vand, og der dannes en alken.&#10;CH_{3}CH_{2}OH → CH_{2}=CH_{2} + H_{2}O&#10;Læs mere under [Elimination](#elimination) nedenfor og i [afsnit B4.1](../kapitler/b4-1-carbonhydriders-reaktioner.html#elimination)." data-med="alkohol"><rect x="451.0" y="113.8" width="212.0" height="56.0" rx="10" fill="#4b5a64" opacity="0.16" filter="url(#gs-blur-lille)"/><rect x="450.0" y="112.0" width="212.0" height="56.0" rx="10" fill="url(#d4-hvid)" stroke="#b5cbc8" stroke-width="1.4"/><path d="M 460.0,113.9 H 652.0" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/><text x="556.0" y="135.8" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Elimination</tspan></text><text x="556.0" y="154.3" font-size="13.0" text-anchor="middle" fill="#556766"><tspan>alken og vand</tspan></text><rect class="peg-maal" x="450.0" y="112.0" width="212.0" height="56.0" fill="none"/></g><line x1="241.0" y1="156.9" x2="435.4" y2="231.5" stroke="#647876" stroke-width="2" stroke-linecap="round"/><path d="M 442.0,234.0 L 430.0,234.6 L 434.8,231.2 L 433.5,225.5 Z" fill="#647876" stroke="#647876" stroke-width="0.8" stroke-linejoin="round"/><g class="peg" data-titel="Oxidation" data-tekst="Ved en oxidation reagerer alkoholen med et oxidationsmiddel. Alkoholer kan oxideres til aldehyder, ketoner og carboxylsyrer, og hvad der dannes, afhænger af, om alkoholen er primær, sekundær eller tertiær.&#10;Læs mere under [Oxidation](#oxidation) nedenfor og i [afsnit B4.3](../kapitler/b4-3-aldehyder-og-ketoner.html#oxidation-af-alkoholer)." data-med="alkohol"><rect x="451.0" y="201.8" width="212.0" height="68.0" rx="10" fill="#4b5a64" opacity="0.16" filter="url(#gs-blur-lille)"/><rect x="450.0" y="200.0" width="212.0" height="68.0" rx="10" fill="url(#d4-hvid)" stroke="#b5cbc8" stroke-width="1.4"/><path d="M 460.0,201.9 H 652.0" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/><text x="556.0" y="220.6" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Oxidation</tspan></text><text x="556.0" y="239.1" font-size="13.0" text-anchor="middle" fill="#556766"><tspan>aldehyd, keton</tspan></text><text x="556.0" y="257.6" font-size="13.0" text-anchor="middle" fill="#556766"><tspan>eller carboxylsyre</tspan></text><rect class="peg-maal" x="450.0" y="200.0" width="212.0" height="68.0" fill="none"/></g><g class="peg" data-titel="Alkohol, R−OH" data-tekst="Alkoholer kan brænde, blive til en alken ved en elimination eller blive oxideret." data-noegle="alkohol"><rect x="86.0" y="111.8" width="150.0" height="60.0" rx="12" fill="#4b5a64" opacity="0.16" filter="url(#gs-blur-lille)"/><rect x="85.0" y="110.0" width="150.0" height="60.0" rx="12" fill="url(#d4-groen)" stroke="#0f766e" stroke-width="1.6"/><path d="M 97.0,111.9 H 223.0" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/><text x="160.0" y="135.3" font-size="18" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>Alkohol</tspan></text><text x="160.0" y="157.3" font-size="16.5" text-anchor="middle" fill="#556766"><tspan>R−OH</tspan></text><rect class="peg-maal" x="85.0" y="110.0" width="150.0" height="60.0" fill="none"/></g>
</svg>
