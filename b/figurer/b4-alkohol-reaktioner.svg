<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 284" width="750" height="284" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Alkoholers fem vigtigste reaktioner: forbrænding, elimination, oxidation, kondensation med en syre og kondensation med en alkohol">
<title>Alkoholers fem vigtigste reaktioner: forbrænding, elimination, oxidation, kondensation med en syre og kondensation med en alkohol</title>
<defs><filter id="gs-blur-lille" x="-20%" y="-30%" width="140%" height="160%"><feGaussianBlur stdDeviation="2"/></filter><linearGradient id="d4-hvid" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#edf3f2"/></linearGradient><linearGradient id="d4-groen" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f1faf8"/><stop offset="1" stop-color="#d3ece6"/></linearGradient><linearGradient id="d4-svar" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6f3f0"/></linearGradient><linearGradient id="d4-ja" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#effaf7"/><stop offset="1" stop-color="#d4eee8"/></linearGradient><linearGradient id="d4-nej" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff5f3"/><stop offset="1" stop-color="#fadcd6"/></linearGradient><linearGradient id="d4-vaeske" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#d9eaf4"/><stop offset="1" stop-color="#a3c3d8"/></linearGradient><filter id="d4-glod" x="-40%" y="-60%" width="180%" height="220%"><feGaussianBlur stdDeviation="7"/></filter></defs><g class="peg-vejledning" data-tekst="Peg på en reaktion, og se, hvad alkoholen bliver til."/><rect x="293" y="106" width="164" height="68" rx="18" fill="#7cc7bb" opacity="0.32" filter="url(#d4-glod)"/><line x1="294.4" y1="109.8" x2="211.0" y2="78.6" stroke="#647876" stroke-width="2" stroke-linecap="round"/><path d="M 204.4,76.1 L 216.4,75.4 L 211.6,78.8 L 213.0,84.5 Z" fill="#647876" stroke="#647876" stroke-width="0.8" stroke-linejoin="round"/><g class="peg" data-titel="Forbrænding" data-tekst="Alkoholer brænder med en blålig flamme og danner carbondioxid og vand.&#10;CH_{3}CH_{2}OH + 3 O_{2} → 2 CO_{2} + 3 H_{2}O" data-med="alkohol"><rect x="19.0" y="19.8" width="212.0" height="56.0" rx="10" fill="#4b5a64" opacity="0.16" filter="url(#gs-blur-lille)"/><rect x="18.0" y="18.0" width="212.0" height="56.0" rx="10" fill="url(#d4-hvid)" stroke="#b5cbc8" stroke-width="1.4"/><path d="M 28.0,19.9 H 220.0" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/><text x="124.0" y="41.8" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Forbrænding</tspan></text><text x="124.0" y="60.3" font-size="13.0" text-anchor="middle" fill="#556766"><tspan>CO</tspan><tspan dy="2.86" font-size="8.8">2</tspan><tspan dy="-2.86"> og H</tspan><tspan dy="2.86" font-size="8.8">2</tspan><tspan dy="-2.86">O</tspan></text><rect class="peg-maal" x="18.0" y="18.0" width="212.0" height="56.0" fill="none"/></g><line x1="455.6" y1="109.8" x2="539.0" y2="78.6" stroke="#647876" stroke-width="2" stroke-linecap="round"/><path d="M 545.6,76.1 L 537.0,84.5 L 538.4,78.8 L 533.6,75.4 Z" fill="#647876" stroke="#647876" stroke-width="0.8" stroke-linejoin="round"/><g class="peg" data-titel="Elimination" data-tekst="Opvarmes en alkohol med koncentreret svovlsyre, fjernes der vand, og der dannes en alken.&#10;CH_{3}CH_{2}OH → CH_{2}=CH_{2} + H_{2}O" data-med="alkohol"><rect x="521.0" y="19.8" width="212.0" height="56.0" rx="10" fill="#4b5a64" opacity="0.16" filter="url(#gs-blur-lille)"/><rect x="520.0" y="18.0" width="212.0" height="56.0" rx="10" fill="url(#d4-hvid)" stroke="#b5cbc8" stroke-width="1.4"/><path d="M 530.0,19.9 H 722.0" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/><text x="626.0" y="41.8" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Elimination</tspan></text><text x="626.0" y="60.3" font-size="13.0" text-anchor="middle" fill="#556766"><tspan>alken og vand</tspan></text><rect class="peg-maal" x="520.0" y="18.0" width="212.0" height="56.0" fill="none"/></g><line x1="456.0" y1="140.0" x2="515.9" y2="140.0" stroke="#647876" stroke-width="2" stroke-linecap="round"/><path d="M 523.0,140.0 L 512.0,144.8 L 515.3,140.0 L 512.0,135.2 Z" fill="#647876" stroke="#647876" stroke-width="0.8" stroke-linejoin="round"/><g class="peg" data-titel="Oxidation" data-tekst="Alkoholer kan oxideres til aldehyder, ketoner og carboxylsyrer. Hvad der dannes, afhænger af, om alkoholen er primær, sekundær eller tertiær." data-med="alkohol"><rect x="530.0" y="107.8" width="212.0" height="68.0" rx="10" fill="#4b5a64" opacity="0.16" filter="url(#gs-blur-lille)"/><rect x="529.0" y="106.0" width="212.0" height="68.0" rx="10" fill="url(#d4-hvid)" stroke="#b5cbc8" stroke-width="1.4"/><path d="M 539.0,107.9 H 731.0" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/><text x="635.0" y="126.6" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Oxidation</tspan></text><text x="635.0" y="145.1" font-size="13.0" text-anchor="middle" fill="#556766"><tspan>aldehyd, keton</tspan></text><text x="635.0" y="163.6" font-size="13.0" text-anchor="middle" fill="#556766"><tspan>eller carboxylsyre</tspan></text><rect class="peg-maal" x="529.0" y="106.0" width="212.0" height="68.0" fill="none"/></g><line x1="455.6" y1="170.8" x2="540.6" y2="203.3" stroke="#647876" stroke-width="2" stroke-linecap="round"/><path d="M 547.2,205.9 L 535.2,206.4 L 540.0,203.1 L 538.6,197.4 Z" fill="#647876" stroke="#647876" stroke-width="0.8" stroke-linejoin="round"/><g class="peg" data-titel="Kondensation med syre" data-tekst="En alkohol reagerer med en carboxylsyre og danner en ester og vand. Det er den vigtigste kondensation." data-med="alkohol"><rect x="521.0" y="209.8" width="212.0" height="56.0" rx="10" fill="#4b5a64" opacity="0.16" filter="url(#gs-blur-lille)"/><rect x="520.0" y="208.0" width="212.0" height="56.0" rx="10" fill="url(#d4-hvid)" stroke="#b5cbc8" stroke-width="1.4"/><path d="M 530.0,209.9 H 722.0" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/><text x="626.0" y="231.8" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Kondensation med syre</tspan></text><text x="626.0" y="250.3" font-size="13.0" text-anchor="middle" fill="#556766"><tspan>ester og vand</tspan></text><rect class="peg-maal" x="520.0" y="208.0" width="212.0" height="56.0" fill="none"/></g><line x1="294.4" y1="170.8" x2="209.4" y2="203.3" stroke="#647876" stroke-width="2" stroke-linecap="round"/><path d="M 202.8,205.9 L 211.4,197.4 L 210.0,203.1 L 214.8,206.4 Z" fill="#647876" stroke="#647876" stroke-width="0.8" stroke-linejoin="round"/><g class="peg" data-titel="Kondensation med alkohol" data-tekst="To alkoholmolekyler kan kondensere til en ether. Det kræver høj temperatur og en katalysator.&#10;To ethanolmolekyler giver diethylether og vand." data-med="alkohol"><rect x="19.0" y="209.8" width="212.0" height="56.0" rx="10" fill="#4b5a64" opacity="0.16" filter="url(#gs-blur-lille)"/><rect x="18.0" y="208.0" width="212.0" height="56.0" rx="10" fill="url(#d4-hvid)" stroke="#b5cbc8" stroke-width="1.4"/><path d="M 28.0,209.9 H 220.0" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/><text x="124.0" y="231.8" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Kondensation med alkohol</tspan></text><text x="124.0" y="250.3" font-size="13.0" text-anchor="middle" fill="#556766"><tspan>ether og vand</tspan></text><rect class="peg-maal" x="18.0" y="208.0" width="212.0" height="56.0" fill="none"/></g><g class="peg" data-titel="Alkohol, R−OH" data-tekst="Alkoholer kan reagere på fem måder. Oxidation og de to kondensationer giver nye stofklasser." data-noegle="alkohol"><rect x="301.0" y="111.8" width="150.0" height="60.0" rx="12" fill="#4b5a64" opacity="0.16" filter="url(#gs-blur-lille)"/><rect x="300.0" y="110.0" width="150.0" height="60.0" rx="12" fill="url(#d4-groen)" stroke="#0f766e" stroke-width="1.6"/><path d="M 312.0,111.9 H 438.0" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/><text x="375.0" y="135.3" font-size="18" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>Alkohol</tspan></text><text x="375.0" y="157.3" font-size="16.5" text-anchor="middle" fill="#556766"><tspan>R−OH</tspan></text><rect class="peg-maal" x="300.0" y="110.0" width="150.0" height="60.0" fill="none"/></g>
</svg>
