<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 168" width="756" height="168" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Beregningsvejen fra en målt pH til syrestyrkekonstanten i fire trin: oxoniumkoncentrationen, så basens koncentration, så syrens koncentration og til sidst Ks">
<title>Beregningsvejen fra en målt pH til syrestyrkekonstanten i fire trin: oxoniumkoncentrationen, så basens koncentration, så syrens koncentration og til sidst Ks</title>
<defs><radialGradient id="sfb6-ksv-hyd" cx="0.36" cy="0.3" r="0.78"><stop offset="0" stop-color="#fff6e0"/><stop offset="0.5" stop-color="#f7b24a"/><stop offset="1" stop-color="#c46f0c"/></radialGradient><radialGradient id="sfb6-ksv-glod-pos" cx="0.5" cy="0.5" r="0.5"><stop offset="0.5" stop-color="#e5533d" stop-opacity="0.4"/><stop offset="1" stop-color="#e5533d" stop-opacity="0"/></radialGradient><radialGradient id="sfb6-ksv-glod-neg" cx="0.5" cy="0.5" r="0.5"><stop offset="0.5" stop-color="#2f6fde" stop-opacity="0.36"/><stop offset="1" stop-color="#2f6fde" stop-opacity="0"/></radialGradient><linearGradient id="sfb6-ksv-kort" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fbfdfe"/><stop offset="1" stop-color="#eaf1f6"/></linearGradient><filter id="sfb6-ksv-blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter></defs><g class="peg-vejledning" data-tekst="Peg på et trin, og se, hvad der regnes ud."/><g class="peg" data-titel="Målt pH" data-tekst="Man fremstiller en opløsning af syren med en kendt formel koncentration og måler pH." data-noegle="start"><rect x="6.0" y="45.0" width="100.0" height="82.0" rx="14" fill="#5b6b78" opacity="0.16" filter="url(#sfb6-ksv-blur)"/><rect x="4.0" y="40.0" width="100.0" height="82.0" rx="14" fill="url(#sfb6-ksv-kort)" stroke="#c9d6e0" stroke-width="1.1"/><text x="54.0" y="79.0" font-size="16" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>målt pH</tspan></text><text x="54.0" y="99.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>fra pH-metret</tspan></text></g><g class="peg" data-titel="Trin 1: [H_{3}O^{+}] = 10^{−pH} M" data-tekst="Koncentrationen af oxoniumioner findes ud fra den målte pH." data-noegle="trin1" data-med="start"><rect x="122.0" y="11.0" width="146.0" height="150.0" rx="14" fill="#5b6b78" opacity="0.16" filter="url(#sfb6-ksv-blur)"/><rect x="120.0" y="6.0" width="146.0" height="150.0" rx="14" fill="url(#sfb6-ksv-kort)" stroke="#c9d6e0" stroke-width="1.1"/><circle cx="138.0" cy="26.0" r="12.0" fill="#0f766e"/><text x="138.0" y="31.0" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>1</tspan></text><text x="158.0" y="31.5" font-size="15" text-anchor="start" fill="#0f766e" font-weight="700"><tspan>Oxonium</tspan></text><text x="193.0" y="122.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>findes ud fra</tspan></text><text x="193.0" y="140.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>den målte pH</tspan></text><text x="193.0" y="88.0" font-size="15.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>[H</tspan><tspan dy="3.41" font-size="10.5">3</tspan><tspan dy="-3.41">O</tspan><tspan dy="-5.89" font-size="10.5">+</tspan><tspan dy="5.89">] = 10</tspan><tspan dy="-5.89" font-size="10.5">−pH</tspan><tspan dy="5.89"> M</tspan></text></g><g class="peg" data-titel="Trin 2: forholdet 1 : 1" data-tekst="Hver gang der dannes en oxoniumion, dannes der også en base. Derfor er [B] = [H_{3}O^{+}]." data-noegle="trin2" data-med="trin1"><rect x="284.0" y="11.0" width="146.0" height="150.0" rx="14" fill="#5b6b78" opacity="0.16" filter="url(#sfb6-ksv-blur)"/><rect x="282.0" y="6.0" width="146.0" height="150.0" rx="14" fill="url(#sfb6-ksv-kort)" stroke="#c9d6e0" stroke-width="1.1"/><circle cx="300.0" cy="26.0" r="12.0" fill="#0f766e"/><text x="300.0" y="31.0" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>2</tspan></text><text x="320.0" y="31.5" font-size="15" text-anchor="start" fill="#0f766e" font-weight="700"><tspan>Basen</tspan></text><text x="355.0" y="122.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>forholdet er 1 : 1,</tspan></text><text x="355.0" y="140.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>så de er lige store</tspan></text><text x="355.0" y="88.0" font-size="15.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>[B] = [H</tspan><tspan dy="3.41" font-size="10.5">3</tspan><tspan dy="-3.41">O</tspan><tspan dy="-5.89" font-size="10.5">+</tspan><tspan dy="5.89">]</tspan></text></g><g class="peg" data-titel="Trin 3: [S] = *c*_{s} − [B]" data-tekst="Den syre, der er blevet til base, trækkes fra den formelle koncentration. Resten er stadig syre." data-noegle="trin3" data-med="trin2"><rect x="446.0" y="11.0" width="146.0" height="150.0" rx="14" fill="#5b6b78" opacity="0.16" filter="url(#sfb6-ksv-blur)"/><rect x="444.0" y="6.0" width="146.0" height="150.0" rx="14" fill="url(#sfb6-ksv-kort)" stroke="#c9d6e0" stroke-width="1.1"/><circle cx="462.0" cy="26.0" r="12.0" fill="#0f766e"/><text x="462.0" y="31.0" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>3</tspan></text><text x="482.0" y="31.5" font-size="15" text-anchor="start" fill="#0f766e" font-weight="700"><tspan>Syren</tspan></text><text x="517.0" y="122.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>resten er</tspan></text><text x="517.0" y="140.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>stadig syre</tspan></text><text x="517.0" y="88.0" font-size="15.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>[S] = c</tspan><tspan dy="3.41" font-size="10.5">s</tspan><tspan dy="-3.41"> − [B]</tspan></text></g><g class="peg" data-titel="Trin 4: sæt ind i brøken" data-tekst="De tre koncentrationer sættes ind i *K*_{s} = [B] · [H_{3}O^{+}] / [S]. Jo større *K*_{s} er, jo stærkere er syren." data-noegle="trin4" data-med="trin3"><rect x="608.0" y="11.0" width="146.0" height="150.0" rx="14" fill="#5b6b78" opacity="0.16" filter="url(#sfb6-ksv-blur)"/><rect x="606.0" y="6.0" width="146.0" height="150.0" rx="14" fill="url(#sfb6-ksv-kort)" stroke="#c9d6e0" stroke-width="1.1"/><circle cx="624.0" cy="26.0" r="12.0" fill="#0f766e"/><text x="624.0" y="31.0" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>4</tspan></text><text x="644.0" y="31.5" font-size="15" text-anchor="start" fill="#0f766e" font-weight="700"><tspan>Konstanten</tspan></text><text x="679.0" y="131.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>syrens styrke</tspan></text><text x="611.7" y="88.0" font-size="15.5" text-anchor="start" fill="#14201f" font-weight="700"><tspan>K</tspan><tspan dy="3.41" font-size="10.5">s</tspan><tspan dy="-3.41"> =</tspan></text><g transform="translate(697.5 82.5)"><text x="0.0" y="-5.2" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>[B] · [H</tspan><tspan dy="3.19" font-size="9.9">3</tspan><tspan dy="-3.19">O</tspan><tspan dy="-5.51" font-size="9.9">+</tspan><tspan dy="5.51">]</tspan></text><line x1="-48.8" y1="0.0" x2="48.8" y2="0.0" stroke="#14201f" stroke-width="1.5" stroke-linecap="round"/><text x="0.0" y="15.4" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>[S]</tspan></text></g></g><line x1="106.0" y1="81.0" x2="112.7" y2="81.0" stroke="#556766" stroke-width="1.8" stroke-linecap="round"/><path d="M 118.0,81.0 L 110.0,84.8 L 112.2,81.0 L 110.0,77.2 Z" fill="#556766" stroke="#556766" stroke-width="0.6" stroke-linejoin="round"/><line x1="268.0" y1="81.0" x2="274.7" y2="81.0" stroke="#556766" stroke-width="1.8" stroke-linecap="round"/><path d="M 280.0,81.0 L 272.0,84.8 L 274.2,81.0 L 272.0,77.2 Z" fill="#556766" stroke="#556766" stroke-width="0.6" stroke-linejoin="round"/><line x1="430.0" y1="81.0" x2="436.7" y2="81.0" stroke="#556766" stroke-width="1.8" stroke-linecap="round"/><path d="M 442.0,81.0 L 434.0,84.8 L 436.2,81.0 L 434.0,77.2 Z" fill="#556766" stroke="#556766" stroke-width="0.6" stroke-linejoin="round"/><line x1="592.0" y1="81.0" x2="598.7" y2="81.0" stroke="#556766" stroke-width="1.8" stroke-linecap="round"/><path d="M 604.0,81.0 L 596.0,84.8 L 598.2,81.0 L 596.0,77.2 Z" fill="#556766" stroke="#556766" stroke-width="0.6" stroke-linejoin="round"/>
</svg>
