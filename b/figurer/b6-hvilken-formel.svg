<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 242" width="756" height="242" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Syrens pKs afgør fremgangsmåden. En stærk syre med pKs under 0 giver pH lig minus log cs. En middelstærk syre med pKs fra 0 til 4 kræver, at ligningen løses. En svag syre med pKs over 4 giver pH med genvejen, en halv gange pKs minus log cs">
<title>Syrens pKs afgør fremgangsmåden. En stærk syre med pKs under 0 giver pH lig minus log cs. En middelstærk syre med pKs fra 0 til 4 kræver, at ligningen løses. En svag syre med pKs over 4 giver pH med genvejen, en halv gange pKs minus log cs</title>
<defs><radialGradient id="sfb6-hvf-hyd" cx="0.36" cy="0.3" r="0.78"><stop offset="0" stop-color="#fff6e0"/><stop offset="0.5" stop-color="#f7b24a"/><stop offset="1" stop-color="#c46f0c"/></radialGradient><radialGradient id="sfb6-hvf-glod-pos" cx="0.5" cy="0.5" r="0.5"><stop offset="0.5" stop-color="#e5533d" stop-opacity="0.4"/><stop offset="1" stop-color="#e5533d" stop-opacity="0"/></radialGradient><radialGradient id="sfb6-hvf-glod-neg" cx="0.5" cy="0.5" r="0.5"><stop offset="0.5" stop-color="#2f6fde" stop-opacity="0.36"/><stop offset="1" stop-color="#2f6fde" stop-opacity="0"/></radialGradient><linearGradient id="sfb6-hvf-kort" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fbfdfe"/><stop offset="1" stop-color="#eaf1f6"/></linearGradient><filter id="sfb6-hvf-blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter><linearGradient id="sfb6-hvf-glans" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient><linearGradient id="sfb6-hvf-skygge" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.16"/></linearGradient><filter id="sfb6-hvf-sblur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3"/></filter><linearGradient id="sfb6-hvf-ud-v" x1="1" x2="0" y1="0" y2="0"><stop offset="0" stop-color="#6b130c"/><stop offset="1" stop-color="#6b130c" stop-opacity="0"/></linearGradient><linearGradient id="sfb6-hvf-ud-h" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#122b70"/><stop offset="1" stop-color="#122b70" stop-opacity="0"/></linearGradient><linearGradient id="sfb6-hvf-ud-gv" x1="1" x2="0" y1="0" y2="0"><stop offset="0" stop-color="#e6ecee"/><stop offset="1" stop-color="#e6ecee" stop-opacity="0"/></linearGradient><linearGradient id="sfb6-hvf-ud-gh" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#e6ecee"/><stop offset="1" stop-color="#e6ecee" stop-opacity="0"/></linearGradient></defs><g class="peg-vejledning" data-tekst="Peg på et område eller en formel, og se, hvornår den gælder."/><g class="peg" data-titel="Find syrens p*K*_{s}" data-tekst="Syrens p*K*_{s} afgør, hvilken fremgangsmåde der passer. Jo lavere p*K*_{s} er, jo stærkere er syren." data-noegle="find"><text x="14.0" y="28.0" font-size="15" text-anchor="start" fill="#0f766e" font-weight="700"><tspan>Find syrens pK</tspan><tspan dy="3.30" font-size="10.2">s</tspan><tspan dy="-3.30">:</tspan></text><rect class="peg-maal" x="6.0" y="10.0" width="190.0" height="24.0" fill="none"/></g><rect x="12" y="46" width="732" height="34" rx="9" fill="#5b6b78" opacity="0.16" filter="url(#sfb6-hvf-sblur)"/><g class="peg" data-titel="Er syren stærk?" data-tekst="En stærk syre har p*K*_{s} under 0. Saltsyre og salpetersyre er stærke syrer." data-noegle="omr0" data-med="find"><rect x="6.0" y="40.0" width="236.0" height="34.0" rx="9" fill="#f2b3a8"/><rect x="6.0" y="57.0" width="236.0" height="17.0" rx="9" fill="url(#sfb6-hvf-skygge)"/><rect x="8.0" y="42.0" width="232.0" height="14.3" rx="7" fill="url(#sfb6-hvf-glans)"/><text x="124.0" y="62.4" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>pK</tspan><tspan dy="3.30" font-size="10.2">s</tspan><tspan dy="-3.30"> under 0</tspan></text></g><line x1="124.0" y1="78.0" x2="124.0" y2="90.3" stroke="#556766" stroke-width="1.8" stroke-linecap="round"/><path d="M 124.0,96.0 L 120.0,87.0 L 124.0,89.7 L 128.0,87.0 Z" fill="#556766" stroke="#556766" stroke-width="0.8" stroke-linejoin="round"/><g class="peg" data-titel="Stærk syre: pH = −log *c*_{s}" data-tekst="Al syren har afgivet sin hydron, så [H_{3}O^{+}] er lig med syrens formelle koncentration. Formlen gælder kun for stærke syrer." data-noegle="form0" data-med="find omr0"><rect x="8.0" y="107.0" width="236.0" height="128.0" rx="14" fill="#5b6b78" opacity="0.16" filter="url(#sfb6-hvf-blur)"/><rect x="6.0" y="102.0" width="236.0" height="128.0" rx="14" fill="url(#sfb6-hvf-kort)" stroke="#c9d6e0" stroke-width="1.1"/><text x="124.0" y="129.0" font-size="15" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>Stærk syre</tspan></text><text x="124.0" y="166.0" font-size="16" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>pH = −log c</tspan><tspan dy="3.52" font-size="10.9">s</tspan></text><text x="124.0" y="200.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>al syren har afgivet</tspan></text><text x="124.0" y="218.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>sin hydron</tspan></text></g><g class="peg" data-titel="Middelstærk syre?" data-tekst="Middelstærke syrer har p*K*_{s} fra 0 til 4." data-noegle="omr1" data-med="find"><rect x="260.0" y="40.0" width="236.0" height="34.0" rx="9" fill="#f9d3a6"/><rect x="260.0" y="57.0" width="236.0" height="17.0" rx="9" fill="url(#sfb6-hvf-skygge)"/><rect x="262.0" y="42.0" width="232.0" height="14.3" rx="7" fill="url(#sfb6-hvf-glans)"/><text x="378.0" y="62.4" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>pK</tspan><tspan dy="3.30" font-size="10.2">s</tspan><tspan dy="-3.30"> fra 0 til 4</tspan></text></g><line x1="378.0" y1="78.0" x2="378.0" y2="90.3" stroke="#556766" stroke-width="1.8" stroke-linecap="round"/><path d="M 378.0,96.0 L 374.0,87.0 L 378.0,89.7 L 382.0,87.0 Z" fill="#556766" stroke="#556766" stroke-width="0.8" stroke-linejoin="round"/><g class="peg" data-titel="Middelstærk syre: løs ligningen" data-tekst="For en middelstærk syre har så meget af syren reageret, at genvejen ikke passer. Ligningen *K*_{s} = *x*^{2} / (*c*_{s} − *x*) passer altid. *x* angiver her koncentrationen af oxoniumioner." data-noegle="form1" data-med="find omr1"><rect x="262.0" y="107.0" width="236.0" height="128.0" rx="14" fill="#5b6b78" opacity="0.16" filter="url(#sfb6-hvf-blur)"/><rect x="260.0" y="102.0" width="236.0" height="128.0" rx="14" fill="url(#sfb6-hvf-kort)" stroke="#c9d6e0" stroke-width="1.1"/><text x="378.0" y="129.0" font-size="15" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>Middelstærk syre</tspan></text><text x="335.8" y="166.0" font-size="16" text-anchor="start" fill="#14201f" font-weight="700"><tspan>K</tspan><tspan dy="3.52" font-size="10.9">s</tspan><tspan dy="-3.52"> =</tspan></text><g transform="translate(398.0 160.5)"><text x="0.0" y="-5.4" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>x</tspan><tspan dy="-5.70" font-size="10.2">2</tspan></text><line x1="-22.2" y1="0.0" x2="22.2" y2="0.0" stroke="#14201f" stroke-width="1.5" stroke-linecap="round"/><text x="0.0" y="15.9" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>c</tspan><tspan dy="3.30" font-size="10.2">s</tspan><tspan dy="-3.30"> − x</tspan></text></g><text x="378.0" y="200.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>løs ligningen;</tspan></text><text x="378.0" y="218.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>den gælder altid</tspan></text></g><g class="peg" data-titel="Er syren svag?" data-tekst="Som tommelfingerregel kan genvejen bruges for syrer med p*K*_{s} over 4, når opløsningen ikke er meget fortyndet." data-noegle="omr2" data-med="find"><rect x="514.0" y="40.0" width="236.0" height="34.0" rx="9" fill="#fbeaa6"/><rect x="514.0" y="57.0" width="236.0" height="17.0" rx="9" fill="url(#sfb6-hvf-skygge)"/><rect x="516.0" y="42.0" width="232.0" height="14.3" rx="7" fill="url(#sfb6-hvf-glans)"/><text x="632.0" y="62.4" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>pK</tspan><tspan dy="3.30" font-size="10.2">s</tspan><tspan dy="-3.30"> over 4</tspan></text></g><line x1="632.0" y1="78.0" x2="632.0" y2="90.3" stroke="#556766" stroke-width="1.8" stroke-linecap="round"/><path d="M 632.0,96.0 L 628.0,87.0 L 632.0,89.7 L 636.0,87.0 Z" fill="#556766" stroke="#556766" stroke-width="0.8" stroke-linejoin="round"/><g class="peg" data-titel="Svag syre: pH = ½ · (p*K*_{s} − log *c*_{s})" data-tekst="Kun lidt af syren har reageret, så *x* kan undværes i nævneren. Genvejen holder, når omdannelsesgraden er under omkring 5 %." data-noegle="form2" data-med="find omr2"><rect x="516.0" y="107.0" width="236.0" height="128.0" rx="14" fill="#5b6b78" opacity="0.16" filter="url(#sfb6-hvf-blur)"/><rect x="514.0" y="102.0" width="236.0" height="128.0" rx="14" fill="url(#sfb6-hvf-kort)" stroke="#c9d6e0" stroke-width="1.1"/><text x="632.0" y="129.0" font-size="15" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>Svag syre</tspan></text><text x="632.0" y="166.0" font-size="16" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>pH = ½ · (pK</tspan><tspan dy="3.52" font-size="10.9">s</tspan><tspan dy="-3.52"> − log c</tspan><tspan dy="3.52" font-size="10.9">s</tspan><tspan dy="-3.52">)</tspan></text><text x="632.0" y="200.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>kun lidt af syren</tspan></text><text x="632.0" y="218.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>har reageret</tspan></text></g>
</svg>
