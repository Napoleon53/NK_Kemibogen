<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 1 756 190" width="750" height="188.5" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Reaktionsbrøken for N2 + 3 H2 = 2 NH3. Koncentrationen af produktet NH3 står over brøkstregen, og koncentrationerne af reaktanterne N2 og H2 står under brøkstregen, ganget med hinanden. Koefficienterne bliver til eksponenter, så NH3 står i anden og H2 i tredje. Koefficienten 1 foran N2 skrives ikke">
<title>Reaktionsbrøken for N2 + 3 H2 = 2 NH3. Koncentrationen af produktet NH3 står over brøkstregen, og koncentrationerne af reaktanterne N2 og H2 står under brøkstregen, ganget med hinanden. Koefficienterne bliver til eksponenter, så NH3 står i anden og H2 i tredje. Koefficienten 1 foran N2 skrives ikke</title>
