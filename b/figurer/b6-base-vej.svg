<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 204" width="756" height="204" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Regnevejen for en base i tre trin: fra basens koncentration til hydroxidkoncentrationen, til pOH og til pH. For en svag base er der en genvej direkte til pOH">
<title>Regnevejen for en base i tre trin: fra basens koncentration til hydroxidkoncentrationen, til pOH og til pH. For en svag base er der en genvej direkte til pOH</title>
<defs><radialGradient id="sfb6-bv-hyd" cx="0.36" cy="0.3" r="0.78"><stop offset="0" stop-color="#fff6e0"/><stop offset="0.5" stop-color="#f7b24a"/><stop offset="1" stop-color="#c46f0c"/></radialGradient><radialGradient id="sfb6-bv-glod-pos" cx="0.5" cy="0.5" r="0.5"><stop offset="0.5" stop-color="#e5533d" stop-opacity="0.4"/><stop offset="1" stop-color="#e5533d" stop-opacity="0"/></radialGradient><radialGradient id="sfb6-bv-glod-neg" cx="0.5" cy="0.5" r="0.5"><stop offset="0.5" stop-color="#2f6fde" stop-opacity="0.36"/><stop offset="1" stop-color="#2f6fde" stop-opacity="0"/></radialGradient><linearGradient id="sfb6-bv-kort" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fbfdfe"/><stop offset="1" stop-color="#eaf1f6"/></linearGradient><filter id="sfb6-bv-blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter></defs><g class="peg-vejledning" data-tekst="Peg på et trin eller på genvejen i regnevejen."/><g class="peg" data-titel="*c*_{b}: basens formelle koncentration" data-tekst="Udgangspunktet er basens formelle koncentration." data-noegle="kasse0"><rect x="6.0" y="41.0" width="118.0" height="82.0" rx="14" fill="#5b6b78" opacity="0.16" filter="url(#sfb6-bv-blur)"/><rect x="4.0" y="36.0" width="118.0" height="82.0" rx="14" fill="url(#sfb6-bv-kort)" stroke="#c9d6e0" stroke-width="1.1"/><text x="63.0" y="73.0" font-size="18" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>c</tspan><tspan dy="3.96" font-size="12.2">b</tspan></text><text x="63.0" y="93.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>basens formelle</tspan></text><text x="63.0" y="110.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>koncentration</tspan></text></g><g class="peg" data-titel="Trin 1: fra *c*_{b} til [OH^{−}]" data-tekst="En base danner hydroxidioner, ikke oxoniumioner. Derfor finder man først [OH^{−}]. For en stærk base er [OH^{−}] lig med den formelle koncentration, *c*_{b}. For en svag base har kun en del af basen reageret, og så skal ligningen løses." data-noegle="kasse1" data-med="kasse0"><rect x="142.0" y="11.0" width="190.0" height="142.0" rx="14" fill="#5b6b78" opacity="0.16" filter="url(#sfb6-bv-blur)"/><rect x="140.0" y="6.0" width="190.0" height="142.0" rx="14" fill="url(#sfb6-bv-kort)" stroke="#c9d6e0" stroke-width="1.1"/><circle cx="158.0" cy="26.0" r="12.0" fill="#0f766e"/><text x="158.0" y="31.0" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>1</tspan></text><text x="178.0" y="31.5" font-size="15" text-anchor="start" fill="#0f766e" font-weight="700"><tspan>Hydroxid</tspan></text><text x="156.0" y="70.0" font-size="13.5" text-anchor="start" fill="#556766"><tspan>stærk base:</tspan></text><text x="156.0" y="92.0" font-size="16" text-anchor="start" fill="#14201f" font-weight="700"><tspan>[OH</tspan><tspan dy="-6.08" font-size="10.9">−</tspan><tspan dy="6.08">] = c</tspan><tspan dy="3.52" font-size="10.9">b</tspan></text><text x="156.0" y="118.0" font-size="13.5" text-anchor="start" fill="#556766"><tspan>svag base:</tspan></text><text x="156.0" y="138.0" font-size="15" text-anchor="start" fill="#14201f" font-weight="700"><tspan>løs ligningen</tspan></text></g><g class="peg" data-titel="Trin 2: pOH = −log [OH^{−}]" data-tekst="pOH beregnes af koncentrationen af hydroxidioner." data-noegle="kasse2" data-med="kasse1"><rect x="350.0" y="11.0" width="190.0" height="142.0" rx="14" fill="#5b6b78" opacity="0.16" filter="url(#sfb6-bv-blur)"/><rect x="348.0" y="6.0" width="190.0" height="142.0" rx="14" fill="url(#sfb6-bv-kort)" stroke="#c9d6e0" stroke-width="1.1"/><circle cx="366.0" cy="26.0" r="12.0" fill="#0f766e"/><text x="366.0" y="31.0" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>2</tspan></text><text x="386.0" y="31.5" font-size="15" text-anchor="start" fill="#0f766e" font-weight="700"><tspan>pOH</tspan></text><text x="443.0" y="92.0" font-size="16" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>pOH = −log [OH</tspan><tspan dy="-6.08" font-size="10.9">−</tspan><tspan dy="6.08">]</tspan></text></g><g class="peg" data-titel="Trin 3: pH = 14,00 − pOH" data-tekst="Det sidste trin bruger sammenhængen pH + pOH = 14,00." data-noegle="kasse3" data-med="kasse2"><rect x="558.0" y="11.0" width="190.0" height="142.0" rx="14" fill="#5b6b78" opacity="0.16" filter="url(#sfb6-bv-blur)"/><rect x="556.0" y="6.0" width="190.0" height="142.0" rx="14" fill="url(#sfb6-bv-kort)" stroke="#c9d6e0" stroke-width="1.1"/><circle cx="574.0" cy="26.0" r="12.0" fill="#0f766e"/><text x="574.0" y="31.0" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>3</tspan></text><text x="594.0" y="31.5" font-size="15" text-anchor="start" fill="#0f766e" font-weight="700"><tspan>pH</tspan></text><text x="651.0" y="92.0" font-size="16" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>pH = 14,00 − pOH</tspan></text><text x="651.0" y="122.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>fordi pH + pOH = 14,00</tspan></text></g><line x1="124.0" y1="77.0" x2="132.7" y2="77.0" stroke="#556766" stroke-width="1.8" stroke-linecap="round"/><path d="M 138.0,77.0 L 130.0,80.8 L 132.2,77.0 L 130.0,73.2 Z" fill="#556766" stroke="#556766" stroke-width="0.6" stroke-linejoin="round"/><line x1="332.0" y1="77.0" x2="340.7" y2="77.0" stroke="#556766" stroke-width="1.8" stroke-linecap="round"/><path d="M 346.0,77.0 L 338.0,80.8 L 340.2,77.0 L 338.0,73.2 Z" fill="#556766" stroke="#556766" stroke-width="0.6" stroke-linejoin="round"/><line x1="540.0" y1="77.0" x2="548.7" y2="77.0" stroke="#556766" stroke-width="1.8" stroke-linecap="round"/><path d="M 554.0,77.0 L 546.0,80.8 L 548.2,77.0 L 546.0,73.2 Z" fill="#556766" stroke="#556766" stroke-width="0.6" stroke-linejoin="round"/><g class="peg" data-titel="Genvej for en svag base" data-tekst="Formlen pOH = ½ · (p*K*_{b} − log *c*_{b}) fører direkte fra den formelle koncentration til pOH. Genvejen gælder kun for svage baser." data-noegle="genvej" data-med="kasse0 kasse2"><path d="M 63.0,124.0 V 162.0 Q 63.0,172.0 73.0,172.0 H 433.0 Q 443.0,172.0 443.0,162.0 V 162.0" fill="none" stroke="#1d4ed8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 443.0,151.0 L 447.8,162.0 L 443.0,158.7 L 438.2,162.0 Z" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0.8" stroke-linejoin="round"/><text x="253.0" y="194.0" font-size="14" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>genvej for en svag base: pOH = ½ · (pK</tspan><tspan dy="3.08" font-size="9.5">b</tspan><tspan dy="-3.08"> − log c</tspan><tspan dy="3.08" font-size="9.5">b</tspan><tspan dy="-3.08">)</tspan></text><rect class="peg-maal" x="53.0" y="152.0" width="400.0" height="50.0" fill="none"/></g>
</svg>
