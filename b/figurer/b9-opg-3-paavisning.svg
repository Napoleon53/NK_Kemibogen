<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 236" width="760" height="236" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Fire reagensglas med prøver fra tre glas. Prøven fra glas 1 er blevet blodrød med thiocyanat. Prøven fra glas 2 er blevet mørkeblå med ammoniakvand i overskud. Den ene prøve fra glas 3 er stadig farveløs med thiocyanat, og den anden prøve fra glas 3 har givet et rødt bundfald med dimethylglyoxim">
<title>Fire reagensglas med prøver fra tre glas. Prøven fra glas 1 er blevet blodrød med thiocyanat. Prøven fra glas 2 er blevet mørkeblå med ammoniakvand i overskud. Den ene prøve fra glas 3 er stadig farveløs med thiocyanat, og den anden prøve fra glas 3 har givet et rødt bundfald med dimethylglyoxim</title>
