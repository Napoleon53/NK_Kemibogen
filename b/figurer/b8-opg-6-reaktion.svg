<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 294" width="700" height="294" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En TLC-plade med fire baner set under ultraviolet lys. Bane 1 er rent A med en plet højt oppe. Bane 2 er reaktionsblandingen efter 0 minutter med en plet i samme højde. Bane 3 er reaktionsblandingen efter 10 minutter med en mindre plet i samme højde og en ny plet længere nede. Bane 4 er reaktionsblandingen efter 30 minutter med kun den nederste plet">
