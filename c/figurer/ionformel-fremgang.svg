<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 656 363" width="656" height="363" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Formlen for jern(III)sulfid i fire trin. Trin 1: find de to ioner og deres ladninger, Fe3+ og S2−. Trin 2: find det mindste antal af hver ion, så ladningerne går lige op. To Fe3+ giver +6, og tre S2− giver −6, så klodserne er lige lange. Trin 3: skriv den positive ion først og antallet som et lille tal efter ionen. Tallet 1 skrives ikke. Trin 4: udelad ladningerne, for de har udlignet hinanden. Formlen er Fe2S3">
<title>Formlen for jern(III)sulfid i fire trin. Trin 1: find de to ioner og deres ladninger, Fe3+ og S2−. Trin 2: find det mindste antal af hver ion, så ladningerne går lige op. To Fe3+ giver +6, og tre S2− giver −6, så klodserne er lige lange. Trin 3: skriv den positive ion først og antallet som et lille tal efter ionen. Tallet 1 skrives ikke. Trin 4: udelad ladningerne, for de har udlignet hinanden. Formlen er Fe2S3</title>
