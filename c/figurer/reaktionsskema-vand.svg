<title>Reaktionsskemaet 2 H2 + O2 bliver til 2 H2O med molekylerne over. Før pilen står reaktanterne, to dihydrogenmolekyler og et dioxygenmolekyle, og efter pilen står produktet, to vandmolekyler. Pilen hedder reaktionspilen og læses bliver til. Der er 4 H-atomer og 2 O-atomer på begge sider</title>
