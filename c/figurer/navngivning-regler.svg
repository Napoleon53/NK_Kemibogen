<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 3 736 299" width="736" height="299" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Navngivning af 4-ethyl-2,3-dimethylheptan i seks trin. Molekylet står til venstre med hovedkæden nummereret fra 1 til 7. Trin 1: den længste kæde har 7 carbonatomer, heptan. Trin 2: kæden nummereres fra den ende, der er nærmest en sidegruppe, så sidegrupperne sidder på nr. 2, 3 og 4. Trin 3: 2-methyl, 3-methyl og 4-ethyl. Trin 4: to methylgrupper giver 2,3-dimethyl. Trin 5: ethyl står før methyl. Trin 6: komma mellem tal og bindestreg mellem tal og bogstav giver 4-ethyl-2,3-dimethylheptan">
<title>Navngivning af 4-ethyl-2,3-dimethylheptan i seks trin. Molekylet står til venstre med hovedkæden nummereret fra 1 til 7. Trin 1: den længste kæde har 7 carbonatomer, heptan. Trin 2: kæden nummereres fra den ende, der er nærmest en sidegruppe, så sidegrupperne sidder på nr. 2, 3 og 4. Trin 3: 2-methyl, 3-methyl og 4-ethyl. Trin 4: to methylgrupper giver 2,3-dimethyl. Trin 5: ethyl står før methyl. Trin 6: komma mellem tal og bindestreg mellem tal og bogstav giver 4-ethyl-2,3-dimethylheptan</title>
