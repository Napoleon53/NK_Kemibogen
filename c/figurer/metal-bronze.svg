<title>To tegninger af atomerne i et metal. I rent kobber er alle atomerne lige store og sidder i lag, og de to øverste lag kan glide forbi resten. I bronze sidder der nogle større tinatomer mellem kobberatomerne, så lagene bliver ujævne, og det gør det svært for lagene at glide</title>
