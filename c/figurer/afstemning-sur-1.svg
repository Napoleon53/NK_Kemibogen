<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 9 668 288" width="668" height="288" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Trin 1. Reaktionsskemaet med oxidationstal over kobber og nitrogen. Under skemaet går en pil fra kobber til kobber med tallet 2 for oxidationen og en pil fra nitrogen til nitrogen med tallet 3 for reduktionen">
<title>Trin 1. Reaktionsskemaet med oxidationstal over kobber og nitrogen. Under skemaet går en pil fra kobber til kobber med tallet 2 for oxidationen og en pil fra nitrogen til nitrogen med tallet 3 for reduktionen</title>
<text x="154.1" y="64.0" font-size="26" text-anchor="start" fill="#14201f" font-weight="700"><tspan>Cu</tspan></text><text x="171.4" y="26.0" font-size="15" text-anchor="middle" fill="#b45309" font-weight="700"><tspan>0</tspan></text><text x="207.8" y="63.0" font-size="22" text-anchor="middle" fill="#556766"><tspan>+</tspan></text><text x="226.8" y="64.0" font-size="26" text-anchor="start" fill="#14201f" font-weight="700"><tspan>NO</tspan><tspan dy="5.72" font-size="17.7">3</tspan><tspan dy="-15.60" font-size="17.7">−</tspan></text><text x="236.1" y="26.0" font-size="15" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>+V</tspan></text><text x="361.9" y="64.0" font-size="26" text-anchor="start" fill="#14201f" font-weight="700"><tspan>Cu</tspan><tspan dy="-9.88" font-size="17.7">2+</tspan></text><text x="379.2" y="26.0" font-size="15" text-anchor="middle" fill="#b45309" font-weight="700"><tspan>+II</tspan></text><text x="435.7" y="63.0" font-size="22" text-anchor="middle" fill="#556766"><tspan>+</tspan></text><text x="454.7" y="64.0" font-size="26" text-anchor="start" fill="#14201f" font-weight="700"><tspan>NO</tspan></text><text x="464.1" y="26.0" font-size="15" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>+II</tspan></text><line x1="299.9" y1="55.0" x2="335.9" y2="55.0" stroke="#14201f" stroke-width="2.6" stroke-linecap="round"/><polygon points="347.9,55.0 335.9,61.0 335.9,49.0" fill="#14201f"/><path d="M 171.4,78.0 V 104.0 H 379.2 V 89.0" fill="none" stroke="#b45309" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="379.2,78.0 373.2,89.0 385.3,89.0" fill="#b45309"/><rect x="301.8" y="91.0" width="44.2" height="26.0" rx="6" fill="#ffffff"/><text x="323.9" y="110.0" font-size="17" text-anchor="middle" fill="#b45309" font-weight="700"><tspan>↑ 2</tspan></text><text x="323.9" y="131.0" font-size="14" text-anchor="middle" fill="#b45309" font-weight="700"><tspan>oxidation</tspan></text><path d="M 236.1,78.0 V 156.0 H 464.1 V 89.0" fill="none" stroke="#ffffff" stroke-width="8.4" stroke-linejoin="round"/><path d="M 236.1,78.0 V 156.0 H 464.1 V 89.0" fill="none" stroke="#1d4ed8" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="464.1,78.0 458.1,89.0 470.2,89.0" fill="#1d4ed8"/><rect x="301.8" y="143.0" width="44.2" height="26.0" rx="6" fill="#ffffff"/><text x="323.9" y="162.0" font-size="17" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>↓ 3</tspan></text><text x="323.9" y="183.0" font-size="14" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>reduktion</tspan></text><rect x="84.0" y="198.0" width="500.0" height="92.0" rx="10" fill="#f4f8f7" stroke="#dfe9e8" stroke-width="1.2"/><text x="104.0" y="222.0" font-size="15" text-anchor="start" fill="#14201f"><tspan>Kobber stiger fra 0 til +II. Det er 2.</tspan></text><text x="104.0" y="244.0" font-size="15" text-anchor="start" fill="#14201f"><tspan>Nitrogen falder fra +V til +II. Det er 3.</tspan></text><text x="104.0" y="268.0" font-size="15" text-anchor="start" fill="#0f766e" font-weight="700"><tspan>Stigningen og faldet er ikke lige store endnu.</tspan></text>
</svg>
