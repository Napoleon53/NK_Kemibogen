<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 236" width="740" height="236" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En vandret skala fra lille dosis til stor dosis med tre områder. Over området for lidt ligger én tablet, over passende dosis to tabletter og over for meget en lille bunke tabletter. For lidt virker ikke, en passende dosis virker, som den skal, og for meget skader kroppen. Nederst står, at en voksen må tage 1 gram paracetamol ad gangen og højst 4 gram i døgnet">
<title>En vandret skala fra lille dosis til stor dosis med tre områder. Over området for lidt ligger én tablet, over passende dosis to tabletter og over for meget en lille bunke tabletter. For lidt virker ikke, en passende dosis virker, som den skal, og for meget skader kroppen. Nederst står, at en voksen må tage 1 gram paracetamol ad gangen og højst 4 gram i døgnet</title>
