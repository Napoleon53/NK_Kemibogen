"Lakmus er rød i syre og blå i base. Farven skifter mellem pH 5 og 8." data-noegle="Lakmus"><rect x="196.0" y="20.0" width="540.0" height="28.0" rx="7" fill="url(#ind0)" stroke="#556766" stroke-width="1.1"/><text x="184.0" y="39.0" font-size="14.5" text-anchor="end" fill="#14201f" font-weight="700"><tspan>Lakmus</tspan></text><text x="314.1" y="39.0" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>rød</tspan></text><text x="601.0" y="39.0" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>blå</tspan></text></g><g class="peg" data-titel="Bromthymolblåt (BTB)" data-tekst="Bromthymolblåt, som ofte kaldes BTB, er gul i syre, grøn omkring pH 7 og blå i base." data-noegle="Bromthymolblåt"><rect x="196.0" y="62.0" width="540.0" height="28.0" rx="7" fill="url(#ind1)" stroke="#556766" stroke-width="1.1"/><text x="184.0" y="81.0" font-size="14.5" text-anchor="end" fill="#14201f" font-weight="700"><tspan>Bromthymolblåt (BTB)</tspan></text><text x="331.0" y="81.0" font-size="13" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>gul</tspan></text><text x="594.2" y="81.0" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>blå</tspan></text></g><g class="peg" data-titel="Thymolblåt" data-tekst="Thymolblåt skifter farve to gange: fra rød til gul mellem pH 1,2 og 2,8 og fra gul til blå mellem pH 8,0 og 9,6. Det sidste omslag kan bruges til titreringer." data-noegle="Thymolblåt"><rect x="196.0" y="104.0" width="540.0" height="28.0" rx="7" fill="url(#ind2)" stroke="#556766" stroke-width="1.1"/><text x="184.0" y="123.0" font-size="14.5" text-anchor="end" fill="#14201f" font-weight="700"><tspan>Thymolblåt</tspan></text><text x="233.1" y="123.0" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>rød</tspan></text><text x="412.0" y="123.0" font-size="13" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>gul</tspan></text><text x="634.8" y="123.0" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>blå</tspan></text></g><g class="peg" data-titel="Phenolphthalein" data-tekst="Phenolphthalein er farveløs i sure og neutrale opløsninger og lyserød i basiske. Farven skifter mellem pH 8 og 10. Under pH 0 er den rød, og over pH 13 er den farveløs igen. Phenolphthalein bruges til titreringer." data-noegle="Phenolphthalein"><rect x="196.0" y="146.0" width="540.0" height="28.0" rx="7" fill="url(#ind3)" stroke="#556766" stroke-width="1.1"/><text x="184.0" y="165.0" font-size="14.5" text-anchor="end" fill="#14201f" font-weight="700"><tspan>Phenolphthalein</tspan></text><text x="368.1" y="165.0" font-size="13" text-anchor="middle" fill="#556766" font-weight="700"><tspan>farveløs</tspan></text><text x="601.0" y="165.0" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>lyserød</tspan></text></g><g class="peg" data-titel="Rødkålssaft" data-tekst="Rødkålssaft indeholder et naturligt farvestof, der skifter farve mange gange hen over skalaen: rød, violet, blå, grøn og gul." data-noegle="Rødkålssaft"><rect x="196.0" y="188.0" width="540.0" height="28.0" rx="7" fill="url(#ind4)" stroke="#556766" stroke-width="1.1"/><text x="184.0" y="207.0" font-size="14.5" text-anchor="end" fill="#14201f" font-weight="700"><tspan>Rødkålssaft</tspan></text><text x="273.6" y="207.0" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>rød</tspan></text><text x="418.8" y="207.0" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>violet</tspan></text><text x="503.1" y="207.0" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>blå</tspan></text><text x="584.1" y="207.0" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>grøn</tspan></text><text x="671.9" y="207.0" font-size="13" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>gul</tspan></text></g><line x1="196.0" y1="234.0" x2="182.0" y2="234.0" stroke="#5567