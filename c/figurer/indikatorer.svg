<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 766 288" width="766" height="288" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Farven af fem indikatorer langs pH-skalaen: lakmus skifter fra rød til blå, bromthymolblåt fra gul til blå, thymolblåt fra rød til gul og senere fra gul til blå, phenolphthalein fra farveløs til lyserød og farveløs igen over pH 13 (rød under pH 0), og rødkålssaft fra rød over violet, blå og grøn til gul">
