<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 5 640 204" width="640" height="204" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Calciumphosphat som klodser. Øverst tre røde klodser for calciumioner, Ca2+, som hver er 2 enheder brede. Nederst to blå klodser for phosphationer, PO4 3−, som hver er 3 enheder brede. Begge rækker er 6 enheder lange: 3 calciumioner giver +6, og 2 phosphationer giver −6. Formlen er Ca3(PO4)2">
