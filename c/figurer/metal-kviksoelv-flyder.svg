<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 6 640 280" width="640" height="280" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="To bægerglas ved siden af hinanden med lige meget væske. I glasset med vand ligger et jernsøm på bunden, fordi jern med 7,9 g/mL har større densitet end vand med 1,00 g/mL. I glasset med kviksølv flyder det samme søm oven på overfladen med lidt over halvdelen af tykkelsen nede i kviksølvet, fordi kviksølv med 13,5 g/mL har større densitet end jern. Kviksølvet er en blank, sølvgrå væske, der spejler sømmet, og overfladen bøjer nedad ved glasset">
<title>To bægerglas ved siden af hinanden med lige meget væske. I glasset med vand ligger et jernsøm på bunden, fordi jern med 7,9 g/mL har større densitet end vand med 1,00 g/mL. I glasset med kviksølv flyder det samme søm oven på overfladen med lidt over halvdelen af tykkelsen nede i kviksølvet, fordi kviksølv med 13,5 g/mL har større densitet end jern. Kviksølvet er en blank, sølvgrå væske, der spejler sømmet, og overfladen bøjer nedad ved glasset</title>
