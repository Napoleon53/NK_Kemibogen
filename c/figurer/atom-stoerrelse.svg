<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 150" width="470" height="150" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Atomet er meget større end sin kerne">
<title>Atomet er meget større end sin kerne</title>
<defs><radialGradient id="tom"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6effc"/></radialGradient></defs><circle cx="72.0" cy="72.0" r="66.0" fill="url(#tom)" stroke="#1b4aa3" stroke-width="1.5" stroke-dasharray="6 5"/><line x1="112.6" y1="20.0" x2="164.0" y2="24.0" stroke="#556766" stroke-width="1.1" stroke-linecap="round"/><circle cx="112.6" cy="20.0" r="2.4" fill="#556766"/><text x="172.0" y="22.0" font-size="16" text-anchor="start" fill="#14201f" font-weight="700"><tspan>Atomet</tspan></text><text x="172.0" y="41.0" font-size="13.5" text-anchor="start" fill="#556766"><tspan>Forestil dig, at det fylder en hel by.</tspan></text><line x1="72.0" y1="72.0" x2="164.0" y2="78.0" stroke="#556766" stroke-width="1.1" stroke-linecap="round"/><circle cx="72.0" cy="72.0" r="2.4" fill="#556766"/><circle cx="72.0" cy="72.0" r="2.6" fill="#e5533d" stroke="#a93226" stroke-width="0.8"/><text x="172.0" y="76.0" font-size="16" text-anchor="start" fill="#14201f" font-weight="700"><tspan>Kernen</tspan></text><text x="172.0" y="95.0" font-size="13.5" text-anchor="start" fill="#556766"><tspan>Så er kernen kun en appelsin midt i byen.</tspan></text><text x="172.0" y="124.0" font-size="13.5" text-anchor="start" fill="#556766"><tspan>Resten af atomet er næsten tomt rum,</tspan></text><text x="172.0" y="142.0" font-size="13.5" text-anchor="start" fill="#556766"><tspan>hvor elektronerne bevæger sig.</tspan></text>
</svg>
