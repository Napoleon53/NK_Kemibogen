<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 5 530 198" width="530" height="198" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Atomet er meget større end sin kerne">
<title>Atomet er meget større end sin kerne</title>
<defs><radialGradient id="tom"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6effc"/></radialGradient></defs><circle cx="104.0" cy="104.0" r="92.0" fill="url(#tom)" stroke="#1b4aa3" stroke-width="1.5" stroke-dasharray="6 5"/><line x1="160.6" y1="31.5" x2="236.0" y2="32.0" stroke="#556766" stroke-width="1.1" stroke-linecap="round"/><circle cx="160.6" cy="31.5" r="2.4" fill="#556766"/><text x="244.0" y="30.0" font-size="16" text-anchor="start" fill="#14201f" font-weight="700"><tspan>Atomet</tspan></text><text x="244.0" y="49.0" font-size="13.5" text-anchor="start" fill="#556766"><tspan>Forestil dig, at det fylder en hel by.</tspan></text><line x1="104.0" y1="104.0" x2="236.0" y2="102.0" stroke="#556766" stroke-width="1.1" stroke-linecap="round"/><circle cx="104.0" cy="104.0" r="2.4" fill="#556766"/><circle cx="104.0" cy="104.0" r="2.6" fill="#e5533d" stroke="#a93226" stroke-width="0.8"/><text x="244.0" y="100.0" font-size="16" text-anchor="start" fill="#14201f" font-weight="700"><tspan>Kernen</tspan></text><text x="244.0" y="119.0" font-size="13.5" text-anchor="start" fill="#556766"><tspan>Så er kernen kun en appelsin midt i byen.</tspan></text><text x="244.0" y="166.0" font-size="13.5" text-anchor="start" fill="#556766"><tspan>Resten af atomet er næsten tomt rum,</tspan></text><text x="244.0" y="184.0" font-size="13.5" text-anchor="start" fill="#556766"><tspan>hvor elektronerne bevæger sig.</tspan></text>
</svg>
