<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 22 790 286" width="790" height="286" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En tidslinje fra 5000 før Kristi fødsel til 2000 efter. Omkring 5000 før Kristus hentede man kobber ud af malm, og omkring 3000 før Kristus fremstillede man bronze i Mellemøsten. Omkring 1300 før Kristus fik farao Tutankhamon en dolk af meteorjern med i graven, og omkring 1200 før Kristus fremstillede man jern i stor stil i Mellemøsten. I 1825 fremstillede H.C. Ørsted aluminium. Under tidslinjen står Danmarks perioder: stenalder til 1700 før Kristus, bronzealder til 500 før Kristus, jernalder til 800 efter Kristus, vikingetid til 1050 og derefter middelalder og nyere tid. Solvognen fra Trundholm Mose er fra omkring 1400 før Kristus i bronzealderen">
