<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 16 780 171" width="780" height="171" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En søjle, der viser verdens plastaffald i 2019 fordelt på fire veje: 9 % blev genbrugt, 19 % blev brændt, 50 % blev lagt på lossepladser, og 22 % endte uden kontrol, fx i naturen">
<title>En søjle, der viser verdens plastaffald i 2019 fordelt på fire veje: 9 % blev genbrugt, 19 % blev brændt, 50 % blev lagt på lossepladser, og 22 % endte uden kontrol, fx i naturen</title>
<text x="40.0" y="34.0" font-size="15.5" text-anchor="start" fill="#14201f" font-weight="700"><tspan>350 millioner tons plastaffald i 2019</tspan></text><rect x="40.0" y="52.0" width="63.0" height="54.0" rx="0" fill="#7fb277"/><text x="71.5" y="85.0" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>9 %</tspan></text><rect x="103.0" y="52.0" width="133.0" height="54.0" rx="0" fill="#f2b766"/><text x="169.5" y="85.0" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>19 %</tspan></text><rect x="236.0" y="52.0" width="350.0" height="54.0" rx="0" fill="#c9d1d2"/><text x="411.0" y="85.0" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>50 %</tspan></text><rect x="586.0" y="52.0" width="154.0" height="54.0" rx="0" fill="#e3a49a"/><text x="663.0" y="85.0" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>22 %</tspan></text><rect x="40.0" y="52.0" width="700.0" height="54.0" rx="0" fill="none" stroke="#556766" stroke-width="1.4"/><rect x="40.0" y="132.0" width="18.0" height="18.0" rx="3" fill="#7fb277" stroke="#3f7d3a" stroke-width="1.2"/><text x="68.0" y="146.0" font-size="14" text-anchor="start" fill="#14201f"><tspan>genbrugt</tspan></text><rect x="400.0" y="132.0" width="18.0" height="18.0" rx="3" fill="#f2b766" stroke="#b45309" stroke-width="1.2"/><text x="428.0" y="146.0" font-size="14" text-anchor="start" fill="#14201f"><tspan>brændt</tspan></text><rect x="40.0" y="162.0" width="18.0" height="18.0" rx="3" fill="#c9d1d2" stroke="#7b8a8d" stroke-width="1.2"/><text x="68.0" y="176.0" font-size="14" text-anchor="start" fill="#14201f"><tspan>lagt på lossepladser</tspan></text><rect x="400.0" y="162.0" width="18.0" height="18.0" rx="3" fill="#e3a49a" stroke="#a93226" stroke-width="1.2"/><text x="428.0" y="176.0" font-size="14" text-anchor="start" fill="#14201f"><tspan>uden kontrol, fx i naturen</tspan></text>
</svg>
