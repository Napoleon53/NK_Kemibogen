<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 3 750 561" width="750" height="561" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="0,20 mol calciumchlorid opløses i vand til 1,0 L opløsning. Før: en lup med to formelenheder calciumchlorid i et lille iongitter, og søjler med den formelle koncentration, 0,20 M calciumchlorid og ingen ioner. Efter: en lup med lige meget væske, hvor der er to calciumioner og fire chloridioner og ingen hele formelenheder, og søjler med de aktuelle koncentrationer, 0 M calciumchlorid, 0,20 M calciumioner og 0,40 M chloridioner. Søjlerne er delt i stykker på 0,10 M, ét for hver formelenhed eller ion i luppen">
