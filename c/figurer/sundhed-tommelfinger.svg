<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 5 760 306" width="760" height="306" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Skema med tre molekyler tegnet som kæder af brikker, hvor en grå brik er et carbonatom og en grøn brik er en polær gruppe. Der skal 4 carbonatomer til at ophæve én polær gruppe. Ethanol (alkohol) har 2 carbonatomer og 1 polær gruppe, OH. Der skal 4 carbonatomer til, så ethanol er polært. Glucose (sukker) har 6 carbonatomer og 5 polære grupper, OH. Der skal 20 carbonatomer til, så glucose er meget polært. Stearinsyre (fedtsyre) har 18 carbonatomer, og det ene sidder i den polære gruppe COOH. Der skal 4 carbonatomer til, så stearinsyre er upolært">
