<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 1 724 540" width="724" height="540" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Øverst fire reagensglas med mundingen nedad og en prop i, hvert delt i tre lige store dele med to streger. Glas 1 har tre dele dihydrogen, glas 2 to dele dihydrogen og en del dioxygen, glas 3 en del dihydrogen og to dele dioxygen, og glas 4 tre dele dioxygen. Glas 1 til 3 testes med en flamme og glas 4 med en glødende træspån. Nederst tre trin. 1: et reagensglas fyldt med vand står med mundingen nedad i en balje med vand, og dihydrogen fra en slange bobler op i glasset og skubber vandet ned til den første streg. Bagefter kommer dioxygen på samme måde. 2: når glasset er fyldt med gas, sættes en prop i under vandet. 3: glasset holdes i en reagensglasholder med mundingen nedad og føres hen til flammen fra en bunsenbrænder, efter at proppen er taget ud">
<title>Øverst fire reagensglas med mundingen nedad og en prop i, hvert delt i tre lige store dele med to streger. Glas 1 har tre dele dihydrogen, glas 2 to dele dihydrogen og en del dioxygen, glas 3 en del dihydrogen og to dele dioxygen, og glas 4 tre dele dioxygen. Glas 1 til 3 testes med en flamme og glas 4 med en glødende træspån. Nederst tre trin. 1: et reagensglas fyldt med vand står med mundingen nedad i en balje med vand, og dihydrogen fra en slange bobler op i glasset og skubber vandet ned til den første streg. Bagefter kommer dioxygen på samme måde. 2: når glasset er fyldt med gas, sættes en prop i under vandet. 3: glasset holdes i en reagensglasholder med mundingen nedad og føres hen til flammen fra en bunsenbrænder, efter at proppen er taget ud</title>
