<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 656 263" width="656" height="263" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Navnet på Cu(NO3)2 i tre trin. Trin 1: del formlen i ioner, og find ladningen på den negative ion. Formlen består af kobber, hvis ladning endnu ikke kendes, og to nitrationer, NO3−. Trin 2: find ladningen på metalionen, så ladningerne går lige op. To NO3− giver −2, så kobber skal give +2, og ionen er Cu2+. Trin 3: skriv navnet med den positive ion først og ladningen som romertal. Navnet er kobber(II)nitrat">
<title>Navnet på Cu(NO3)2 i tre trin. Trin 1: del formlen i ioner, og find ladningen på den negative ion. Formlen består af kobber, hvis ladning endnu ikke kendes, og to nitrationer, NO3−. Trin 2: find ladningen på metalionen, så ladningerne går lige op. To NO3− giver −2, så kobber skal give +2, og ionen er Cu2+. Trin 3: skriv navnet med den positive ion først og ladningen som romertal. Navnet er kobber(II)nitrat</title>
