ze="13.5" text-anchor="start" fill="#556766"><tspan>2-tallet giver to nitrationer</tspan></text><circle cx="25.0" cy="87.0" r="13.0" fill="#0f766e"/><text x="25.0" y="92.5" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>2</tspan></text><text x="48.0" y="92.0" font-size="14.5" text-anchor="start" fill="#14201f" font-weight="700"><tspan>Find ladningen på metalionen, så ladningerne går lige op</tspan></text><rect x="49.0" y="106.0" width="90.0" height="40.0" rx="7" fill="#fbd3ca" stroke="#c0392b" stroke-width="1.5"/><line x1="66.5" y1="136.0" x2="75.5" y2="136.0" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/><line x1="71.0" y1="131.5" x2="71.0" y2="140.5" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/><line x1="112.5" y1="136.0" x2="121.5" y2="136.0" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/><line x1="117.0" y1="131.5" x2="117.0" y2="140.5" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/><text x="94.0" y="128.0" font-size="16" text-anchor="middle" fill="#7a1f14" font-weight="700"><tspan>Cu</tspan><tspan dy="-6.08" font-size="10.9">2+</tspan></text><rect x="49.0" y="149.0" width="44.0" height="40.0" rx="7" fill="#cfe0fb" stroke="#1d4ed8" stroke-width="1.5"/><line x1="66.5" y1="159.0" x2="75.5" y2="159.0" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round"/><text x="71.0" y="180.0" font-size="16" text-anchor="middle" fill="#12307f" font-weight="700"><tspan>NO</tspan><tspan dy="3.52" font-size="10.9">3</tspan><tspan dy="-9.60" font-size="10.9">−</tspan></text><rect x="95.0" y="149.0" width="44.0" height="40.0" rx="7" fill="#cfe0fb" stroke="#1d4ed8" stroke-width="1.5"/><line x1="112.5" y1="159.0" x2="121.5" y2="159.0" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round"/><text x="117.0" y="180.0" font-size="16" text-anchor="middle" fill="#12307f" font-weight="700"><tspan>NO</tspan><tspan dy="3.52" font-size="10.9">3</tspan><tspan dy="-9.60" font-size="10.9">−</tspan></text><text x="166.0" y="131.5" font-size="15" text-anchor="start" fill="#7a1f14" font-weight="700"><tspan>Cu skal give +2</tspan></text><text x="166.0" y="174.5" font-size="15" text-anchor="start" fill="#12307f" font-weight="700"><tspan>2 NO</tspan><tspan dy="3.30" font-size="10.2">3</tspan><tspan dy="-9.00" font-size="10.2">−</tspan><tspan dy="5.70"> giver −2</tspan></text><text x="338.0" y="154.5" font-size="21" text-anchor="start" fill="#1d7a3a" font-weight="700"><tspan>✓</tspan></text><text x="362.0" y="143.5" font-size="15" text-anchor="start" fill="#1d7a3a" font-weight="700"><tspan>Lige stor negativ</tspan></text><text x="362.0" y="162.5" font-size="15" text-anchor="start" fill="#1d7a3a" font-weight="700"><tspan>og positiv ladning</tspan></text><circle cx="25.0" cy="210.0" r="13.0" fill="#0f766e"/><text x="25.0" y="215.5" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>3</tspan></text><text x="48.0" y="215.0" font-size="14.5" text-anchor="start" fill="#14201f" font-weight="700"><tspan>Skriv navnet med den positive ion først og ladningen som romertal</tspan></text><text x="48" y="252" font-size="24" font-weight="700" fill="#14201f">kobber<tspan fill="#c0392b">(II)</tspan>nitrat</text><text x="238.0" y="250.0" font-size="15" text-anchor="start" fill="#556766"><tspan>er navnet på Cu(NO</tspan><tspan dy="3.30" font-size="10.2">3</tspan><tspan dy="-3.30">)</tspan><tspan dy="3.30" font-size="10.2">2</tspan></text>
</svg>
