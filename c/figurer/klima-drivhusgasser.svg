<rect x="16.0" y="14.0" width="232.0" height="216.0" rx="12" fill="#f4f8f7" stroke="#dfe9e8" stroke-width="1.2"/><text x="132.0" y="42.0" font-size="16" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Ikke drivhusgasser</tspan></text><rect x="264.0" y="14.0" width="500.0" height="216.0" rx="12" fill="#e6f0f9" stroke="#c5d9ec" stroke-width="1.2"/><text x="514.0" y="42.0" font-size="16" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Drivhusgasser</tspan></text><g class="peg-vejledning" data-tekst="Peg på et molekyle, og se, hvor gassen kommer fra."/><g class="peg" data-titel="Nitrogen, N_{2}" data-tekst="Nitrogen udgør 78 % af luften. Molekylet består af to ens atomer og kan ikke optage varmen fra Jorden. Derfor er nitrogen ikke en drivhusgas."><rect class="peg-maal" x="24.0" y="70.0" width="108.0" height="120.0" fill="none"/><circle cx="64.4" cy="104.0" r="17.0" fill="url(#kg-N) #3b6fd9" stroke="#1b3f8f" stroke-width="1.1"/><text x="64.4" y="109.8" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>N</tspan></text><circle cx="91.6" cy="104.0" r="17.0" fill="url(#kg-N) #3b6fd9" stroke="#1b3f8f" stroke-width="1.1"/><text x="91.6" y="109.8" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>N</tspan></text><text x="78.0" y="162.0" font-size="14" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>nitrogen, N</tspan><tspan dy="3.08" font-size="9.5">2</tspan></text><text x="78.0" y="181.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>78 % af luften</tspan></text></g><g class="peg" data-titel="Oxygen, O_{2}" data-tekst="Oxygen udgør 21 % af luften. Molekylet består af to ens atomer og kan ikke optage varmen fra Jorden. Derfor er oxygen ikke en drivhusgas."><rect class="peg-maal" x="132.0" y="70.0" width="108.0" height="120.0" fill="none"/><circle cx="172.4" cy="104.0" r="17.0" fill="url(#kg-O) #e5533d" stroke="#8f2a1b" stroke-width="1.1"/><text x="172.4" y="109.8" font-size