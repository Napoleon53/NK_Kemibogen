ethan er en meget kraftigere drivhusgas end carbondioxid, men der er langt mindre af den i luften."><rect class="peg-maal" x="398.0" y="70.0" width="108.0" height="120.0" fill="none"/><circle cx="468.3" cy="120.3" r="11.2" fill="url(#kg-H) #ffffff" stroke="#7d8a8e" stroke-width="1.1"/><text x="468.3" y="124.2" font-size="11" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>H</tspan></text><circle cx="435.7" cy="120.3" r="11.2" fill="url(#kg-H) #ffffff" stroke="#7d8a8e" stroke-width="1.1"/><text x="435.7" y="124.2" font-size="11" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>H</tspan></text><circle cx="435.7" cy="87.7" r="11.2" fill="url(#kg-H) #ffffff" stroke="#7d8a8e" stroke-width="1.1"/><text x="435.7" y="91.7" font-size="11" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>H</tspan></text><circle cx="468.3" cy="87.7" r="11.2" fill="url(#kg-H) #ffffff" stroke="#7d8a8e" stroke-width="1.1"/><text x="468.3" y="91.7" font-size="11" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>H</tspan></text><circle cx="452.0" cy="104.0" r="18.0" fill="url(#kg-C) #4b5563" stroke="#1c232b" stroke-width="1.1"/><text x="452.0" y="110.1" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>C</tspan></text><text x="452.0" y="162.0" font-size="14" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>methan</tspan></text><text x="452.0" y="181.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>CH</tspan><tspan dy="2.97" font-size="9.2">4</tspan></text></g><g class="peg" data-titel="Lattergas, N_{2}O" data-tekst="Lattergas har tre atomer i molekylet og er en drivhusgas. Den kommer især fra gødning på markerne. Lattergas er en meget kraftigere drivhusgas end carbondioxid, men der er langt mindre af den i luften."><rect class="peg-maal" x="520.0" y="70.0" width="108.0" height="120.0" fill="none"/><circle cx="550.8" cy="104.0" r="15.0" fill="url(#kg-N) #3b6fd9" stroke="#1b3f8f" stroke-width="1.1"/><text x="550.8" y="109.0" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>N</tspan></text><circle cx="597.2" cy="104.0" r="15.0" fill="url(#kg-O) #e5533d" stroke="#8f2a1b" stroke-width="1.1"/><text x="597.2" y="109.0" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>O</tspan></text><circle cx="574.0" cy="104.0" r="15.0" fill="url(#kg-N) #3b6fd9" stroke="#1b3f8f" stroke-width="1.1"/><text x="574.0" y="109.0" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>N</tspan></text><text x="574.0" y="162.0" font-size="14" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>lattergas</tspan></text><text x="574.0" y="181.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>N</tspan><tspan dy="2.97" font-size="9.2">2</tspan><tspan dy="-2.97">O</tspan></text></g><g class="peg" data-titel="Vanddamp, H_{2}O" data-tekst="Vanddamp har tre atomer i molekylet og er en drivhusgas. Den kommer især fra fordampning fra havet."><rect class="peg-maal" x="642.0" y="70.0" width="108.0" height="120.0" fill="none"/><circle cx="713.2" cy="113.3" r="10.5" fill="url(#kg-H) #ffffff" stroke="#7d8a8e" stroke-width="1.1"/><text x="713.2" y="116.9" font-size="10" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>H</tspan></text><circle cx="678.8" cy="113.3" r="10.5" fill="url(#kg-H) #ffffff" stroke="#7d8a8e" stroke-width="1.1"/><text x="678.8" y="116.9" font-size="10" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>H</tspan></text><circle cx="696.0" cy="100.0" r="17.0" fill="url(#kg-O) #e5533d" stroke="#8f2a1b" stroke-width="1.1"/><text x="696.0" y="105.8" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>O</tspan></text><text x="696.0" y="162.0" font-size="14" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>vanddamp</tspan></text><text x="696.0" y="181.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>H</tspan><tspan dy="2.97" font-size="9.2">2</tspan><tspan dy="-2.97">O</tspan></text></g><text x="132.0" y="214.0" font-size="13.5" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>kun to ens atomer</tspan></text><text x="514.0" y="214.0" font-size="13.5" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>tre eller flere atomer</tspan></text>
