<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 7 780 230" width="780" height="230" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Til venstre de to gasser, der ikke er drivhusgasser: nitrogen og oxygen, som begge består af to ens atomer. Til højre fire drivhusgasser: carbondioxid, methan, lattergas og vanddamp, som alle har tre eller flere atomer">
<title>Til venstre de to gasser, der ikke er drivhusgasser: nitrogen og oxygen, som begge består af to ens atomer. Til højre fire drivhusgasser: carbondioxid, methan, lattergas og vanddamp, som alle har tre eller flere atomer</title>
