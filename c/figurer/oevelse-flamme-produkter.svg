<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 724 302" width="724" height="302" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Tre trin med en bunsenbrænder, hvor flammen kun er tegnet som et stiplet omrids. 1: en kold porcelænsskål holdes med en digeltang ind i flammen, mens luftindtaget er lukket. 2: et koldt, tørt bægerglas holdes på hovedet over flammen med en tang, mens luftindtaget er åbent. 3: et bægerglas, der er skyllet med kalkvand, holdes på samme måde over flammen">
<title>Tre trin med en bunsenbrænder, hvor flammen kun er tegnet som et stiplet omrids. 1: en kold porcelænsskål holdes med en digeltang ind i flammen, mens luftindtaget er lukket. 2: et koldt, tørt bægerglas holdes på hovedet over flammen med en tang, mens luftindtaget er åbent. 3: et bægerglas, der er skyllet med kalkvand, holdes på samme måde over flammen</title>
