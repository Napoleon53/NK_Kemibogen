<title>Et termometer sidder i en klemme på et stativ og står i et bægerglas med vand, som er vandbad. Ved siden af kuglen sidder et lille reagensglas med 5 dråber af stoffet, holdt fast med en elastik. I det lille glas står et kapillarrør med den åbne ende nedad. En glasspatel står i vandbadet. Vandbadet varmes med vand fra en elkedel</title>
