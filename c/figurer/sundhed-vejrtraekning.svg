<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 9 740 283" width="740" height="283" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Øverst tre kuglemodeller: nitrogen, N2, med to blå kugler, oxygen, O2, med to røde kugler og carbondioxid, CO2, med en grå kugle i midten og to røde. Under dem to vandrette søjler, der hver er 100 procent. Luften, du ånder ind, er 78 procent nitrogen, 21 procent oxygen, 0,04 procent carbondioxid, som kun er en hårfin streg, og cirka 1 procent andre gasser. Luften, du ånder ud, er 78 procent nitrogen, 16 procent oxygen, 4 procent carbondioxid og cirka 2 procent andre gasser. Mellem søjlerne står, at oxygen falder fra 21 til 16 procent, og carbondioxid stiger fra 0,04 til 4 procent">
