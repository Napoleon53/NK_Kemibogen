<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 10 780 273" width="780" height="273" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Et snit gennem Atlanterhavet fra ækvator til Grønland. Varmt vand strømmer mod nord i overfladen. Nær Grønland optager det kolde vand carbondioxid, og det kolde, salte vand synker til bunds og strømmer tilbage mod syd i dybhavet. Det kommer først op igen efter flere hundrede år">
<title>Et snit gennem Atlanterhavet fra ækvator til Grønland. Varmt vand strømmer mod nord i overfladen. Nær Grønland optager det kolde vand carbondioxid, og det kolde, salte vand synker til bunds og strømmer tilbage mod syd i dybhavet. Det kommer først op igen efter flere hundrede år</title>
