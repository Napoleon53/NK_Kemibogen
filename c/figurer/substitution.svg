<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 11 700 154" width="700" height="154" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Substitution: hexan og dibrom bliver til 2-bromhexan og hydrogenbromid, når der er lys. En dobbeltpil på reaktantsiden viser, at hydrogenatomet på det andet carbonatom og det ene bromatom i dibrom bytter plads. Under tegningerne står reaktionsskemaet C6H14 + Br2 → C6H13Br + HBr">
