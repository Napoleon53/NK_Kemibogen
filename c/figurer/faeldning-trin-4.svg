<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 258" width="780" height="258" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Trin 4. Øverst reaktionsskemaet med hele saltene: bly(II)nitrat plus 2 KI bliver til fast PbI2 plus 2 KNO3, hvor KNO3 er markeret som tilskuerioner. Nederst ionskemaet uden tilskuerioner: Pb 2 plus i vand plus 2 I minus i vand bliver til fast PbI2">
<title>Trin 4. Øverst reaktionsskemaet med hele saltene: bly(II)nitrat plus 2 KI bliver til fast PbI2 plus 2 KNO3, hvor KNO3 er markeret som tilskuerioner. Nederst ionskemaet uden tilskuerioner: Pb 2 plus i vand plus 2 I minus i vand bliver til fast PbI2</title>
<text x="26.0" y="52.0" font-size="13" text-anchor="start" fill="#556766" font-weight="700"><tspan>Med hele saltene:</tspan></text><text x="386.0" y="52.0" font-size="20" text-anchor="end" font-weight="700"><tspan fill="#14201f"><tspan>Pb(NO</tspan><tspan dy="4.40" font-size="13.6">3</tspan><tspan dy="-4.40">)</tspan><tspan dy="4.40" font-size="13.6">2</tspan><tspan dy="-4.40">(aq) + ​</tspan></tspan><tspan fill="#0f766e"><tspan>2 ​</tspan></tspan><tspan fill="#14201f"><tspan>KI(aq)​</tspan></tspan></text><line x1="396.0" y1="45.0" x2="428.0" y2="45.0" stroke="#14201f" stroke-width="2.4" stroke-linecap="round"/><polygon points="438.0,45.0 428.0,50.0 428.0,40.0" fill="#14201f"/><text x="448.0" y="52.0" font-size="20" text-anchor="start" font-weight="700"><tspan fill="#14201f"><tspan>PbI</tspan><tspan dy="4.40" font-size="13.6">2</tspan><tspan dy="-4.40">(s) + ​</tspan></tspan><tspan fill="#8a9799"><tspan>2 KNO</tspan><tspan dy="4.40" font-size="13.6">3</tspan><tspan dy="-4.40">(aq)​</tspan></tspan></text><path d="M 536,62 v 5 h 106 v -5" fill="none" stroke="#8a9799" stroke-width="1.5"/><text x="589.0" y="82.0" font-size="13" text-anchor="middle" fill="#8a9799" font-weight="700"><tspan>tilskuerioner</tspan></text><text x="26.0" y="117.0" font-size="13" text-anchor="start" fill="#556766" font-weight="700"><tspan>Ionskemaet:</tspan></text><text x="386.0" y="118.0" font-size="22" text-anchor="end" font-weight="700"><tspan fill="#c0392b"><tspan>Pb</tspan><tspan dy="-8.36" font-size="15.0">2+</tspan><tspan dy="8.36">​</tspan></tspan><tspan fill="#14201f"><tspan>(aq) + ​</tspan></tspan><tspan fill="#0f766e"><tspan>2 ​</tspan></tspan><tspan fill="#1d4ed8"><tspan>I</tspan><tspan dy="-8.36" font-size="15.0">−</tspan><tspan dy="8.36">​</tspan></tspan><tspan fill="#14201f"><tspan>(aq)​</tspan></tspan></text><line x1="396.0" y1="110.0" x2="428.0" y2="110.0" stroke="#14201f" stroke-width="2.4" stroke-linecap="round"/><polygon points="438.0,110.0 428.0,115.0 428.0,105.0" fill="#14201f"/><text x="448.0" y="118.0" font-size="22" text-anchor="start" font-weight="700"><tspan fill="#14201f"><tspan>PbI</tspan><tspan dy="4.84" font-size="15.0">2</tspan><tspan dy="-4.84">​</tspan></tspan><tspan fill="#0f766e"><tspan>(s)​</tspan></tspan></text><rect x="140.0" y="156.0" width="500.0" height="92.0" rx="10" fill="#f4f8f7" stroke="#dfe9e8" stroke-width="1.2"/><text x="160.0" y="180.0" font-size="15" text-anchor="start" fill="#14201f"><tspan>PbI</tspan><tspan dy="3.30" font-size="10.2">2</tspan><tspan dy="-3.30"> har to I, så der skal 2 KI til og dannes 2 KNO</tspan><tspan dy="3.30" font-size="10.2">3</tspan><tspan dy="-3.30">.</tspan></text><text x="160.0" y="202.0" font-size="15" text-anchor="start" fill="#14201f"><tspan>K</tspan><tspan dy="-5.70" font-size="10.2">+</tspan><tspan dy="5.70"> og NO</tspan><tspan dy="3.30" font-size="10.2">3</tspan><tspan dy="-9.00" font-size="10.2">−</tspan><tspan dy="5.70"> er frie både før og efter: de er tilskuerioner.</tspan></text><text x="160.0" y="226.0" font-size="15" text-anchor="start" fill="#0f766e" font-weight="700"><tspan>Uden tilskuerionerne står ionskemaet tilbage.</tspan></text>
</svg>
