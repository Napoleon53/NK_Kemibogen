<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 628 151" width="628" height="151" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Trin 2. Oxidationen: Cu bliver til Cu2+ og 2 elektroner. Reduktionen er ganget med 2, fordi en sølv(I)ion kun optager 1 elektron: 2 Ag+ og 2 elektroner bliver til 2 Ag. De nye tal står i grønne rammer">
