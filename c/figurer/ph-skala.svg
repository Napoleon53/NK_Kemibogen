<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 2 740 255" width="740" height="255" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="pH-skalaen fra −1 til 15 med tretten stoffer fra hverdagen, fra mavesyre ved pH 1,5 over rent vand ved pH 7 til afløbsrens ved pH 14. I enderne står skalaens yderpunkter: koncentreret saltsyre ved pH −1,1 og mættet natriumhydroxid ved pH 15,3. Under skalaen står koncentrationen af oxoniumioner, fra 10 i første potens M ved pH −1 til 10 i minus 15. potens M ved pH 15, og koncentrationen af hydroxidioner, som går den modsatte vej. Ved pH 7 er begge 10 i minus 7. potens M">
<title>pH-skalaen fra −1 til 15 med tretten stoffer fra hverdagen, fra mavesyre ved pH 1,5 over rent vand ved pH 7 til afløbsrens ved pH 14. I enderne står skalaens yderpunkter: koncentreret saltsyre ved pH −1,1 og mættet natriumhydroxid ved pH 15,3. Under skalaen står koncentrationen af oxoniumioner, fra 10 i første potens M ved pH −1 til 10 i minus 15. potens M ved pH 15, og koncentrationen af hydroxidioner, som går den modsatte vej. Ved pH 7 er begge 10 i minus 7. potens M</title>
