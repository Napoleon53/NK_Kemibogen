<title>Tre udsnit med fire kæder. I termoplast, fx polyethen, er kæderne ikke bundet sammen. I vulkaniseret gummi er de bundet sammen af få broer med svovl. I hærdeplast, fx bakelit, er de bundet sammen af mange bindinger i et tæt netværk</title>
