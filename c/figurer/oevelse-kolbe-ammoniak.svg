<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 500" width="830" height="500" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En rundkolbe fyldt med ammoniakgas står på hovedet i et stativ. I halsen sidder en gummiprop med to huller: gennem det ene går et glasrør, som har en spids inde i kolben og går ned i et bægerglas med vand og phenolphthalein til lidt over bunden. I det andet hul sidder spidsen af en sprøjte med 2 mL vand. En lup viser proppen, glasrøret og sprøjten forstørret">
