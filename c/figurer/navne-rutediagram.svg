<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" width="640" height="236" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Rutediagram til at finde navnet på en ion">
<title>Rutediagram til at finde navnet på en ion</title>
<path d="M 320,42 V 63.0 H 185 V 75" fill="none" stroke="#556766" stroke-width="1.6" stroke-linejoin="round"/><polygon points="185,84 179.5,74 190.5,74" fill="#556766"/><text x="252.5" y="57.0" font-size="13.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>positiv</tspan></text><path d="M 320,42 V 63.0 H 520 V 75" fill="none" stroke="#556766" stroke-width="1.6" stroke-linejoin="round"/><polygon points="520,84 514.5,74 525.5,74" fill="#556766"/><text x="420.0" y="57.0" font-size="13.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>negativ</tspan></text><path d="M 185,122 V 145.0 H 98 V 159" fill="none" stroke="#556766" stroke-width="1.6" stroke-linejoin="round"/><polygon points="98,168 92.5,158 103.5,158" fill="#556766"/><text x="141.5" y="139.0" font-size="13.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>ja</tspan></text><path d="M 185,122 V 145.0 H 306 V 159" fill="none" stroke="#556766" stroke-width="1.6" stroke-linejoin="round"/><polygon points="306,168 300.5,158 311.5,158" fill="#556766"/><text x="245.5" y="139.0" font-size="13.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>nej</tspan></text><g class="peg-vejledning" data-tekst="Peg på en kasse, og se reglen og flere eksempler."/><g class="peg" data-titel="Hvilken ladning har ionen?" data-tekst="Positive ioner dannes af metaller. Negative ioner dannes af ikke-metaller." data-noegle="ladning"><rect x="195.0" y="4.0" width="250.0" height="38.0" rx="10" fill="#e3f2f0" stroke="#0f766e" stroke-width="1.6"/><text x="320.0" y="28.0" font-size="15.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Hvilken ladning har ionen?</tspan></text></g><g class="peg" data-titel="Står metallet i hovedgruppe 1, 2 eller 3?" data-tekst="Metallerne i hovedgruppe 1, 2 og 3 danner kun én slags ion. Metaller fra undergrupperne kan danne flere forskellige ioner, og derfor skal ladningen med i navnet. Det gælder også bly, som står i hovedgruppe 4: Pb^{2+} hedder bly(II)ion." data-noegle="hovedgruppe" data-med="ladning"><rect x="20.0" y="84.0" width="330.0" height="38.0" rx="10" fill="#e3f2f0" stroke="#0f766e" stroke-width="1.6"/><text x="185.0" y="108.0" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Står metallet i hovedgruppe 1, 2 eller 3?</tspan></text></g><g class="peg" data-titel="Negativ ion: navnet ender på ‑id" data-tekst="Navnet bygger på grundstoffets navn, men ender på ‑id. Ordet ion behøver ikke at komme med. Cl^{−} hedder chlorid, O^{2−} hedder oxid, og S^{2−} hedder sulfid." data-noegle="negativ" data-med="ladning"><rect x="413.0" y="84.0" width="214.0" height="62.0" rx="10" fill="#cfe0fb" stroke="#1d4ed8" stroke-width="1.6"/><text x="520.0" y="109.5" font-size="15" text-anchor="middle" fill="#12307f" font-weight="700"><tspan>Navnet ender på -id</tspan></text><text x="520.0" y="130.5" font-size="14" text-anchor="middle" fill="#14201f"><tspan>Cl</tspan><tspan dy="-5.32" font-size="9.5">−</tspan><tspan dy="5.32"> hedder chlorid</tspan></text></g><g class="peg" data-titel="Positiv ion fra hovedgruppe 1, 2 eller 3: navn + ion" data-tekst="Navnet er grundstoffets navn efterfulgt af ordet ion. Ladningen står ikke i navnet, fordi metallet kun danner én slags ion. Na^{+} hedder natriumion, og Mg^{2+} hedder magnesiumion." data-noegle="navn-ion" data-med="ladning hovedgruppe"><rect x="5.0" y="168.0" width="186.0" height="62.0" rx="10" fill="#fbd3ca" stroke="#c0392b" stroke-width="1.6"/><text x="98.0" y="193.5" font-size="15" text-anchor="middle" fill="#7a1f14" font-weight="700"><tspan>navn + ion</tspan></text><text x="98.0" y="214.5" font-size="14" text-anchor="middle" fill="#14201f"><tspan>Na</tspan><tspan dy="-5.32" font-size="9.5">+</tspan><tspan dy="5.32"> hedder natriumion</tspan></text></g><g class="peg" data-titel="Positiv ion fra en undergruppe eller bly: navn + (romertal) + ion" data-tekst="Metaller fra undergrupperne kan danne flere forskellige ioner, og derfor skrives ladningen som et romertal i en parentes lige efter grundstoffets navn. Fe^{2+} hedder jern(II)ion, Fe^{3+} hedder jern(III)ion, og Cu^{2+} hedder kobber(II)ion. Bly står i hovedgruppe 4, men danner også flere slags ioner, så Pb^{2+} hedder bly(II)ion." data-noegle="romertal" data-med="ladning hovedgruppe"><rect x="199.0" y="168.0" width="214.0" height="62.0" rx="10" fill="#fbd3ca" stroke="#c0392b" stroke-width="1.6"/><text x="306.0" y="193.5" font-size="15" text-anchor="middle" fill="#7a1f14" font-weight="700"><tspan>navn + (romertal) + ion</tspan></text><text x="306.0" y="214.5" font-size="14" text-anchor="middle" fill="#14201f"><tspan>Fe</tspan><tspan dy="-5.32" font-size="9.5">2+</tspan><tspan dy="5.32"> hedder jern(II)ion</tspan></text></g>
</svg>
