<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" width="442" height="297.5" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En glascylinder med gas og et stempel står på en varmeplade. En tyk pil trykker stemplet ned og står for trykket p. En klamme langs gassen viser volumenet V. Gassen er molekyler, som hver har en lille pil, der viser, at de bevæger sig, og tre streger fra n, stofmængden, peger på dem. Et termometer stikker ned i gassen og viser temperaturen T">
<title>En glascylinder med gas og et stempel står på en varmeplade. En tyk pil trykker stemplet ned og står for trykket p. En klamme langs gassen viser volumenet V. Gassen er molekyler, som hver har en lille pil, der viser, at de bevæger sig, og tre streger fra n, stofmængden, peger på dem. Et termometer stikker ned i gassen og viser temperaturen T</title>
