<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 2 720 211" width="612" height="179.3" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En oxoniumion afgiver en hydron til et ammoniakmolekyle. Elektronen fra hydrogenatomet har samme farve som H og bliver hos oxygen, så oxoniumionen bliver til vand. Hydronen sætter sig på det frie elektronpar hos nitrogen, og der dannes en ammoniumion, som er en svag syre">
<title>En oxoniumion afgiver en hydron til et ammoniakmolekyle. Elektronen fra hydrogenatomet har samme farve som H og bliver hos oxygen, så oxoniumionen bliver til vand. Hydronen sætter sig på det frie elektronpar hos nitrogen, og der dannes en ammoniumion, som er en svag syre</title>
