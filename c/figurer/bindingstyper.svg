<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 1 720 286" width="720" height="286" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Tre slags bindinger: upolær elektronparbinding, polær elektronparbinding og ionbinding. Elektronen fra hydrogen og natrium er grøn, og elektronen fra chlor er blå">
<title>Tre slags bindinger: upolær elektronparbinding, polær elektronparbinding og ionbinding. Elektronen fra hydrogen og natrium er grøn, og elektronen fra chlor er blå</title>
<rect x="8.0" y="8.0" width="228.0" height="244.0" rx="12" fill="#f4f8f7" stroke="#dfe9e8" stroke-width="1.2"/><text x="122.0" y="158.0" font-size="15.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Upolær elektronparbinding</tspan></text><text x="122.0" y="180.0" font-size="16" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>Cl−Cl</tspan></text><text x="122.0" y="200.0" font-size="15" text-anchor="middle" fill="#14201f"><tspan>ΔEN = 0</tspan></text><text x="122.0" y="222.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>Elektronparret ligger midt</tspan></text><text x="122.0" y="239.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>mellem de to atomer</tspan></text><rect x="246.0" y="8.0" width="228.0" height="244.0" rx="12" fill="#f4f8f7" stroke="#dfe9e8" stroke-width="1.2"/><text x="360.0" y="158.0" font-size="15.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Polær elektronparbinding</tspan></text><text x="360.0" y="180.0" font-size="16" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>H−Cl</tspan></text><text x="360.0" y="200.0" font-size="15" text-anchor="middle" fill="#14201f"><tspan>ΔEN = 0,9</tspan></text><text x="360.0" y="222.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>Hydrogen har delvist mistet</tspan></text><text x="360.0" y="239.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>sin elektron til chlor</tspan></text><rect x="484.0" y="8.0" width="228.0" height="244.0" rx="12" fill="#f4f8f7" stroke="#dfe9e8" stroke-width="1.2"/><text x="598.0" y="158.0" font-size="15.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Ionbinding</tspan></text><text x="598.0" y="180.0" font-size="16" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>Na</tspan><tspan dy="-6.08" font-size="10.9">+</tspan><tspan dy="6.08"> og Cl</tspan><tspan dy="-6.08" font-size="10.9">−</tspan></text><text x="598.0" y="200.0" font-size="15" text-anchor="middle" fill="#14201f"><tspan>ΔEN = 2,1</tspan></text><text x="598.0" y="222.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>Natrium har mistet sin</tspan></text><text x="598.0" y="239.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>elektron helt til chlor</tspan></text><circle cx="92.0" cy="72.0" r="39.4" fill="#6f93d6"/><circle cx="152.0" cy="72.0" r="39.4" fill="#6f93d6"/><circle cx="92.0" cy="72.0" r="38.0" fill="#c9dbf8"/><circle cx="152.0" cy="72.0" r="38.0" fill="#c9dbf8"/><line x1="122.0" y1="24.0" x2="122.0" y2="120.0" stroke="#556766" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/><text x="122.0" y="134.0" font-size="12" text-anchor="middle" fill="#556766"><tspan>midten</tspan></text><circle cx="122.0" cy="64.0" r="5.4" fill="#2f6fde" stroke="#1b4aa3" stroke-width="0.8"/><circle cx="122.0" cy="80.0" r="5.4" fill="#2f6fde" stroke="#1b4aa3" stroke-width="0.8"/><text x="80.0" y="79.0" font-size="20" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Cl</tspan></text><text x="164.0" y="79.0" font-size="20" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Cl</tspan></text><circle cx="324.0" cy="72.0" r="29.4" fill="#7cbf8e"/><circle cx="386.0" cy="72.0" r="41.4" fill="#6f93d6"/><circle cx="324.0" cy="72.0" r="28.0" fill="#e6f4ea"/><circle cx="386.0" cy="72.0" r="40.0" fill="#c9dbf8"/><line x1="355.0" y1="24.0" x2="355.0" y2="120.0" stroke="#556766" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/><text x="355.0" y="134.0" font-size="12" text-anchor="middle" fill="#556766"><tspan>midten</tspan></text><circle cx="368.0" cy="64.0" r="5.4" fill="#2e9e4f" stroke="#1d6b34" stroke-width="0.8"/><circle cx="368.0" cy="80.0" r="5.4" fill="#2f6fde" stroke="#1b4aa3" stroke-width="0.8"/><line x1="356.0" y1="42.0" x2="364.0" y2="42.0" stroke="#b45309" stroke-width="2.4" stroke-linecap="round"/><polygon points="372.0,42.0 364.0,46.0 364.0,38.0" fill="#b45309"/><text x="319.0" y="79.0" font-size="20" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>H</tspan></text><text x="404.0" y="79.0" font-size="20" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Cl</tspan></text><text x="319.0" y="34.0" font-size="17" text-anchor="middle" fill="#c0392b" font-weight="700"><tspan>δ+</tspan></text><text x="400.0" y="23.0" font-size="17" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>δ−</tspan></text><circle cx="534.0" cy="72.0" r="16.0" fill="#fbd3ca" stroke="#c0392b" stroke-width="1.5"/><text x="534.0" y="78.0" font-size="15" text-anchor="middle" fill="#7a1f14" font-weight="700"><tspan>Na</tspan></text><text x="534.0" y="46.0" font-size="20" text-anchor="middle" fill="#c0392b" font-weight="700"><tspan>+</tspan></text><circle cx="620.0" cy="72.0" r="47.4" fill="#6f93d6"/><circle cx="620.0" cy="72.0" r="46.0" fill="#c9dbf8"/><circle cx="600.0" cy="64.0" r="5.4" fill="#2e9e4f" stroke="#1d6b34" stroke-width="0.8"/><circle cx="600.0" cy="80.0" r="5.4" fill="#2f6fde" stroke="#1b4aa3" stroke-width="0.8"/><text x="636.0" y="79.0" font-size="20" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Cl</tspan></text><text x="620.0" y="19.0" font-size="20" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>−</tspan></text><circle cx="196.0" cy="273.0" r="5.4" fill="#2e9e4f" stroke="#1d6b34" stroke-width="0.8"/><text x="208.0" y="278.0" font-size="13.5" text-anchor="start" fill="#556766"><tspan>elektron fra hydrogen eller natrium</tspan></text><circle cx="468.0" cy="273.0" r="5.4" fill="#2f6fde" stroke="#1b4aa3" stroke-width="0.8"/><text x="480.0" y="278.0" font-size="13.5" text-anchor="start" fill="#556766"><tspan>elektron fra chlor</tspan></text>
