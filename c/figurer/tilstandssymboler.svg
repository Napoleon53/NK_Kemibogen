<title>Fire tilstandssymboler. (s) er et fast stof, hvor partiklerne sidder tæt og ordnet. (l) er en væske, hvor partiklerne ligger tæt, men uordnet, og kan flytte sig. (g) er en gas, hvor partiklerne er langt fra hinanden og farer rundt. (aq) betyder opløst i vand, og partiklerne er spredt mellem vandmolekylerne</title>
