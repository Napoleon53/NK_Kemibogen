<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 886 540" width="886" height="540" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Bromvandstesten i to rækker. Øverst en alkan med kun enkeltbindinger: efter omrystning er brommolekylerne flyttet op i det øverste lag, som bliver gult, og der sker ingen reaktion. Står glasset derefter i sollys, forsvinder farven langsomt, fordi bromatomer skifter hydrogenatomer ud på carbonkæderne. Nederst en alken med en dobbeltbinding: efter omrystning sidder bromatomerne på carbonkæderne, og begge lag er farveløse">
