<title>Tre måder at svinge på. Når nitrogen strækker sig, er ladningen altid lige fordelt. Når carbondioxid strækker sig lige ud, er ladningen stadig lige fordelt. Når carbondioxid bøjer, kommer begge oxygenatomer over på samme side, ladningen bliver skævt fordelt, og molekylet kan optage varme</title>
