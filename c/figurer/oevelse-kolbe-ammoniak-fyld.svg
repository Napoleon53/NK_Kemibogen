<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 3 760 446" width="760" height="446" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="I et stinkskab hænger en tør rundkolbe med åbningen nedad i et stativ. Et reagensglas med koncentreret ammoniakvand og en prop står i et bægerglas med varmt vand, og fra proppen går en slange over til et glasrør, som går op gennem kolbens åbning helt op i toppen af kolben. Stiplede pile viser ammoniakgassen, der fylder kolben oppefra, og luften, der bliver skubbet ud forneden, hvor et stykke fugtigt rødt lakmuspapir holdes i en pincet">
<title>I et stinkskab hænger en tør rundkolbe med åbningen nedad i et stativ. Et reagensglas med koncentreret ammoniakvand og en prop står i et bægerglas med varmt vand, og fra proppen går en slange over til et glasrør, som går op gennem kolbens åbning helt op i toppen af kolben. Stiplede pile viser ammoniakgassen, der fylder kolben oppefra, og luften, der bliver skubbet ud forneden, hvor et stykke fugtigt rødt lakmuspapir holdes i en pincet</title>
