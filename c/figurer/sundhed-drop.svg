<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 236" width="750" height="236" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Et rødt blodlegeme i tre væsker. I rent vand trænger vand ind i cellen, og cellen svulmer op og bliver rund. I saltvandsdrop med 0,9 procent salt går lige meget vand ind og ud, og cellen er uændret. I meget salt vand trækkes vand ud af cellen, og cellen skrumper og får en takket kant. Blå pile viser, hvilken vej vandet går">
<title>Et rødt blodlegeme i tre væsker. I rent vand trænger vand ind i cellen, og cellen svulmer op og bliver rund. I saltvandsdrop med 0,9 procent salt går lige meget vand ind og ud, og cellen er uændret. I meget salt vand trækkes vand ud af cellen, og cellen skrumper og får en takket kant. Blå pile viser, hvilken vej vandet går</title>
