<title>En tynd pose hænger med åbningen nedad over en skorsten af metal. Under skorstenen står fyrfadslys på en bageplade. I posens åbning sidder en ring af ståltråd med papirclips som last, og et termometer har sin føler i toppen af posen.</title>
